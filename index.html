// ── データの持ち運び（ZIPで書き出し／読み込み）───────────────────────────────
// 中身は data.json（テーマ・単元・問題・記録・カレンダー）と photos/ の画像。
// ネットには何も送らない。ファイルを自分で運ぶ方式。

function dataUrlToBlob(dataUrl) {
  const [head, b64] = String(dataUrl).split(',');
  const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b64 || '');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

// テーマを1つだけ書き出すこともできる（全部入りは重くなるため）
function sliceData(data, themeId) {
  if (!themeId) return data;
  const themes = data.themes.filter(t => t.id === themeId);
  const units = data.units.filter(u => u.themeId === themeId);
  const ids = new Set(units.flatMap(u => u.questions.map(q => q.id)));
  const records = {};
  const photos = {};
  Object.keys(data.records).forEach(k => { if (ids.has(k)) records[k] = data.records[k]; });
  Object.keys(data.photos).forEach(k => { if (ids.has(k)) photos[k] = photoIdsOf(data.photos, k); });
  return { themes, units, records, photos, calendar: data.calendar };
}

async function exportZip(data, themeId) {
  if (typeof JSZip === 'undefined') throw new Error('ZIPの部品を読み込めませんでした（通信をご確認ください）');
  const slice = sliceData(data, themeId);
  const zip = new JSZip();
  zip.file('data.json', JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data: slice }, null, 1));
  const folder = zip.folder('photos');
  let count = 0;
  for (const qid of Object.keys(slice.photos)) {
    for (const pid of photoIdsOf(slice.photos, qid)) {
      const full = await loadPhoto(pid);
      if (!full) continue;
      folder.file(`${pid}.jpg`, dataUrlToBlob(full));
      const thumb = await loadThumb(pid);
      if (thumb) folder.file(`${pid}.thumb.jpg`, dataUrlToBlob(thumb));
      count++;
    }
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 1 } });
  // ファイル名に日本語を入れると、ブラウザによっては名前ごと落ちて拡張子も消える（＝読み込めない）
  const themeName = themeId ? (slice.themes[0] || {}).name || '' : '';
  const ascii = themeName.replace(/[^A-Za-z0-9]+/g, '').slice(0, 20);
  const label = themeId
    ? (ascii || `theme${Math.max(1, data.themes.findIndex(t => t.id === themeId) + 1)}`)
    : 'all';
  const stamp = todayStr().replace(/-/g, '');
  return {
    blob,
    filename: `kakomon_${label}_${stamp}.zip`,
    photoCount: count,
    label: themeName || 'すべて',
  };
}

// claude.ai の公開ページは zip を保存できない（許可された拡張子に無い）ので、
// その場ではJSONに写真を埋め込んで書き出す。GitHub Pages など通常のサイトではZIPを使う。
async function exportJson(data, themeId) {
  const slice = sliceData(data, themeId);
  const images = {};
  let count = 0;
  for (const qid of Object.keys(slice.photos)) {
    for (const pid of photoIdsOf(slice.photos, qid)) {
      const full = await loadPhoto(pid);
      if (!full) continue;
      images[pid] = { full, thumb: await loadThumb(pid) };
      count++;
    }
  }
  const themeName = themeId ? (slice.themes[0] || {}).name || '' : '';
  const ascii = themeName.replace(/[^A-Za-z0-9]+/g, '').slice(0, 20);
  const label = themeId
    ? (ascii || `theme${Math.max(1, data.themes.findIndex(t => t.id === themeId) + 1)}`)
    : 'all';
  const text = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), data: slice, images });
  return {
    blob: new Blob([text], { type: 'application/json' }),
    filename: `kakomon_${label}_${todayStr().replace(/-/g, '')}.json`,
    photoCount: count,
    label: themeName || 'すべて',
  };
}

// 公開ページの中で動いているか（ここでは保存の仕組みが違う）
function artifactDownloads() {
  const c = typeof window !== 'undefined' ? window.claude : null;
  return c && typeof c.use === 'function' ? c.use('downloads') : Promise.resolve(null);
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function readBackup(file) {
  const name = String(file.name || '').toLowerCase();
  if (name.endsWith('.json') || file.type === 'application/json') {
    const parsed = JSON.parse(await file.text());
    return { incoming: migrate(parsed.data || parsed), images: parsed.images || {} };
  }
  return readZip(file);
}

async function readZip(file) {
  if (typeof JSZip === 'undefined') throw new Error('ZIPの部品を読み込めませんでした（通信をご確認ください）');
  const zip = await JSZip.loadAsync(file);
  const entry = zip.file('data.json');
  if (!entry) throw new Error('このZIPにはデータが入っていません（data.json が見つかりません）');
  const parsed = JSON.parse(await entry.async('string'));
  const incoming = migrate(parsed.data || parsed);
  const images = {}; // 写真ID → { full, thumb }
  const files = zip.folder('photos');
  if (files) {
    const jobs = [];
    files.forEach((path, f) => {
      if (f.dir) return;
      const m = path.match(/^(.+?)(\.thumb)?\.jpg$/);
      if (!m) return;
      jobs.push(f.async('blob').then(async b => {
        const url = await blobToDataUrl(b);
        images[m[1]] = images[m[1]] || {};
        images[m[1]][m[2] ? 'thumb' : 'full'] = url;
      }));
    });
    await Promise.all(jobs);
  }
  return { incoming, images };
}

// 取り込んだデータのIDを全部振り直す。今あるデータとぶつからないようにするため
function remapIds(incoming, images) {
  const themeMap = {}, unitMap = {}, qMap = {}, pMap = {};
  const themes = incoming.themes.map(t => {
    const id = newThemeId() + Math.random().toString(36).slice(2, 6);
    themeMap[t.id] = id;
    return { ...t, id };
  });
  const units = incoming.units.map(u => {
    const id = `u${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
    unitMap[u.id] = id;
    return {
      ...u, id, themeId: themeMap[u.themeId] || (themes[0] || {}).id,
      questions: u.questions.map(q => {
        const qid = newQuestionId() + Math.random().toString(36).slice(2, 4);
        qMap[q.id] = qid;
        return { ...q, id: qid };
      }),
    };
  });
  const records = {};
  Object.keys(incoming.records || {}).forEach(k => { if (qMap[k]) records[qMap[k]] = incoming.records[k]; });
  const photos = {};
  const remappedImages = {};
  Object.keys(incoming.photos || {}).forEach(k => {
    if (!qMap[k]) return;
    photos[qMap[k]] = photoIdsOf(incoming.photos, k).map(pid => {
      const np = newPhotoId() + Math.random().toString(36).slice(2, 4);
      pMap[pid] = np;
      if (images[pid]) remappedImages[np] = images[pid];
      return np;
    });
  });
  return { themes, units, records, photos, calendar: incoming.calendar || {}, images: remappedImages };
}

async function storeImages(images) {
  for (const pid of Object.keys(images)) {
    const { full, thumb } = images[pid];
    if (!full) continue;
    await photoTx('readwrite', st => { st.put(full, pid); return st.put(thumb || full, pid + THUMB_SUFFIX); });
  }
}

// ── 持ち運びの操作パネル ───────────────────────────────────────────────────────
function TransferPanel({ data, setData, setMsg, sel }) {
  const [busy, setBusy] = useState('');
  const [pending, setPending] = useState(null); // 読み込んだ中身の確認待ち
  const [scope, setScope] = useState('');       // '' は全部

  async function doExport() {
    setBusy('書き出し中…');
    try {
      const dl = await artifactDownloads();
      const out = dl ? await exportJson(data, scope || null) : await exportZip(data, scope || null);
      const size = `${Math.round(out.blob.size / 1024 / 1024 * 10) / 10}MB`;
      if (dl) {
        await dl.save({ filename: out.filename, data: out.blob });
        setMsg(`「${out.label}」を書き出しました（写真${out.photoCount}枚・${size}）　ファイル名: ${out.filename}`);
      } else {
        saveBlob(out.blob, out.filename);
        setMsg(`「${out.label}」を書き出しました（写真${out.photoCount}枚・${size}）　ファイル名: ${out.filename}`);
      }
    } catch (e) {
      const code = e && e.code;
      setMsg(code === 'declined' ? '保存を取り消しました'
        : code ? `書き出せませんでした（${code}）`
        : '書き出せませんでした: ' + (e && e.message ? e.message : e));
    }
    setBusy('');
  }

  async function pickFile(file) {
    if (!file) return;
    setBusy('読み込み中…');
    try {
      const { incoming, images } = await readBackup(file);
      setPending({
        ...remapIds(incoming, images),
        summary: {
          themes: incoming.themes.length,
          units: incoming.units.length,
          questions: incoming.units.reduce((n, u) => n + u.questions.length, 0),
          photos: Object.keys(images).length,
          days: Object.keys(incoming.calendar || {}).length,
        },
      });
      setMsg('');
    } catch (e) {
      setMsg('読み込めませんでした: ' + (e && e.message ? e.message : e));
    }
    setBusy('');
  }

  // 追加のとき、同じ名前のテーマは1つにまとめる。
  // まとめないと、同じテーマの分を取り込むたびにテーマが増えてしまう。
  function mergeInto(current) {
    const byName = new Map(current.themes.map(t => [String(t.name).trim(), t.id]));
    const idMap = {};
    const addThemes = [];
    pending.themes.forEach(t => {
      const key = String(t.name).trim();
      const hit = byName.get(key);
      if (hit) { idMap[t.id] = hit; return; }
      addThemes.push(t);
      byName.set(key, t.id);
    });
    const units = pending.units.map(u => (idMap[u.themeId] ? { ...u, themeId: idMap[u.themeId] } : u));
    const first = pending.themes[0];
    return {
      addThemes, units, mergedCount: Object.keys(idMap).length,
      focusThemeId: first ? (idMap[first.id] || first.id) : '',
    };
  }

  async function apply(mode) {
    if (!pending) return;
    setBusy('取り込み中…');
    try {
      await storeImages(pending.images);
      const plan = mode === 'replace' ? null : mergeInto(data);
      setData(d => mode === 'replace'
        ? {
            themes: pending.themes, units: pending.units,
            records: pending.records, photos: pending.photos, calendar: pending.calendar,
          }
        : {
            ...d,
            themes: [...d.themes, ...plan.addThemes],
            units: [...d.units, ...plan.units],
            records: { ...d.records, ...pending.records },
            photos: { ...d.photos, ...pending.photos },
            calendar: { ...pending.calendar, ...d.calendar },
          });
      // 取り込んだテーマをそのまま開く（どこに入ったか分かるように）
      const focus = mode === 'replace' ? (pending.themes[0] || {}).id : plan.focusThemeId;
      if (sel && sel.setThemeId && focus) sel.setThemeId(focus);
      setMsg(mode === 'replace'
        ? '読み込んだデータに置き換えました（Ctrl+Z で元に戻せます）'
        : `今のデータに追加しました（単元${pending.units.length}件`
          + (plan.mergedCount ? `／同じ名前のテーマ${plan.mergedCount}件はまとめました` : '')
          + '）　Ctrl+Z で元に戻せます');
      setPending(null);
    } catch (e) {
      setMsg('取り込めませんでした: ' + (e && e.message ? e.message : e));
    }
    setBusy('');
  }

  const photoTotal = Object.keys(data.photos).reduce((n, k) => n + photoIdsOf(data.photos, k).length, 0);

  return h('div', { style: { background: '#fff', borderTop: '1px solid #d9d9d9', padding: '12px' } },
    h('div', { className: 'flex flex-wrap items-end gap-3' },
      h('div', null,
        h('label', { className: 'xl-label' }, '書き出す範囲'),
        h('select', {
          title: '書き出す範囲', value: scope, onChange: e => setScope(e.target.value), style: { minWidth: '200px' },
        },
          h('option', { value: '' }, `すべて（写真${photoTotal}枚）`),
          data.themes.map(t => h('option', { key: t.id, value: t.id }, t.name))
        )
      ),
      h('button', { className: 'xl-btn', onClick: doExport, disabled: !!busy }, '📦 書き出す'),
      h('label', { className: 'xl-btn xl-btn-sub', style: { cursor: 'pointer' } },
        '📂 ファイルを読み込む',
        h('input', {
          type: 'file', accept: '.zip,.json,application/zip,application/json', style: { display: 'none' },
          onChange: e => { pickFile(e.target.files[0]); e.target.value = ''; },
        })
      ),
      busy && h('span', { style: { fontSize: '12px', color: '#666' } }, busy),
      h('span', { style: { fontSize: '12px', color: '#666' } },
        '書き出したファイルをスマホに移して読み込むと、写真ごと持っていけます')
    ),

    pending && h('div', {
      style: { marginTop: '10px', border: '1px solid #e0c96b', background: '#fff7d6', borderRadius: '3px', padding: '10px' },
    },
      h('div', { style: { fontSize: '13px', marginBottom: '8px' } },
        `読み込んだ内容：テーマ${pending.summary.themes}件 ／ 単元${pending.summary.units}件 ／ 問題${pending.summary.questions}件 ／ 写真${pending.summary.photos}枚 ／ カレンダー${pending.summary.days}日`),
      h('div', { className: 'flex flex-wrap gap-2' },
        h('button', { className: 'xl-btn', onClick: () => apply('merge'), disabled: !!busy }, '今のデータに追加する'),
        h('button', {
          className: 'xl-btn', style: { background: '#a11', borderColor: '#800' },
          onClick: () => apply('replace'), disabled: !!busy,
        }, '今のデータを置き換える'),
        h('button', { className: 'xl-btn xl-btn-sub', onClick: () => setPending(null), disabled: !!busy }, 'やめる')
      )
    )
  );
}

// ── 過去問演習（出題／単元管理）────────────────────────────────────────────────
function PracticeHub({ data, setData, onShowPhoto, tab, setTab, progress, setProgress, markQuestionDone }) {
  const [msg, setMsg] = useState('');
  const [linkView, setLinkView] = useState(null); // アプリの中で開いている問題
  const isPhone = useIsPhone();
  // 前に開いていた単元をそのまま開き直す（毎回選び直さなくて済むように）
  const restored = useRef(loadDraw());
  // テーマと単元の選択はタブをまたいで保つ
  const [themeId, setThemeId] = useState(() => {
    const r = restored.current;
    if (r && r.themeId && data.themes.some(t => t.id === r.themeId)) return r.themeId;
    return data.themes[0] ? data.themes[0].id : '';
  });
  const [unitId, setUnitId] = useState(() => (restored.current && restored.current.unitId) || '');

  const theme = data.themes.find(t => t.id === themeId) || data.themes[0];
  const unitsOfTheme = data.units.filter(u => u.themeId === (theme ? theme.id : ''));
  const unit = unitsOfTheme.find(u => u.id === unitId) || unitsOfTheme[0];
  const sel = {
    theme, unitsOfTheme, unit,
    setThemeId: id => { setThemeId(id); setUnitId(''); },
    setUnitId,
  };

  useEffect(() => {
    if (!msg) return;
    const id = setTimeout(() => setMsg(''), 4000);
    return () => clearTimeout(id);
  }, [msg]);

  const onOpenLink = qid => { play('open'); markQuestionDone(qid); setLinkView({ qid }); };

  // 単元管理で単元を変えたら、出題側にも引き継ぐ（出題側は自分で保存している）
  useEffect(() => {
    if (tab !== 'units' || !unit) return;
    const prev = loadDraw() || {};
    const t = theme ? theme.id : '';
    if (prev.themeId === t && prev.unitId === unit.id) return;
    saveDraw({ ...prev, themeId: t, unitId: unit.id });
  }, [tab, theme ? theme.id : '', unit ? unit.id : '']);

  return h('div', { className: 'px-6 py-6 pb-safe xl-pad' },
    // スマホは左右になぞって移るので、タブのボタンは出さない
    (!isPhone || msg) && h('div', { className: 'flex items-center justify-between mb-3' },
      h('div', { className: 'flex gap-1' },
        !isPhone && h('button', {
          onClick: () => setTab('draw'),
          className: `text-xs font-semibold px-4 py-2 rounded-t-lg transition-colors ${tab === 'draw' ? 'bg-gray-100 text-gray-900' : 'bg-gray-900 text-gray-400 hover:text-white'}`
        }, '出題'),
        !isPhone && h('button', {
          onClick: () => setTab('units'),
          className: `text-xs font-semibold px-4 py-2 rounded-t-lg transition-colors ${tab === 'units' ? 'bg-gray-100 text-gray-900' : 'bg-gray-900 text-gray-400 hover:text-white'}`
        }, '単元管理')
      ),
      msg && h('span', { className: 'text-xs text-green-300' }, msg)
    ),
    tab === 'draw'
      ? h(DrawPage, { data, setData, onShowPhoto, setMsg, sel, onOpenLink, progress, setProgress, markQuestionDone })
      : h(UnitsPage, { data, setData, onShowPhoto, setMsg, sel, onOpenLink }),

    linkView && (() => {
      const u = data.units.find(x => x.questions.some(q => q.id === linkView.qid));
      const i = u ? u.questions.findIndex(q => q.id === linkView.qid) : -1;
      if (i < 0 || !u.questions[i].url) return null;
      return h(LinkViewer, {
        url: u.questions[i].url,
        no: i + 1,
        unitName: u.name,
        record: data.records[linkView.qid] || { correct: 0, wrong: 0 },
        onSetCount: (field, value) => setCountFor(linkView.qid, field, value, setData),
        onClose: () => setLinkView(null),
      });
    })()
  );
}

// ── カレンダー（日付のマスに直接書き込む）────────────────────────────────────
const WEEK_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

function CalendarPage({ data, setData }) {
  const isPhone = useIsPhone();
  const now = new Date();
  const [cursor, setCursor] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [selected, setSelected] = useState(todayStr());

  const first = new Date(cursor.y, cursor.m, 1);
  const daysInMonth = new Date(cursor.y, cursor.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const today = todayStr();
  const monthPrefix = `${cursor.y}-${String(cursor.m + 1).padStart(2, '0')}`;
  const writtenThisMonth = Object.keys(data.calendar)
    .filter(k => k.startsWith(monthPrefix) && data.calendar[k]).length;

  function moveMonth(delta) {
    const d = new Date(cursor.y, cursor.m + delta, 1);
    setCursor({ y: d.getFullYear(), m: d.getMonth() });
  }
  // マスに入力したそのまま保存する
  function writeMemo(key, text) {
    setData(d => {
      const calendar = { ...d.calendar };
      if (text) calendar[key] = text;
      else delete calendar[key];
      return { ...d, calendar };
    });
  }

  return h('div', { className: 'px-6 py-6 pb-safe xl-pad' },
    h('div', { className: 'xl-app' },
      h('div', { className: 'xl-toolbar flex items-center gap-3' },
        h('button', { className: 'xl-btn xl-btn-sub', onClick: () => moveMonth(-1) }, '◀'),
        h('span', { style: { fontSize: '15px', fontWeight: 600, minWidth: '130px', textAlign: 'center' } },
          `${cursor.y}年 ${cursor.m + 1}月`),
        h('button', { className: 'xl-btn xl-btn-sub', onClick: () => moveMonth(1) }, '▶'),
        h('button', {
          className: 'xl-btn xl-btn-sub',
          onClick: () => setCursor({ y: now.getFullYear(), m: now.getMonth() }),
        }, '今日'),
        h('span', { style: { fontSize: '12px', color: '#666', marginLeft: 'auto' } },
          isPhone ? '日付をタップして下の欄に書きます' : 'マスをクリックしてそのまま書き込めます（自動で保存されます）')
      ),

      h('table', { className: 'cal-table' },
        h('thead', null,
          h('tr', null, WEEK_LABELS.map((w, i) => h('th', {
            key: w,
            style: { color: i === 0 ? '#c00000' : (i === 6 ? '#0070c0' : '#333') },
          }, w)))
        ),
        h('tbody', null,
          Array.from({ length: cells.length / 7 }, (_, wk) => h('tr', { key: wk },
            cells.slice(wk * 7, wk * 7 + 7).map((d, dow) => {
              if (d === null) return h('td', { key: dow, className: 'cal-out' });
              const key = dateStr(cursor.y, cursor.m, d);
              const memo = data.calendar[key] || '';
              const cls = ['cal-cell',
                key === today ? 'cal-today' : '',
                dow === 0 ? 'cal-sun' : (dow === 6 ? 'cal-sat' : '')].filter(Boolean).join(' ');
              return h('td', {
                key: dow,
                className: cls + (isPhone && key === selected ? ' cal-picked' : ''),
                onClick: isPhone ? () => setSelected(key) : undefined,
                style: isPhone && key === selected ? { outline: '2px solid #217346', outlineOffset: '-2px' } : undefined,
              },
                h('div', { className: 'cal-day' },
                  h('span', null, d),
                  !isPhone && key === today && h('span', { style: { fontSize: '10px' } }, '今日'),
                  isPhone && memo && h('span', { className: 'cal-dot' })
                ),
                h('textarea', {
                  className: 'cal-memo',
                  value: memo,
                  placeholder: '',
                  onChange: e => writeMemo(key, e.target.value),
                })
              );
            })
          ))
        )
      ),

      isPhone && h('div', { style: { background: '#fff', borderTop: '1px solid #d9d9d9', padding: '10px' } },
        h('div', { style: { fontSize: '13px', fontWeight: 600, marginBottom: '6px' } },
          `${selected} のメモ（入力すると自動で保存されます）`),
        h('textarea', {
          className: 'xl-input',
          value: data.calendar[selected] || '',
          style: { width: '100%', minHeight: '120px', fontSize: '16px' },
          placeholder: '例）離散数学を20問。9/15までに応用数学を1周する。',
          onChange: e => writeMemo(selected, e.target.value),
        })
      ),

      h('div', { className: 'xl-status' },
        `${cursor.y}年${cursor.m + 1}月 ｜ 書き込みのある日 ${writtenThisMonth}日`)
    )
  );
}

// ── ポモドーロタイマー ────────────────────────────────────────────────────────
function PomodoroTimer() {
  const randomStudy = () => (Math.floor(Math.random() * 16) + 10) * 60; // 10〜25分
  const BREAK = 5 * 60;

  const [isBreak, setIsBreak] = useState(false);
  const [total, setTotal] = useState(randomStudy);
  const [left, setLeft] = useState(() => randomStudy());
  const [running, setRunning] = useState(false);
  // スマホでは操作を隠してしまうので、最初は畳んでおく
  const [open, setOpen] = useState(() => !(typeof matchMedia === 'function' && matchMedia('(max-width: 720px)').matches));
  const ref = useRef(null);

  useEffect(() => {
    if (!running) return;
    ref.current = setInterval(() => {
      setLeft(l => {
        if (l <= 1) {
          clearInterval(ref.current);
          setRunning(false);
          if (!isBreak) {
            // 勉強終了 → 休憩へ
            setIsBreak(true);
            setTotal(BREAK);
            setLeft(BREAK);
            new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAA==').play().catch(()=>{});
            if (Notification.permission === 'granted') new Notification('休憩時間！5分休みましょう☕');
          } else {
            // 休憩終了 → 勉強へ
            const s = randomStudy();
            setIsBreak(false);
            setTotal(s);
            setLeft(s);
            if (Notification.permission === 'granted') new Notification('勉強再開！集中しよう📚');
          }
          return 0;
        }
        return l - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, [running, isBreak]);

  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(left % 60).padStart(2, '0');
  const pct = Math.round((1 - left / total) * 100);

  function start() {
    if (Notification.permission === 'default') Notification.requestPermission();
    setRunning(true);
  }
  function reset() {
    clearInterval(ref.current);
    setRunning(false);
    const s = randomStudy();
    setIsBreak(false);
    setTotal(s);
    setLeft(s);
  }

  if (!open) {
    return h('button', {
      onClick: () => setOpen(true),
      className: 'pomo-btn fixed right-4 bg-gray-900 border border-gray-700 rounded-full w-12 h-12 flex items-center justify-center text-xl shadow-lg hover:border-blue-500 transition-colors z-50'
    }, '🍅');
  }

  return h('div', {
    className: 'pomo-btn fixed right-4 bg-gray-900 border border-gray-700 rounded-2xl p-4 shadow-xl z-50 w-44'
  },
    // ヘッダー
    h('div', { className: 'flex items-center justify-between mb-3' },
      h('span', { className: `text-xs font-semibold ${isBreak ? 'text-green-400' : 'text-orange-400'}` },
        isBreak ? '☕ 休憩中' : '📚 勉強中'
      ),
      h('button', { onClick: () => setOpen(false), className: 'text-gray-600 hover:text-gray-400 text-xs' }, '×')
    ),

    // 時間表示
    h('div', { className: 'text-center mb-3' },
      h('div', { className: `text-3xl font-mono font-bold ${isBreak ? 'text-green-400' : 'text-orange-400'}` },
        `${mm}:${ss}`
      ),
      h('div', { className: 'text-xs text-gray-500 mt-1' },
        isBreak ? '5分休憩' : `${Math.round(total/60)}分集中`
      )
    ),

    // プログレスバー
    h('div', { className: 'w-full bg-gray-800 rounded-full h-1.5 mb-3' },
      h('div', {
        className: `h-1.5 rounded-full transition-all ${isBreak ? 'bg-green-500' : 'bg-orange-500'}`,
        style: { width: `${pct}%` }
      })
    ),

    // ボタン
    h('div', { className: 'flex gap-2' },
      h('button', {
        onClick: running ? () => { clearInterval(ref.current); setRunning(false); } : start,
        className: `flex-1 text-xs py-1.5 rounded-lg font-semibold transition-colors ${
          running
            ? 'bg-gray-700 hover:bg-gray-600 text-white'
            : 'bg-orange-600 hover:bg-orange-500 text-white'
        }`
      }, running ? '一時停止' : 'スタート'),
      h('button', {
        onClick: reset,
        className: 'text-xs px-2 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors'
      }, 'リセット')
    )
  );
}

// ── アプリ本体 ────────────────────────────────────────────────────────────────
// スマホは左右になぞってこの順に移る
const SCREENS = [
  { id: 'draw', label: '出題' },
  { id: 'units', label: '単元管理' },
  { id: 'calendar', label: 'カレンダー' },
];
const SCREEN_ICONS = { draw: '🎲', units: '📚', calendar: '📅' };
const NAV_TABS = [
  { id: 'practice', label: '🎲 過去問演習' },
  { id: 'calendar', label: '📅 カレンダー' },
];

const UNDO_LIMIT = 50;

function App() {
  const isPhone = useIsPhone();
  // 画面は 出題 → 単元管理 → カレンダー の並び。なぞって前後に移る。
  const [tab, setTab] = useState('draw');
  const [themeMode, setThemeMode] = useState(() => loadThemeMode());
  const [settings, setSettings] = useState(false);
  const [progress, setProgress] = useState(() => loadProgress());
  const markQuestionDone = qid => setProgress(p => markDone(p, qid));

  useEffect(() => {
    applyTheme(themeMode);
    if (themeMode !== 'auto' || !window.matchMedia) return undefined;
    // 端末に合わせる設定のときは、端末側が切り替わったら追いかける
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => applyTheme('auto');
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', onChange) : mq.removeListener(onChange); };
  }, [themeMode]);
  const mode = tab === 'calendar' ? 'calendar' : 'practice';
  const setMode = id => setTab(id === 'calendar' ? 'calendar' : 'draw');
  const index = Math.max(0, SCREENS.findIndex(sc => sc.id === tab));

  // 指の動きに合わせて画面を動かし、半分を越えて離したら隣へ移る。
  // React の touchmove は既定で受け身なので、自分で付け外しして横スクロールを止める。
  const pagerRef = useRef(null);
  const gesture = useRef(null);
  const [shift, setShift] = useState(0);       // いまの横ずれ（px）
  const shiftRef = useRef(0);
  const moveTo = v => { shiftRef.current = v; setShift(v); };
  const [dragging, setDragging] = useState(false);
  const [settling, setSettling] = useState(false);
  const settleTimer = useRef(null);

  useEffect(() => () => clearTimeout(settleTimer.current), []);

  useEffect(() => {
    const el = pagerRef.current;
    if (!el || !isPhone) return undefined;
    const pageWidth = () => el.clientWidth || window.innerWidth;

    function onStart(e) {
      if (settling || e.touches.length !== 1) { gesture.current = null; return; }
      if (e.target.closest('input, select, textarea, .xl-grip, .xl-thumb, iframe, .ball')) {
        gesture.current = null;
        return;
      }
      gesture.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, axis: null };
    }

    function onMove(e) {
      const g = gesture.current;
      if (!g || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - g.x;
      const dy = e.touches[0].clientY - g.y;
      if (!g.axis) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        // 縦に動かしたぶんが大きければ、ふつうの上下スクロールとして扱う
        g.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
        if (g.axis === 'x') setDragging(true);
      }
      if (g.axis !== 'x') return;
      e.preventDefault();
      // いちばん端では引きを重くして、これ以上ないことを手に伝える
      const atEdge = (index === 0 && dx > 0) || (index === SCREENS.length - 1 && dx < 0);
      moveTo(atEdge ? dx * 0.25 : dx);
    }

    function onEnd() {
      const g = gesture.current;
      gesture.current = null;
      if (!g || g.axis !== 'x') { setDragging(false); moveTo(0); return; }
      const w = pageWidth();
      const dx = shiftRef.current;
      let to = index;
      if (dx <= -w / 2 && index < SCREENS.length - 1) to = index + 1;
      else if (dx >= w / 2 && index > 0) to = index - 1;
      setSettling(true);
      moveTo(to === index ? 0 : (to > index ? -w : w));
      clearTimeout(settleTimer.current);
      settleTimer.current = setTimeout(() => {
        setSettling(false);
        setDragging(false);
        moveTo(0);
        if (to !== index) setTab(SCREENS[to].id);
      }, 240);
    }

    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    el.addEventListener('touchcancel', onEnd);
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('touchcancel', onEnd);
    };
  }, [isPhone, index, settling]);

  function renderScreen(id) {
    if (id === 'calendar') return h(CalendarPage, { data, setData });
    return h(PracticeHub, {
      data, setData, tab: id, setTab, progress, setProgress, markQuestionDone,
      onShowPhoto: (qid, i) => setPhotoView({ qid, index: i || 0 }),
    });
  }
  const [data, setDataRaw] = useLocalStorageState(STORAGE_KEY, DEFAULT_DATA);
  const [photoView, setPhotoView] = useState(null); // { qid, index }
  const [history, setHistory] = useState({ undo: 0, redo: 0 });
  const undoStack = useRef([]);
  const redoStack = useRef([]);
  const dataRef = useRef(data);
  dataRef.current = data;

  // 変更のたびに直前の状態を積む。Excelの Ctrl+Z と同じ感覚で戻せるようにする
  function setData(updater) {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (next === prev) return prev;
      const stack = undoStack.current;
      if (stack[stack.length - 1] !== prev) {
        stack.push(prev);
        const dropped = [];
        while (stack.length > UNDO_LIMIT) dropped.push(stack.shift());
        redoStack.current = [];
        // 履歴から外れた分だけ、参照されなくなった画像を掃除する
        if (dropped.length) {
          gcPhotos([next, ...stack, ...redoStack.current].map(d => d.photos)).catch(() => {});
        }
        setHistory({ undo: stack.length, redo: 0 });
      }
      return next;
    });
  }

  function undo() {
    const prev = undoStack.current.pop();
    if (!prev) return;
    redoStack.current.push(dataRef.current);
    setDataRaw(prev);
    setPhotoView(null);
    setHistory({ undo: undoStack.current.length, redo: redoStack.current.length });
  }
  function redo() {
    const next = redoStack.current.pop();
    if (!next) return;
    undoStack.current.push(dataRef.current);
    setDataRaw(next);
    setPhotoView(null);
    setHistory({ undo: undoStack.current.length, redo: redoStack.current.length });
  }

  useEffect(() => {
    function onKey(e) {
      const tag = e.target && e.target.tagName;
      // 文字入力中は、そのまま入力欄の取り消しに任せる
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if (!(e.ctrlKey || e.metaKey)) return;
      const key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // 前回までに参照が切れた画像を、起動時に掃除する
  useEffect(() => {
    if (data && Array.isArray(data.units)) gcPhotos([data.photos]).catch(() => {});
  }, []);

  // ボタンとプルダウンに、さわった合図の音を付ける。
  // 一つずつ書くと付け忘れるので、まとめて拾う。自前の音を持つものと、
  // 数を選ぶだけのところ（data-sound）は鳴らさない。
  useEffect(() => {
    function tapped(e) {
      const el = e.target.closest && e.target.closest('button, [role="button"], label.xl-btn');
      if (!el || el.disabled || el.dataset.sound) return;
      play('click');
    }
    function changed(e) {
      const el = e.target;
      if (!el || el.tagName !== 'SELECT' || el.dataset.sound) return;
      play('click');
    }
    document.addEventListener('click', tapped, true);
    document.addEventListener('change', changed, true);
    return () => {
      document.removeEventListener('click', tapped, true);
      document.removeEventListener('change', changed, true);
    };
  }, []);

  return h('div', { className: 'min-h-screen' },
    h('div', { className: 'appbar' },
      h('div', { className: 'inner xl-pad' },
        // スマホは画面名と点だけ。PCは今までどおり切り替えボタン。
        isPhone
          ? h('div', { className: 'screen-now', style: { display: 'flex', alignItems: 'center', gap: '10px' } },
              h('span', { className: 'on title' }, (SCREENS.find(sc => sc.id === tab) || SCREENS[0]).label),
              h('span', { className: 'dots' },
                SCREENS.map(sc => h('i', { key: sc.id, className: sc.id === tab ? 'cur' : '' })))
            )
          : NAV_TABS.map(t => h('button', {
              key: t.id,
              onClick: () => setMode(t.id),
              className: `tab-btn${mode === t.id ? ' on' : ''}`,
            }, t.label)),
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '6px', marginLeft: 'auto' } },
          h('button', {
            onClick: () => setSettings(true), title: '設定',
            className: 'icon-btn',
          }, '⚙'),
          h('button', {
            onClick: undo, disabled: history.undo === 0, title: '元に戻す（Ctrl+Z）',
            className: 'icon-btn', style: isPhone ? {} : { width: 'auto', padding: '0 12px', fontSize: '12px' },
          }, isPhone ? '↶' : `↶ 元に戻す${history.undo ? `（${history.undo}）` : ''}`),
          h('button', {
            onClick: redo, disabled: history.redo === 0, title: 'やり直す（Ctrl+Y）',
            className: 'icon-btn', style: isPhone ? {} : { width: 'auto', padding: '0 12px', fontSize: '12px' },
          }, isPhone ? '↷' : `↷ やり直す${history.redo ? `（${history.redo}）` : ''}`)
        )
      )
    ),
    isPhone
      ? (() => {
          // 動かしている間だけ隣の画面も組み立てる（ふだんは今の画面だけで軽くする）
          const shown = (dragging || settling)
            ? [index - 1, index, index + 1].filter(i => i >= 0 && i < SCREENS.length)
            : [index];
          const base = -shown.indexOf(index) * 100;
          return h('div', {
            ref: pagerRef,
            style: { overflowX: 'hidden', touchAction: 'pan-y' },
          },
            h('div', {
              style: {
                display: 'flex', width: `${shown.length * 100}%`,
                transform: `translate3d(calc(${base / shown.length}% + ${shift}px), 0, 0)`,
                transition: settling ? 'transform .24s cubic-bezier(.25,.9,.3,1)' : 'none',
              },
            },
              shown.map(i => h('div', { key: SCREENS[i].id, style: { width: `${100 / shown.length}%`, flex: '0 0 auto' } },
                renderScreen(SCREENS[i].id)))
            )
          );
        })()
      : h('div', null, renderScreen(tab)),
    photoView && (() => {
      const qid = photoView.qid;
      const unit = data.units.find(u => u.questions.some(q => q.id === qid));
      const currentNo = unit ? unit.questions.findIndex(q => q.id === qid) + 1 : 0;
      const ids = photoIdsOf(data.photos, qid);
      return h(PhotoModal, {
        ids,
        index: Math.min(photoView.index, Math.max(0, ids.length - 1)),
        onIndex: i => setPhotoView(v => ({ ...v, index: i })),
        onClose: () => setPhotoView(null),
        currentNo,
        // 写真をそのまま別の問題へ移せるようにする（コピー＆ペーストを経由しないで済む）
        moveTargets: unit
          ? unit.questions.map((q, i) => ({ id: q.id, no: i + 1, text: q.url || '' })).filter(t => t.id !== qid)
          : [],
        currentText: unit ? (unit.questions.find(q => q.id === qid) || {}).url || '' : '',
        onMove: (pid, toQid) => {
          setData(d => {
            const photos = { ...d.photos };
            const rest = photoIdsOf(d.photos, qid).filter(x => x !== pid);
            if (rest.length) photos[qid] = rest; else delete photos[qid];
            photos[toQid] = [...photoIdsOf(d.photos, toQid), pid];
            return { ...d, photos };
          });
          setPhotoView(null);
        },
        // 切り取った画像は別の写真として保存し、付け替えだけを記録する。
        // 元の画像は残るので Ctrl+Z で元の写真に戻せる。
        onCrop: (pid, frac) => cropPhoto(pid, frac).then(nid => {
          setData(d => ({
            ...d,
            photos: { ...d.photos, [qid]: photoIdsOf(d.photos, qid).map(x => (x === pid ? nid : x)) },
          }));
        }),
        onDelete: pid => {
          detachPhoto(qid, pid, setData).then(() => {
            setPhotoView(v => {
              const left = photoIdsOf(data.photos, qid).filter(x => x !== pid);
              return left.length ? { qid, index: Math.min(v.index, left.length - 1) } : null;
            });
          });
        },
      });
    })(),
    isPhone && h('div', { className: 'tabbar' },
      SCREENS.map(sc => h('button', {
        key: sc.id,
        className: sc.id === tab ? 'on' : '',
        onClick: () => setTab(sc.id),
      }, h('b', null, SCREEN_ICONS[sc.id]), sc.label))),

    settings && h(SettingsSheet, {
      progress, setProgress, themeMode, setThemeMode,
      onClose: () => setSettings(false),
    }),

    h(PomodoroTimer)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    // 新しい版に入れ替わったら一度だけ読み込み直す（更新に気付かず古い画面を使い続けないように）。
    // 初回訪問でも controllerchange は起きるので、そのときは読み込み直さない。
    var had = !!navigator.serviceWorker.controller;
    var done = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!had || done) return;
      done = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
