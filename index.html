// ── 写真のトリミング（拡大表示の中で使う）─────────────────────────────────────
// 選択範囲は「表示中の画像に対する割合」で持つ。画面の大きさが変わっても同じ場所を指す。
const MIN_CROP = 0.03;   // これより細い選択は切り取らせない
const CROP_HANDLES = [['nw', 0, 0], ['ne', 1, 0], ['sw', 0, 1], ['se', 1, 1]];

function CropOverlay({ src, busy, onCancel, onApply }) {
  const imgRef = useRef(null);
  const wrapRef = useRef(null);
  const [rect, setRect] = useState(null);
  // 画面の大きさ。これを基に写真の表示上限を決める（100vh はスマホで実際の高さとずれる）
  const [view, setView] = useState(() => ({ w: window.innerWidth, h: window.innerHeight }));
  // 実際に表示されている写真の位置と大きさ。選択の枠はこれに合わせて描く。
  const [box, setBox] = useState(null);
  const drag = useRef(null);

  // 枠の位置と、切り取る位置がずれないように、写真の実寸をその都度測る
  function measure() {
    const img = imgRef.current;
    const wrap = wrapRef.current;
    if (!img || !wrap || !img.naturalWidth) return;
    const a = img.getBoundingClientRect();
    const b = wrap.getBoundingClientRect();
    const next = { left: a.left - b.left, top: a.top - b.top, w: a.width, h: a.height };
    setBox(prev => (prev
      && Math.abs(prev.left - next.left) < 0.5 && Math.abs(prev.top - next.top) < 0.5
      && Math.abs(prev.w - next.w) < 0.5 && Math.abs(prev.h - next.h) < 0.5) ? prev : next);
  }

  useEffect(() => {
    measure();
    const onResize = () => setView({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, [src]);

  useEffect(() => { measure(); }, [view.w, view.h, src]);

  function point(e) {
    const b = imgRef.current.getBoundingClientRect();
    const clamp = v => Math.min(1, Math.max(0, v));
    return { x: clamp((e.clientX - b.left) / b.width), y: clamp((e.clientY - b.top) / b.height) };
  }

  const norm = (x1, y1, x2, y2) =>
    ({ x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) });

  function start(e, mode) {
    if (busy) return;
    e.preventDefault();
    e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    const p = point(e);
    drag.current = { mode, origin: p, base: rect };
    if (mode === 'new') setRect({ x: p.x, y: p.y, w: 0, h: 0 });
  }

  function move(e) {
    const d = drag.current;
    if (!d) return;
    e.preventDefault();
    e.stopPropagation();
    const p = point(e);
    if (d.mode === 'new') {
      setRect(norm(d.origin.x, d.origin.y, p.x, p.y));
    } else if (d.mode === 'move' && d.base) {
      const x = Math.min(1 - d.base.w, Math.max(0, d.base.x + (p.x - d.origin.x)));
      const y = Math.min(1 - d.base.h, Math.max(0, d.base.y + (p.y - d.origin.y)));
      setRect({ ...d.base, x, y });
    } else if (d.base) {
      // つまんだ角の反対側を固定して、指の位置まで広げる（裏返しても破綻しない）
      const fx = d.mode === 'nw' || d.mode === 'sw' ? d.base.x + d.base.w : d.base.x;
      const fy = d.mode === 'nw' || d.mode === 'ne' ? d.base.y + d.base.h : d.base.y;
      setRect(norm(fx, fy, p.x, p.y));
    }
  }

  function end(e) {
    if (!drag.current) return;
    e.stopPropagation();
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
    drag.current = null;
  }

  const ready = !!rect && rect.w >= MIN_CROP && rect.h >= MIN_CROP;
  const pct = v => `${v * 100}%`;
  const dragProps = mode => ({
    onPointerDown: e => start(e, mode), onPointerMove: move, onPointerUp: end, onPointerCancel: end,
  });
  // 下の操作バーで隠れないように、写真の高さに余白を残す
  const BAR_ROOM = 96;

  return h(React.Fragment, null,
    h('div', {
      ref: wrapRef,
      onClick: e => e.stopPropagation(),
      style: { position: 'relative', lineHeight: 0, marginBottom: `${BAR_ROOM - 32}px` },
    },
      h('img', {
        ref: imgRef, src, draggable: false, onLoad: measure,
        style: {
          display: 'block', userSelect: 'none',
          maxWidth: `${Math.max(80, view.w - 32)}px`,
          maxHeight: `${Math.max(80, view.h - BAR_ROOM - 32)}px`,
        },
      }),
      box && h('div', {
        ...dragProps('new'),
        style: {
          position: 'absolute', left: `${box.left}px`, top: `${box.top}px`,
          width: `${box.w}px`, height: `${box.h}px`,
          overflow: 'hidden', cursor: 'crosshair', touchAction: 'none',
        },
      },
        rect && rect.w > 0 && rect.h > 0 && h('div', {
          ...dragProps('move'),
          style: {
            position: 'absolute', left: pct(rect.x), top: pct(rect.y), width: pct(rect.w), height: pct(rect.h),
            border: '2px solid #fff', boxShadow: '0 0 0 9999px rgba(0,0,0,.6)',
            cursor: 'move', touchAction: 'none',
          },
        },
          CROP_HANDLES.map(([m, hx, hy]) => h('div', {
            key: m, ...dragProps(m),
            style: {
              position: 'absolute', left: hx ? '100%' : 0, top: hy ? '100%' : 0,
              transform: 'translate(-50%, -50%)', width: '22px', height: '22px', borderRadius: '4px',
              background: '#fff', border: '1px solid #111', touchAction: 'none', cursor: `${m}-resize`,
            },
          }))
        )
      )
    ),

    h('div', {
      onClick: e => e.stopPropagation(),
      style: {
        position: 'absolute', bottom: '16px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap',
        justifyContent: 'center', maxWidth: 'calc(100% - 32px)',
        background: 'rgba(17,24,39,.9)', border: '1px solid #374151', borderRadius: '8px', padding: '8px 12px',
      },
    },
      h('span', { className: 'text-xs text-gray-300' },
        busy ? '切り取っています…'
          : ready ? '四隅をつまむと調整できます。中をドラッグすると位置を動かせます'
          : '残したい部分をドラッグで囲んでください'),
      h('button', {
        onClick: () => ready && !busy && onApply(rect), disabled: !ready || !!busy,
        className: `text-xs px-3 py-1.5 rounded-lg border ${ready && !busy
          ? 'bg-green-800 border-green-600 text-green-100'
          : 'bg-gray-900/80 border-gray-700 text-gray-500 cursor-not-allowed'}`,
      }, '✂️ 切り取る'),
      h('button', {
        onClick: onCancel, disabled: !!busy,
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-gray-600 text-gray-200',
      }, 'やめる')
    )
  );
}

// ── 写真モーダル（画面中央に表示。複数枚は送り送りで見る）─────────────────────
function PhotoModal({ ids, index, onIndex, onClose, onDelete, moveTargets, currentNo, currentText, onMove, onCrop }) {
  const [src, setSrc] = useState(null);
  const [cropping, setCropping] = useState(false);
  const [cropBusy, setCropBusy] = useState(false);
  const pid = ids[index];
  // 移動先は「ひとつ前の問題」を初期値にする（問題の次に解答が来る問題集で使いやすい）
  const defaultTarget = (moveTargets && moveTargets.length)
    ? (moveTargets.filter(t => t.no < currentNo).pop() || moveTargets[0]).id
    : '';
  const [moveTo, setMoveTo] = useState(defaultTarget);
  useEffect(() => { setMoveTo(defaultTarget); }, [defaultTarget]);

  useEffect(() => {
    let alive = true;
    setSrc(null);
    if (!pid) { setSrc(''); return; }
    setCropping(false);
    setCropBusy(false);
    loadPhoto(pid).then(v => { if (alive) setSrc(v || ''); }).catch(() => { if (alive) setSrc(''); });
    return () => { alive = false; };
  }, [pid]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { if (cropping) setCropping(false); else onClose(); }
      if (cropping) return;
      if (e.key === 'ArrowLeft' && index > 0) onIndex(index - 1);
      if (e.key === 'ArrowRight' && index < ids.length - 1) onIndex(index + 1);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose, onIndex, index, ids.length, cropping]);

  function applyCrop(frac) {
    setCropBusy(true);
    Promise.resolve(onCrop(pid, frac))
      .then(() => { setCropping(false); })
      .catch(() => {})
      .then(() => setCropBusy(false));
  }

  const navBtn = {
    width: '44px', height: '44px', borderRadius: '50%', fontSize: '20px', lineHeight: 1,
    background: 'rgba(17,24,39,.8)', border: '1px solid #374151', color: '#fff', cursor: 'pointer',
  };

  return h('div', {
    onClick: onClose,
    // ポモドーロタイマー（z-50）より前面に出す
    style: { zIndex: 60 },
    className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4'
  },
    ids.length > 1 && !cropping && h('button', {
      onClick: e => { e.stopPropagation(); onIndex(index - 1); },
      disabled: index === 0,
      style: { ...navBtn, position: 'absolute', left: '16px', opacity: index === 0 ? 0.3 : 1 },
    }, '‹'),

    src === null
      ? h('p', { className: 'text-sm text-gray-400' }, '読み込み中…')
      : src && cropping
        ? h(CropOverlay, { src, busy: cropBusy, onCancel: () => setCropping(false), onApply: applyCrop })
      : src
        ? h('img', {
            src,
            onClick: e => e.stopPropagation(),
            className: 'rounded-lg shadow-2xl',
            style: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' },
          })
        : h('p', { className: 'text-sm text-gray-400' }, '写真がありません'),

    ids.length > 1 && !cropping && h('button', {
      onClick: e => { e.stopPropagation(); onIndex(index + 1); },
      disabled: index >= ids.length - 1,
      style: { ...navBtn, position: 'absolute', right: '16px', opacity: index >= ids.length - 1 ? 0.3 : 1 },
    }, '›'),

    !cropping && h('div', {
      onClick: e => e.stopPropagation(),
      style: {
        position: 'absolute', bottom: '16px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap',
        justifyContent: 'center', maxWidth: 'calc(100% - 32px)',
        background: 'rgba(17,24,39,.85)', border: '1px solid #374151', borderRadius: '8px', padding: '8px 12px',
      },
    },
      h('span', { className: 'text-xs text-gray-300', style: { maxWidth: '420px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
        `問題 ${currentNo}` + (ids.length > 1 ? ` の ${index + 1} / ${ids.length} 枚目` : ' の写真')
        + (currentText ? `　${currentText}` : '')),
      onMove && moveTargets && moveTargets.length > 0 && h('span', { className: 'text-xs text-gray-400' }, '｜ 別の問題へ移す:'),
      onMove && moveTargets && moveTargets.length > 0 && h('select', {
        value: moveTo, onChange: e => setMoveTo(e.target.value),
        className: 'text-xs rounded bg-gray-800 border border-gray-600 text-white px-2 py-1',
      }, moveTargets.map(t => h('option', { key: t.id, value: t.id },
        `問題 ${t.no}` + (t.text ? `　${t.text.length > 60 ? t.text.slice(0, 60) + '…' : t.text}` : '　（URLなし）')))),
      onMove && moveTargets && moveTargets.length > 0 && h('button', {
        onClick: () => onMove(pid, moveTo),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-green-800 border border-green-600 text-green-100',
      }, '移す'),
      onCrop && src && h('button', {
        onClick: () => setCropping(true),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-gray-600 text-gray-100',
        title: '要る部分だけを切り出す（Ctrl+Z で戻せます）',
      }, '✂️ トリミング'),
      onDelete && h('button', {
        onClick: () => onDelete(pid),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-red-800 text-red-300',
      }, 'この写真を削除')
    ),

    h('button', {
      onClick: onClose,
      className: 'absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-900/80 border border-gray-700 text-white text-xl leading-none'
    }, '×')
  );
}

// ── 正解ボタン（押すと1回ぶん増えて、その場で弾ける）──────────────────────────
// 押し間違いは長押しで1つ戻せる（プルダウンを置くと横幅が足りないため）
function CorrectButton({ onAdd }) {
  const [pop, setPop] = useState(0);

  function burstAt(el) { burstFrom(el); }

  return h('button', {
    className: 'ok-btn' + (pop ? ' pop' : ''),
    key: `ok${pop}`,
    title: '正解を1つ足す',
    'data-sound': 'own',
    onClick: e => { play('correct'); setPop(n => n + 1); burstAt(e.currentTarget); onAdd(); },
  }, '✓');
}

// 押した場所からキラキラを飛ばす（見た目だけの演出）
function burstFrom(el) {
  if (!el || typeof document === 'undefined') return;
  {
    const b = el.getBoundingClientRect();
    ['✨', '⭐', '✨'].forEach((mark, i) => {
      const sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = mark;
      sp.style.left = `${b.left + b.width / 2 - 10}px`;
      sp.style.top = `${b.top + b.height / 2 - 10}px`;
      sp.style.setProperty('--dx', `${(i - 1) * 34}px`);
      sp.style.setProperty('--dy', `${-30 - i * 8}px`);
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 800);
    });
  }
}

// ── 単元のメーターと、今日の目標の球 ─────────────────────────────────────────
function GaugeBar({ unit, records, progress, onSetGoal }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(progress.goal));
  const { done, total, rate } = unitProgress(unit, records);
  const today = doneToday(progress);
  const filled = progress.goal > 0 ? Math.min(1, today / progress.goal) : 0;

  function commit() {
    const n = Math.max(1, Math.min(999, Number(draft) || 1));
    onSetGoal(n);
    setDraft(String(n));
    setEditing(false);
  }

  return h('div', { className: 'gauge' },
    h('div', { className: 'meter' },
      h('div', { className: 'cap' },
        h('span', null, unit ? `${unit.name} の進み具合` : '単元の進み具合'),
        h('span', null, `${done} / ${total} 問（${Math.round(rate * 100)}%）`)
      ),
      h('div', { className: 'bar', title: '正解が1回以上ついた問題の割合' },
        h('i', { style: { width: `${Math.round(rate * 100)}%` } })),
      editing && h('div', { style: { marginTop: '6px', display: 'flex', alignItems: 'center', gap: '6px' } },
        h('span', { style: { fontSize: '12px', color: '#555' } }, '1日の目標'),
        h('input', {
          type: 'number', min: 1, max: 999, value: draft, title: '1日の目標',
          style: { width: '80px', fontSize: '16px' },
          onChange: e => setDraft(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter') commit(); },
        }),
        h('span', { style: { fontSize: '12px', color: '#555' } }, '問'),
        h('button', { className: 'xl-btn', onClick: commit }, '決定')
      )
    ),
    h('div', {
      className: 'ball' + (filled >= 1 ? ' full' : ''),
      title: `今日 ${today} / ${progress.goal} 問（押すと目標を変えられます）`,
      onClick: () => setEditing(v => !v),
    },
      // 0のときは波を描かない（下辺に青い線が残って見えるため）
      filled > 0 && h('i', { style: { height: `${Math.round(filled * 100)}%` } }),
      h('span', { className: 'lab' }, filled >= 1 ? '達成!' : `${today}/${progress.goal}`)
    )
  );
}

// ── 写真セル（セル内にサムネイル。複数枚並ぶ）─────────────────────────────────
function PhotoThumb({ pid, onOpen }) {
  const [thumb, setThumb] = useState('');
  useEffect(() => {
    let alive = true;
    loadThumb(pid).then(v => { if (alive) setThumb(v || ''); }).catch(() => {});
    return () => { alive = false; };
  }, [pid]);
  return thumb
    ? h('img', { src: thumb, className: 'xl-thumb', onClick: onOpen, title: 'クリックで拡大' })
    : h('button', { className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px' }, onClick: onOpen }, '📷');
}

function PhotoCell({ pids, isTarget, onOpen, onPick }) {
  const shown = pids.slice(0, 4);
  return h('div', { className: 'xl-cell', style: { display: 'flex', alignItems: 'center', gap: '4px' } },
    shown.map((pid, i) => h(PhotoThumb, { key: pid, pid, onOpen: () => onOpen(i) })),
    pids.length > shown.length && h('span', { style: { fontSize: '11px', color: '#666' } }, `+${pids.length - shown.length}`),
    h('button', {
      className: 'xl-btn xl-btn-sub',
      style: {
        padding: '2px 8px', fontSize: '12px',
        ...(isTarget ? { borderColor: '#217346', background: '#eef8f1' } : {}),
      },
      onClick: onPick,
      title: pids.length ? '写真を追加する' : '写真を入れる',
    }, isTarget ? '貼付待ち…' : (pids.length ? '＋' : '＋ 写真'))
  );
}

// ── 問題の表（Excelのシート相当）──────────────────────────────────────────────
function QuestionSheet({
  questions, nos, data, onSetUrl, onSetCount, onOpenPhoto, onPickPhoto,
  pasteTarget, onDeleteRow, onDuplicate, onReorder, scrollSignal, emptyText, onOpenLink,
  compact, onCorrect, unitName,
}) {
  const isPhone = useIsPhone();
  const scroller = useRef(null);
  // 行番号のセルをつまんだときだけ行を掴めるようにする（URL欄の文字選択を邪魔しないため）
  const [grabId, setGrabId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [after, setAfter] = useState(false);

  function endDrag() { setGrabId(null); setDragId(null); setOverId(null); }

  // 問題を追加したときは、追加した行が見えるところまで送る
  useEffect(() => {
    if (scrollSignal && scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight;
  }, [scrollSignal]);

  if (!questions.length) {
    return h('div', { className: 'xl-empty' }, emptyText || 'まだ問題がありません。');
  }

  // スマホで問題を解いているときは、1問1行にして5問ぶん画面に収める
  if (isPhone && compact) {
    return h('div', { className: 'xl-scroll', ref: scroller },
      questions.map((q, i) => {
        const r = data.records[q.id] || { correct: 0, wrong: 0 };
        const no = nos ? nos[i] : i + 1;
        const pids = photoIdsOf(data.photos, q.id);
        return h('div', { className: 'q-line', key: q.id },
          q.url
            ? h('button', {
                className: 'open', 'data-sound': 'own', title: '問題を開く',
                onClick: () => onOpenLink && onOpenLink(q.id),
              },
                h('span', { className: 'u' }, unitName || '　'),
                h('span', { className: 'n' }, `${no}問目`))
            : h('span', { className: 'open none' },
                h('span', { className: 'u' }, unitName || '　'),
                h('span', { className: 'n' }, `${no}問目${pids.length ? '（写真）' : '（URLなし）'}`)),
          h(CorrectButton, { onAdd: () => onCorrect(q.id) }),
          h('select', {
            className: 'cnt', title: 'この問題の正解回数', 'data-sound': 'off', value: r.correct,
            onChange: e => onSetCount(q.id, 'correct', Number(e.target.value)),
          }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
          h('span', { className: 'shot' },
            pids.length
              ? h(PhotoThumb, { pid: pids[0], onOpen: () => onOpenPhoto(q.id, 0) })
              : h('button', {
                  className: 'xl-btn xl-btn-sub', style: { padding: '8px 10px' },
                  onClick: () => onPickPhoto(q.id),
                }, '📷')),
          pids.length > 1 && h('span', { style: { fontSize: '11px', color: '#888' } }, `+${pids.length - 1}`)
        );
      })
    );
  }

  // スマホでは表が入りきらないので、1問1枚のカードにする
  if (isPhone) {
    return h('div', { className: 'xl-scroll', ref: scroller },
      questions.map((q, i) => {
        const r = data.records[q.id] || { correct: 0, wrong: 0 };
        const no = nos ? nos[i] : i + 1;
        return h('div', { className: 'q-card', key: q.id },
          h('div', { className: 'q-head' },
            h('span', { className: 'q-no' }, `No.${no}`),
            onReorder && h('div', { style: { marginLeft: 'auto', display: 'flex', gap: '6px' } },
              h('button', {
                className: 'xl-btn xl-btn-sub', disabled: i === 0,
                onClick: () => onReorder(q.id, questions[i - 1].id, false), title: '上へ',
              }, '↑'),
              h('button', {
                className: 'xl-btn xl-btn-sub', disabled: i === questions.length - 1,
                onClick: () => onReorder(q.id, questions[i + 1].id, true), title: '下へ',
              }, '↓')
            ),
            onDuplicate && h('button', {
              className: 'xl-btn xl-btn-sub', style: onReorder ? {} : { marginLeft: 'auto' },
              onClick: () => onDuplicate(q.id),
            }, '複製'),
            onDeleteRow && h('button', {
              className: 'xl-btn xl-btn-sub', style: { color: '#a11' },
              onClick: () => onDeleteRow(q.id),
            }, '×')
          ),

          onSetUrl
            ? h('input', {
                type: 'text', className: 'xl-input', value: q.url || '',
                placeholder: 'URLを貼り付け（写真だけでも可）',
                style: { width: '100%', fontSize: '16px' },
                onChange: e => onSetUrl(q.id, e.target.value),
              })
            : null,
          q.url
            ? (onOpenLink
                ? h('button', { className: 'q-open', 'data-sound': 'own', onClick: () => onOpenLink(q.id) }, '問題を開く →')
                : h('a', { className: 'q-open', href: q.url, target: '_blank', rel: 'noopener noreferrer' }, '問題を開く →'))
            : (onSetUrl ? null : h('div', { style: { color: '#999', fontSize: '13px', margin: '6px 0' } }, '（URLなし）')),

          h('div', { className: 'q-row' },
            h('label', null, '正解'),
            h('select', {
              title: 'この問題の正解回数', 'data-sound': 'off',
              value: r.correct, onChange: e => onSetCount(q.id, 'correct', Number(e.target.value)),
            }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
            onCorrect && h(CorrectButton, { onAdd: () => onCorrect(q.id) })
          ),

          h('div', { className: 'q-photos' },
            photoIdsOf(data.photos, q.id).map((pid, pi) =>
              h(PhotoThumb, { key: pid, pid, onOpen: () => onOpenPhoto(q.id, pi) })),
            h('button', {
              className: 'xl-btn xl-btn-sub',
              style: pasteTarget === q.id ? { borderColor: '#217346', background: '#eef8f1' } : {},
              onClick: () => onPickPhoto(q.id),
            }, pasteTarget === q.id ? '貼付待ち…' : '＋ 写真')
          )
        );
      })
    );
  }

  return h('div', { className: 'xl-scroll', ref: scroller },
    h('table', { className: 'xl-table' },
      h('thead', null,
        h('tr', null,
          h('th', { className: 'xl-rownum', style: { top: 0 } }, 'No'),
          h('th', { className: 'xl-col-url' }, '問題URL'),
          h('th', null, '正解回数'),
          h('th', { className: 'xl-col-photo' }, '写真'),
          (onDeleteRow || onDuplicate) && h('th', null, '')
        )
      ),
      h('tbody', null,
        questions.map((q, i) => {
          const r = data.records[q.id] || { correct: 0, wrong: 0 };
          const rowNo = nos ? nos[i] : i + 1;
          const dragging = dragId === q.id;
          const over = onReorder && overId === q.id && dragId && dragId !== q.id;
          return h('tr', {
            key: q.id,
            draggable: !!onReorder && (grabId === q.id || dragging),
            className: [dragging ? 'xl-dragging' : '', over ? (after ? 'xl-drop-after' : 'xl-drop-before') : ''].filter(Boolean).join(' '),
            onDragStart: onReorder ? e => {
              setDragId(q.id);
              e.dataTransfer.effectAllowed = 'move';
              try { e.dataTransfer.setData('text/plain', q.id); } catch (err) {}
            } : undefined,
            onDragOver: onReorder ? e => {
              if (!dragId) return;
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              const box = e.currentTarget.getBoundingClientRect();
              const isAfter = e.clientY > box.top + box.height / 2;
              if (overId !== q.id) setOverId(q.id);
              if (after !== isAfter) setAfter(isAfter);
            } : undefined,
            onDrop: onReorder ? e => {
              e.preventDefault();
              if (dragId && dragId !== q.id) onReorder(dragId, q.id, after);
              endDrag();
            } : undefined,
            onDragEnd: onReorder ? endDrag : undefined,
          },
            h('td', {
              className: 'xl-rownum' + (onReorder ? ' xl-grip' : ''),
              title: onReorder ? 'ドラッグで並べ替え' : undefined,
              onMouseDown: onReorder ? () => setGrabId(q.id) : undefined,
              onMouseUp: onReorder ? () => setGrabId(null) : undefined,
            }, onReorder ? h('span', { className: 'g' }, '⠿') : null, rowNo),
            h('td', null, h('div', { className: 'xl-cell', style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '2px 6px' } },
              onSetUrl
                ? h('input', {
                    type: 'text', className: 'xl-url', value: q.url || '',
                    placeholder: 'URLを貼り付け（写真だけでも可）',
                    onChange: e => onSetUrl(q.id, e.target.value),
                  })
                : h('span', { style: { flex: '1 1 auto', color: q.url ? '#1f2328' : '#999' } }, q.url || '（URLなし）'),
              q.url
                ? (onOpenLink
                    ? h('button', {
                        onClick: () => onOpenLink(q.id),
                        'data-sound': 'own',
                        className: 'xl-link', style: { flex: '0 0 auto', background: 'none', border: 0, cursor: 'pointer' },
                        title: 'アプリの中で開く',
                      }, '開く →')
                    : h('a', {
                        href: q.url, target: '_blank', rel: 'noopener noreferrer',
                        className: 'xl-link', style: { flex: '0 0 auto' },
                      }, '開く →'))
                : null
            )),
            h('td', null, h('div', { className: 'xl-cell', style: { padding: '2px 6px', display: 'flex', alignItems: 'center', gap: '6px' } },
              h('select', {
                className: 'xl-select', title: 'この問題の正解回数', 'data-sound': 'off', value: r.correct,
                onChange: e => onSetCount(q.id, 'correct', Number(e.target.value))
              }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
              onCorrect && h(CorrectButton, { onAdd: () => onCorrect(q.id) })
            )),
            h('td', null, h(PhotoCell, {
              pids: photoIdsOf(data.photos, q.id),
              isTarget: pasteTarget === q.id,
              onOpen: i => onOpenPhoto(q.id, i),
              onPick: () => onPickPhoto(q.id),
            })),
            (onDeleteRow || onDuplicate) && h('td', null, h('div', { className: 'xl-cell', style: { display: 'flex', gap: '4px' } },
              onDuplicate && h('button', {
                className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px', fontSize: '12px' },
                onClick: () => onDuplicate(q.id), title: 'この問題をコピーして下に追加'
              }, '複製'),
              onDeleteRow && h('button', {
                className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px', fontSize: '12px', color: '#a11' },
                onClick: () => onDeleteRow(q.id), title: 'この行を削除'
              }, '×')
            ))
          );
        })
      )
    )
  );
}

// ── 出題ページ ────────────────────────────────────────────────────────────────
function DrawPage({ data, setData, onShowPhoto, setMsg, sel, onOpenLink, progress, setProgress, markQuestionDone }) {
  const isPhone = useIsPhone();
  const { theme, unitsOfTheme, unit, setThemeId, setUnitId } = sel;
  // 前回の続きから始められるように、条件と抽選結果を読み戻す（同じ単元のときだけ）
  const saved = useRef(loadDraw());
  const prev = saved.current && unit && saved.current.unitId === unit.id ? saved.current : null;
  const [filterCorrect, setFilterCorrect] = useState(prev ? (prev.filterCorrect || '') : '');
  const [count, setCount] = useState(prev && prev.count ? prev.count : 5);
  const [rangeStart, setRangeStart] = useState(prev && prev.rangeStart ? prev.rangeStart : 1);
  const [rangeEnd, setRangeEnd] = useState(prev ? (prev.rangeEnd || 0) : 0); // 0 は「最後まで」
  // 抽選結果は問題のIDだけを持つ（並べ替えやURLの変更にそのまま追随する）
  const [results, setResults] = useState(() => {
    if (!prev || !unit) return [];
    const ids = new Set(unit.questions.map(q => q.id));
    return (prev.results || []).filter(id => ids.has(id));
  });
  const [pasteTarget, setPasteTarget] = useState(null);

  const total = unit ? unit.questions.length : 0;
  const endNo = rangeEnd > 0 ? Math.min(rangeEnd, total) : total;

  // 単元を変えたら、Excelと同じく範囲は 1〜問題数 に戻す。
  // 開き直した直後は「前回の続き」なので消さない。
  const shownUnit = useRef(unit ? unit.id : '');
  useEffect(() => {
    const id = unit ? unit.id : '';
    if (shownUnit.current === id) return;
    shownUnit.current = id;
    setResults([]); setPasteTarget(null); setRangeStart(1); setRangeEnd(0);
  }, [unit ? unit.id : '']);

  // 開いている単元と条件、抽選結果を覚えておく
  useEffect(() => {
    if (!unit) return;
    saveDraw({
      themeId: theme ? theme.id : '', unitId: unit.id,
      rangeStart, rangeEnd, filterCorrect, count, results,
    });
  }, [theme ? theme.id : '', unit ? unit.id : '', rangeStart, rangeEnd, filterCorrect, count, results]);

  useWindowPaste(!!pasteTarget, clipboard => {
    const files = imageFilesFrom(clipboard, true);
    if (!files.length) return false;
    const existing = photoIdsOf(data.photos, pasteTarget);
    attachPhoto(pasteTarget, files[0], setData, existing)
      .then(({ sameAs }) => {
        setPasteTarget(null);
        setMsg(`写真を入れました（${existing.length + 1}枚目・${fileLabel(files[0])}）`
          + (sameAs ? `　※この問題の${sameAs}枚目と同じ画像です。コピーし直してから貼り直してください` : ''));
      })
      .catch(e => setMsg('写真を保存できませんでした: ' + (e && e.message ? e.message : e)));
    return true;
  });

  if (!unit) {
    return h('div', { className: 'xl-empty' },
      data.units.length ? 'このテーマには単元がありません。「単元管理」タブで作成してください。'
                        : '単元がありません。「単元管理」タブでテーマと単元を作成してください。');
  }

  const pool = unit ? unit.questions.map((q, i) => ({ q, no: i + 1 })).filter(item => {
    if (item.no < rangeStart || item.no > endNo) return false;
    const r = data.records[item.q.id] || { correct: 0, wrong: 0 };
    if (filterCorrect !== '' && r.correct !== Number(filterCorrect)) return false;
    return true;
  }) : [];

  // 覚えているのはIDだけなので、表示のたびに今の問題と番号を引き直す
  const shown = results
    .map(id => {
      const i = unit.questions.findIndex(q => q.id === id);
      return i < 0 ? null : { q: unit.questions[i], no: i + 1 };
    })
    .filter(Boolean);

  const filterClass = 'bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white';

  const themeSelect = h('select', {
    title: 'テーマ', value: theme ? theme.id : '', onChange: e => setThemeId(e.target.value),
    style: isPhone ? { width: '100%', minWidth: 0 } : { minWidth: '180px' },
  }, data.themes.map(t => h('option', { key: t.id, value: t.id }, t.name)));

  const unitSelect = h('select', {
    title: '単元', value: unit ? unit.id : '', onChange: e => setUnitId(e.target.value),
    style: isPhone ? { width: '100%', minWidth: 0 } : { minWidth: '200px' },
  }, unitsOfTheme.map(u => h('option', { key: u.id, value: u.id }, `${u.name}（全${u.questions.length}問）`)));

  const drawButton = h('button', {
    className: 'xl-btn',
    'data-sound': 'own',
    disabled: pool.length === 0,
    onClick: () => {
      play('draw');
      setResults(sample(pool, count).map(item => item.q.id));
      setPasteTarget(null);
    },
  }, shown.length ? '🎲 再抽選' : '🎲 抽選する');

  const numBox = (title, value, onChange, extra) => h('input', {
    title, type: 'number', min: 1, value, onChange,
    style: { width: '100%', minWidth: 0, fontSize: '16px', padding: '6px 4px', textAlign: 'center' },
    ...(extra || {}),
  });

  // スマホは「テーマ・単元」で1行、「開始・終了・数・正解・抽選」で1行に詰める
  const phoneToolbar = h('div', { className: 'xl-toolbar', style: { padding: '6px 8px' } },
    h('div', { style: { display: 'flex', gap: '6px' } },
      h('div', { style: { flex: '1 1 0', minWidth: 0 } }, themeSelect),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } }, unitSelect)
    ),
    h('div', { style: { display: 'flex', gap: '4px', alignItems: 'flex-end', marginTop: '6px' } },
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '開始'),
        numBox('開始No', rangeStart, e => setRangeStart(Math.max(1, Number(e.target.value) || 1)), { max: total || 1 })),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '終了'),
        numBox('終了No', endNo, e => setRangeEnd(Math.max(1, Number(e.target.value) || 1)), { max: total || 1 })),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '出題'),
        numBox('出題数', count, e => setCount(Math.max(1, Number(e.target.value) || 1)))),
      h('div', { style: { flex: '1.3 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '正解数'),
        h('select', {
          title: '正解回数', value: filterCorrect, onChange: e => setFilterCorrect(e.target.value),
          style: { width: '100%', minWidth: 0, fontSize: '16px', padding: '6px 2px' },
        },
          h('option', { value: '' }, '指定なし'),
          COUNT_OPTIONS.map(n => h('option', { key: n, value: String(n) }, `${n}回`))
        )),
      h('div', { style: { flex: '0 0 auto' } }, drawButton)
    )
  );

  return h('div', { className: 'xl-app' },
    isPhone ? phoneToolbar : h('div', { className: 'xl-toolbar flex flex-wrap items-end gap-4' },
      h('div', { className: 'xl-field-wide' },
        h('label', { className: 'xl-label' }, 'テーマ'),
        h('select', { title: 'テーマ', value: theme ? theme.id : '', onChange: e => setThemeId(e.target.value), style: { minWidth: '180px' } },
          data.themes.map(t => h('option', { key: t.id, value: t.id }, t.name))
        )
      ),
      h('div', { className: 'xl-field-wide' },
        h('label', { className: 'xl-label' }, '単元'),
        h('select', { title: '単元', value: unit ? unit.id : '', onChange: e => setUnitId(e.target.value), style: { minWidth: '200px' } },
          unitsOfTheme.map(u => h('option', { key: u.id, value: u.id }, `${u.name}（全${u.questions.length}問）`))
        )
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '開始No'),
        h('input', {
          title: '開始No', type: 'number', min: 1, max: total || 1, value: rangeStart, style: { width: '80px' },
          onChange: e => setRangeStart(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '終了No'),
        h('input', {
          title: '終了No', type: 'number', min: 1, max: total || 1, value: endNo, style: { width: '80px' },
          onChange: e => setRangeEnd(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '正解回数'),
        h('select', { title: '正解回数', value: filterCorrect, onChange: e => setFilterCorrect(e.target.value) },
          h('option', { value: '' }, '指定なし'),
          COUNT_OPTIONS.map(n => h('option', { key: n, value: String(n) }, `${n} 回`))
        )
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '出題数'),
        h('input', {
          title: '出題数', type: 'number', min: 1, value: count, style: { width: '80px' },
          onChange: e => setCount(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      drawButton
    ),

    h(GaugeBar, {
      unit, records: data.records, progress,
      onSetGoal: n => setProgress(pv => { const next = { ...pv, goal: n }; saveProgress(next); return next; }),
    }),

    pasteTarget && h('div', { className: 'xl-target' }, '写真の貼り付け先を選択中です。Ctrl+V で貼り付けてください。'),

    shown.length === 0
      ? h('div', { className: 'xl-empty' }, '「抽選する」を押すと、条件に合う問題からランダムに出題します。')
      : h(QuestionSheet, {
          questions: shown.map(r => r.q), nos: shown.map(r => r.no), data,
          onSetCount: (qid, field, value) => setCountFor(qid, field, value, setData),
          onOpenPhoto: onShowPhoto,
          onPickPhoto: qid => setPasteTarget(pasteTarget === qid ? null : qid),
          pasteTarget, onOpenLink, compact: true, unitName: unit ? unit.name : '',
          // 正解を押したら回数を1つ増やし、その日「手をつけた問題」にも数える
          onCorrect: qid => {
            const now = (data.records[qid] || {}).correct || 0;
            setCountFor(qid, 'correct', Math.min(COUNT_MAX, now + 1), setData);
            markQuestionDone(qid);
          },
        }),

    h('div', { className: 'xl-status' },
      `${theme ? theme.name : '-'} ／ ${unit ? unit.name : '-'} ｜ 全${total}問 ｜ 出題範囲 ${rangeStart}〜${endNo} ｜ 条件に合う問題 ${pool.length}問`
      + (shown.length ? ` ｜ 出題中 ${shown.length}問` : '')
      + (pool.length > 0 && pool.length < count ? `　※条件に合うのが${pool.length}問しかないため、${pool.length}問だけ出題します` : '')
    )
  );
}

// ── 単元管理ページ ────────────────────────────────────────────────────────────
function UnitsPage({ data, setData, onShowPhoto, setMsg, sel, onOpenLink }) {
  const { theme, unitsOfTheme, unit, setThemeId, setUnitId } = sel;
  const [pasteTarget, setPasteTarget] = useState(null);
  const [urlText, setUrlText] = useState('');
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState('');
  const [addingTheme, setAddingTheme] = useState(false);
  const [newThemeName, setNewThemeName] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [confirmThemeDelete, setConfirmThemeDelete] = useState(false);
  const [scrollSignal, setScrollSignal] = useState(0);

  function updateUnit(fn) {
    setData(d => ({ ...d, units: d.units.map(u => u.id === unit.id ? fn(u) : u) }));
  }

  // 空の問題を1件足す。Noはそれまでの最後の問題+1（＝末尾に追加）
  function addQuestion() {
    if (!unit) return;
    const q = { id: newQuestionId(), url: '' };
    updateUnit(u => ({ ...u, questions: [...u.questions, q] }));
    setScrollSignal(n => n + 1);
    setMsg(`問題 ${unit.questions.length + 1} を追加しました。URLか写真を入れてください。`);
  }

  function addFromUrls(urls) {
    if (!unit) return 0;
    const known = new Set(unit.questions.map(q => q.url).filter(Boolean));
    const fresh = urls.filter(u => !known.has(u));
    if (!fresh.length) return 0;
    updateUnit(u => ({
      ...u,
      questions: [...u.questions, ...fresh.map(url => ({ id: newQuestionId(), url }))],
    }));
    setScrollSignal(n => n + 1);
    return fresh.length;
  }

  // 問題をコピーして真下に足す。Noは新しく振られ、記録は0から始める
  async function duplicateQuestion(qid) {
    if (!unit) return;
    const src = unit.questions.find(q => q.id === qid);
    if (!src) return;
    const copy = { id: newQuestionId(), url: src.url };
    const newPids = await copyPhotos(photoIdsOf(data.photos, qid));
    setData(d => ({
      ...d,
      units: d.units.map(u => {
        if (u.id !== unit.id) return u;
        const qs = u.questions.slice();
        qs.splice(qs.findIndex(q => q.id === qid) + 1, 0, copy);
        return { ...u, questions: qs };
      }),
      photos: newPids.length ? { ...d.photos, [copy.id]: newPids } : d.photos,
    }));
    setMsg(`問題をコピーしました（写真${newPids.length}枚も複製。正解回数は0から）`);
  }

  // ドラッグした問題を、落とした行の前（または後ろ）へ移す
  function reorder(fromId, toId, after) {
    updateUnit(u => {
      const qs = u.questions.slice();
      const from = qs.findIndex(q => q.id === fromId);
      if (from < 0) return u;
      const [moved] = qs.splice(from, 1);
      let to = qs.findIndex(q => q.id === toId);
      if (to < 0) return u;
      qs.splice(after ? to + 1 : to, 0, moved);
      return { ...u, questions: qs };
    });
  }

  function setUrl(qid, url) {
    updateUnit(u => ({ ...u, questions: u.questions.map(q => q.id === qid ? { ...q, url } : q) }));
  }

  // 表の上で Ctrl+V：画像なら写真として、文字ならURLの行として取り込む
  useWindowPaste(!!unit, clipboard => {
    const files = imageFilesFrom(clipboard, true);
    if (files.length) {
      if (pasteTarget) {
        const no = unit.questions.findIndex(q => q.id === pasteTarget) + 1;
        const existing = photoIdsOf(data.photos, pasteTarget);
        attachPhoto(pasteTarget, files[0], setData, existing)
          .then(({ sameAs }) => {
            setPasteTarget(null);
            setMsg(`問題 ${no} に写真を入れました（${existing.length + 1}枚目・${fileLabel(files[0])}）`
              + (sameAs ? `　※この問題の${sameAs}枚目と同じ画像です。コピーし直してから貼り直してください` : ''));
          })
          .catch(e => setMsg('写真を保存できませんでした: ' + (e && e.message ? e.message : e)));
      } else {
        assignPhotos(unit.questions.map(q => q.id), data.photos, files, setData).then(setMsg);
      }
      return true;
    }
    const urls = parseUrls(clipboard.getData('text') || '');
    if (!urls.length) return false;
    const added = addFromUrls(urls);
    setMsg(added ? `${added}件のURLを追加しました` : '追加できるURLがありませんでした（すべて登録済み）');
    return true;
  });

  // 公開ページはサンドボックス内で動き prompt/confirm が無視されるので、画面内で完結させる
  function createUnit() {
    const name = newName.trim() || `単元${data.units.length + 1}`;
    const unitNew = { id: `u${Date.now()}`, themeId: theme ? theme.id : '', name, questions: [] };
    setData(d => ({ ...d, units: [...d.units, unitNew] }));
    setUnitId(unitNew.id);
    setNewName('');
    setAdding(false);
    setMsg(`「${name}」を作成しました。「＋ 問題を追加」かURLの貼り付けで問題を入れてください。`);
  }

  function createTheme() {
    const name = newThemeName.trim() || `テーマ${data.themes.length + 1}`;
    const t = { id: newThemeId(), name };
    setData(d => ({ ...d, themes: [...d.themes, t] }));
    setThemeId(t.id);
    setNewThemeName('');
    setAddingTheme(false);
    setMsg(`テーマ「${name}」を作成しました。「＋ 新しい単元」で単元を追加してください。`);
  }

  function deleteTheme() {
    if (!theme) return;
    setConfirmThemeDelete(false);
    const gone = data.units.filter(u => u.themeId === theme.id);
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      gone.forEach(u => u.questions.forEach(q => { delete records[q.id]; delete photos[q.id]; }));
      return {
        ...d,
        themes: d.themes.filter(t => t.id !== theme.id),
        units: d.units.filter(u => u.themeId !== theme.id),
        records, photos,
      };
    });
    setMsg(`テーマ「${theme.name}」と単元${gone.length}件を削除しました（Ctrl+Z で元に戻せます）`);
  }

  async function deleteUnit() {
    if (!unit) return;
    setConfirmDelete(false);
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      unit.questions.forEach(q => { delete records[q.id]; delete photos[q.id]; });
      const units = d.units.filter(u => u.id !== unit.id);
      return { ...d, units, records, photos };
    });
    // 選択は切り替えない。存在しない間は先頭の単元が表示され、Ctrl+Zで戻すと元の単元に復帰する
    setMsg(`「${unit.name}」を削除しました（Ctrl+Z で元に戻せます）`);
  }

  function deleteRow(qid) {
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      delete records[qid];
      delete photos[qid];
      return {
        ...d,
        units: d.units.map(u => u.id === unit.id ? { ...u, questions: u.questions.filter(q => q.id !== qid) } : u),
        records, photos,
      };
    });
  }

  const inputClass = 'w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white';

  // 「＋ 新しい単元」を押すと出てくる入力欄
  const newUnitForm = adding
    ? h('div', { className: 'flex items-end gap-2' },
        h('div', null,
          h('label', { className: 'xl-label' }, '新しい単元の名前'),
          h('input', {
            type: 'text', value: newName, autoFocus: true, style: { width: '220px' },
            placeholder: '例: 離散数学',
            onChange: e => setNewName(e.target.value),
            onKeyDown: e => { if (e.key === 'Enter') createUnit(); if (e.key === 'Escape') { setAdding(false); setNewName(''); } }
          })
        ),
        h('button', { className: 'xl-btn', onClick: createUnit }, '作成'),
        h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAdding(false); setNewName(''); } }, 'やめる')
      )
    : h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAdding(true); setNewName(''); } }, '＋ 新しい単元');

  // テーマの行（新規作成・名前変更・削除）
  const themeRow = h('div', { className: 'xl-toolbar flex flex-wrap items-end gap-3' },
    h('div', null,
      h('label', { className: 'xl-label' }, 'テーマ（試験）'),
      h('select', {
        title: 'テーマ', value: theme ? theme.id : '', style: { minWidth: '200px' },
        onChange: e => { setThemeId(e.target.value); setPasteTarget(null); setConfirmDelete(false); setConfirmThemeDelete(false); },
      }, data.themes.map(t => h('option', { key: t.id, value: t.id },
        `${t.name}（${data.units.filter(u => u.themeId === t.id).length}単元）`)))
    ),
    theme && h('div', { className: 'xl-field-wide' },
      h('label', { className: 'xl-label' }, 'テーマ名'),
      h('input', {
        type: 'text', value: theme.name, style: { width: '180px' },
        onChange: e => {
          const v = e.target.value;
          setData(d => ({ ...d, themes: d.themes.map(t => t.id === theme.id ? { ...t, name: v } : t) }));
        }
      })
    ),
    addingTheme
      ? h('div', { className: 'flex items-end gap-2' },
          h('div', null,
            h('label', { className: 'xl-label' }, '新しいテーマの名前'),
            h('input', {
              type: 'text', value: newThemeName, autoFocus: true, style: { width: '200px' },
              placeholder: '例: 税理士試験',
              onChange: e => setNewThemeName(e.target.value),
              onKeyDown: e => { if (e.key === 'Enter') createTheme(); if (e.key === 'Escape') { setAddingTheme(false); setNewThemeName(''); } }
            })
          ),
          h('button', { className: 'xl-btn', onClick: createTheme }, '作成'),
          h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAddingTheme(false); setNewThemeName(''); } }, 'やめる')
        )
      : h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAddingTheme(true); setNewThemeName(''); } }, '＋ 新しいテーマ'),
    theme && (confirmThemeDelete
      ? h('div', { className: 'flex items-center gap-2' },
          h('span', { style: { fontSize: '12px', color: '#a11' } },
            `「${theme.name}」と中の単元${unitsOfTheme.length}件を削除します`),
          h('button', { className: 'xl-btn', style: { background: '#a11', borderColor: '#800' }, onClick: deleteTheme }, '削除する'),
          h('button', { className: 'xl-btn xl-btn-sub', onClick: () => setConfirmThemeDelete(false) }, 'やめる')
        )
      : h('button', {
          className: 'xl-btn xl-btn-sub', style: { color: '#a11' },
          onClick: () => setConfirmThemeDelete(true),
        }, 'このテーマを削除'))
  );

  if (!unit) {
    return h('div', { className: 'xl-app' },
      themeRow,
      h('div', { className: 'xl-toolbar' }, newUnitForm),
      h('div', { className: 'xl-empty' },
        theme ? `テーマ「${theme.name}」にはまだ単元がありません。「＋ 新しい単元」から作成してください。`
              : 'テーマがありません。「＋ 新しいテーマ」から作成してください。'),
      h(TransferPanel, { data, setData, setMsg, sel })
    );
  }

  const withPhoto = unit ? unit.questions.filter(q => photoIdsOf(data.photos, q.id).length).length : 0;
  const photoCount = unit ? unit.questions.reduce((n, q) => n + photoIdsOf(data.photos, q.id).length, 0) : 0;
  const withUrl = unit ? unit.questions.filter(q => q.url).length : 0;

  return h('div', { className: 'xl-app' },
    themeRow,
    h('div', { className: 'xl-toolbar flex flex-wrap items-end gap-3' },
      h('div', { className: 'xl-field-wide' },
        h('label', { className: 'xl-label' }, '単元'),
        h('select', {
