<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#030712" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="基本情報対策" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<title>基本情報技術者試験 対策</title>
<link rel="stylesheet" href="tw.css" />
<script src="react.js"></script>
<script src="react-dom.js"></script>
<script src="jszip.js"></script>
<style>
  /* ── 色と形の決めごと ─────────────────────────────────────────────────
     角丸・影・文字の大きさ・色を数種類に絞って、画面ごとにばらけないようにする。
     白と黒は同じ変数を差し替えるだけで入れ替わる。 */
  :root {
    --bg:#F4F6F9; --surface:#FFFFFF; --sunken:#F5F7FA; --line:#E9EDF3;
    --ink:#0F172A; --muted:#64748B; --faint:#94A3B8;
    --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF0FE;
    --ok:#16A34A; --ok-soft:#E9F8EF; --ok-line:#BFE7CE;
    --warn:#B45309; --warn-soft:#FEF6E7; --danger:#DC2626;
    --shadow:0 1px 2px rgba(16,24,40,.06); --shadow-lg:0 6px 24px rgba(16,24,40,.14);
    --r:16px; --r-sm:12px; --r-xs:10px;
  }
  html[data-theme="dark"] {
    --bg:#0E121A; --surface:#171D28; --sunken:#212936; --line:#2A3344;
    --ink:#E8ECF3; --muted:#95A1B4; --faint:#6B7789;
    --accent:#818CF8; --accent-ink:#101425; --accent-soft:#262E4A;
    --ok:#34D399; --ok-soft:#16302A; --ok-line:#2A5F4C;
    --warn:#FBBF24; --warn-soft:#332A14; --danger:#F87171;
    --shadow:0 1px 2px rgba(0,0,0,.45); --shadow-lg:0 8px 28px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { touch-action: manipulation; font-family: inherit; }
  .pb-safe { padding-bottom: max(5rem, calc(5rem + env(safe-area-inset-bottom))); }
  .pomo-btn { bottom: 16px; }

  /* ── 上のバー ───────────────────────────────────────────────────────── */
  .appbar {
    position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--line);
  }
  .appbar .inner { display:flex; align-items:center; gap:8px; padding:10px 16px; }
  .appbar .title { font-size:19px; font-weight:800; letter-spacing:.01em; }
  .appbar .dots { display:flex; gap:5px; }
  .appbar .dots i { width:6px; height:6px; border-radius:50%; background:var(--line); display:block; }
  .appbar .dots i.cur { background:var(--accent); }
  .icon-btn {
    width:36px; height:36px; border-radius:var(--r-sm); background:var(--surface);
    border:1px solid var(--line); color:var(--muted); font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; padding:0;
  }
  .icon-btn:disabled { color:var(--faint); opacity:.5; cursor:not-allowed; }
  .icon-btn.on { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .tab-btn {
    background:none; border:0; color:var(--muted); font-size:13px; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .tab-btn.on { background:var(--accent-soft); color:var(--accent); }

  /* ── 下のタブ（スマホ）─────────────────────────────────────────────── */
  .tabbar {
    position:fixed; left:12px; right:12px; z-index:45;
    bottom:calc(12px + env(safe-area-inset-bottom));
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    box-shadow:var(--shadow-lg); display:flex; padding:7px 5px;
  }
  .tabbar button {
    flex:1; background:none; border:0; padding:4px 0; cursor:pointer;
    font-size:11px; font-weight:700; color:var(--faint);
  }
  .tabbar button b { display:block; font-size:18px; font-weight:400; margin-bottom:1px; }
  .tabbar button.on { color:var(--accent); }

  /* ── 画面の土台 ─────────────────────────────────────────────────────── */
  .xl-app { background:transparent; color:var(--ink); }
  .card, .xl-toolbar, .gauge, .xl-scroll, .xl-status, .xl-empty {
    background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
  }
  .xl-toolbar { padding:12px; margin-bottom:10px; }
  .xl-label { font-size:11px; color:var(--muted); margin-bottom:4px; display:block; font-weight:700; }
  .xl-input, .xl-toolbar select, .xl-toolbar input, .q-line .cnt, .q-row select {
    border:1px solid var(--line); background:var(--sunken); color:var(--ink); font-size:14px;
    padding:9px 10px; border-radius:var(--r-xs); font-family:inherit; font-weight:600;
  }
  .xl-input:focus, .xl-toolbar select:focus, .xl-toolbar input:focus, .q-line .cnt:focus {
    outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface);
  }
  .xl-btn {
    background:var(--accent); color:var(--accent-ink); border:0; font-size:14px; font-weight:700;
    padding:10px 16px; border-radius:var(--r-sm); cursor:pointer;
  }
  .xl-btn:disabled { background:var(--line); color:var(--faint); cursor:not-allowed; }
  .xl-btn-sub { background:var(--sunken); color:var(--ink); border:1px solid var(--line); font-weight:600; }
  .xl-btn-sub:disabled { color:var(--faint); }
  .xl-scroll { overflow:auto; max-height:62vh; padding:2px; }
  .xl-status { margin-top:10px; padding:9px 12px; font-size:12px; color:var(--muted); box-shadow:none; background:transparent; }
  .xl-msg { background:var(--warn-soft); color:var(--warn); font-size:12px; padding:8px 12px; border-radius:var(--r-sm); }
  .xl-target { background:var(--warn-soft); color:var(--warn); font-size:12px; padding:8px 12px; border-radius:var(--r-sm); margin-bottom:8px; }
  .xl-empty { padding:32px; text-align:center; color:var(--muted); font-size:13px; }
  .xl-drop { background:var(--sunken); border:2px dashed var(--line); border-radius:var(--r-sm); padding:14px; text-align:center; font-size:12px; color:var(--muted); }
  .xl-drop.hot { border-color:var(--accent); background:var(--accent-soft); }

  /* ── 表（PC）─────────────────────────────────────────────────────────── */
  .xl-table { border-collapse:separate; border-spacing:0; font-size:14px; color:var(--ink); white-space:nowrap; width:100%; }
  .xl-col-url { width:100%; }
  .xl-col-photo { min-width:170px; }
  .xl-thumb, .xl-cell .xl-btn { flex:0 0 auto; }
  .xl-table th, .xl-table td { border-bottom:1px solid var(--line); }
  .xl-table thead th {
    position:sticky; top:0; z-index:2; background:var(--surface); color:var(--muted); font-weight:700;
    text-align:left; padding:9px 12px; font-size:11px; letter-spacing:.04em;
  }
  .xl-table tbody tr:hover td { background:var(--sunken); }
  .xl-rownum {
    color:var(--faint); text-align:center; width:46px; min-width:46px; font-weight:700;
    padding:7px 4px; position:sticky; left:0; z-index:1; background:var(--surface);
  }
  .xl-table tbody tr:hover .xl-rownum { background:var(--sunken); }
  .xl-cell { padding:6px 12px; }
  .xl-grip { cursor:grab; user-select:none; }
  .xl-grip:active { cursor:grabbing; }
  .xl-grip .g { color:var(--faint); margin-right:3px; }
  .xl-dragging td { opacity:.4; }
  .xl-drop-before td { box-shadow:inset 0 2px 0 0 var(--accent); }
  .xl-drop-after td { box-shadow:inset 0 -2px 0 0 var(--accent); }
  .xl-link { color:var(--accent); text-decoration:none; font-family:inherit; font-size:13px; padding:0; font-weight:700; background:none; border:0; cursor:pointer; }
  .xl-link:hover { text-decoration:underline; }
  .xl-url { flex:1 1 auto; min-width:0; border:1px solid transparent; background:transparent; font-family:inherit; font-size:13px; color:var(--ink); padding:5px 6px; border-radius:8px; }
  .xl-url:hover { border-color:var(--line); background:var(--sunken); }
  .xl-url:focus { outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface); }
  .xl-url::placeholder { color:var(--faint); }
  .xl-select { border:1px solid transparent; background:transparent; font-size:13px; color:var(--ink); padding:5px 6px; border-radius:8px; font-family:inherit; font-weight:600; }
  .xl-select:hover { border-color:var(--line); background:var(--sunken); }
  .xl-select:focus { outline:2px solid var(--accent); outline-offset:-2px; background:var(--surface); }
  .xl-thumb { height:34px; width:auto; border-radius:8px; display:block; cursor:pointer; background:var(--sunken); }

  /* ── 正解ボタン（押すと弾ける）───────────────────────────────────────── */
  .ok-btn {
    position:relative; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    background:var(--ok-soft); border:1px solid var(--ok-line); color:var(--ok); border-radius:var(--r-sm);
    width:42px; height:42px; font-size:19px; font-weight:800; cursor:pointer; line-height:1; padding:0;
  }
  .ok-btn.pop { animation:okpop .45s cubic-bezier(.2,1.6,.4,1); background:var(--ok); color:#fff; border-color:var(--ok); }
  .ok-btn.pop::after {
    content:''; position:absolute; inset:-6px; border-radius:16px;
    border:2px solid var(--ok); animation:okring .55s ease-out forwards; pointer-events:none;
  }
  @keyframes okpop { 0%{transform:scale(1)} 35%{transform:scale(1.18)} 100%{transform:scale(1)} }
  @keyframes okring { 0%{opacity:.9;transform:scale(.7)} 100%{opacity:0;transform:scale(1.5)} }
  .spark { position:fixed; pointer-events:none; z-index:70; font-size:20px; animation:sparkfly .7s ease-out forwards; }
  @keyframes sparkfly { 0%{opacity:1;transform:translate(0,0) scale(.6)} 100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)} }

  /* ── 進み具合（メーターと今日の球）─────────────────────────────────── */
  .gauge { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:10px; }
  .gauge .meter { flex:1 1 auto; min-width:0; }
  .gauge .bar { height:7px; border-radius:999px; background:var(--line); overflow:hidden; }
  .gauge .bar > i { display:block; height:100%; border-radius:999px; background:var(--ok); transition:width .5s cubic-bezier(.2,.9,.3,1); }
  .gauge .cap { font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:5px; font-weight:700; }
  .gauge .cap b { color:var(--ink); font-weight:800; }
  .ball {
    flex:0 0 auto; width:54px; height:54px; border-radius:50%; position:relative; overflow:hidden;
    border:2px solid var(--line); background:var(--sunken); cursor:pointer; padding:0;
  }
  .ball > i {
    position:absolute; left:-25%; width:150%; bottom:0; height:0;
    background:var(--accent); transition:height .6s cubic-bezier(.2,.9,.3,1);
  }
  .ball > i::before, .ball > i::after {
    content:''; position:absolute; top:-6px; left:0; width:100%; height:12px; border-radius:50%; background:inherit;
  }
  .ball > i::after { opacity:.6; animation:wave 3s linear infinite; }
  @keyframes wave { 0%{transform:translateX(-12%)} 50%{transform:translateX(12%)} 100%{transform:translateX(-12%)} }
  .ball .lab { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--ink); }
  .ball.full { border-color:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }

  /* ── 問題ページを開いている画面 ─────────────────────────────────────────
     読む面積をいちばん広く取り、よく使うものだけ下に大きく置く。 */
  .viewer {
    position:fixed; inset:0; z-index:55; display:flex; flex-direction:column; background:var(--bg);
  }
  .viewer-top {
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .viewer-top .who { flex:1 1 auto; min-width:0; }
  .viewer-top .who .u {
    display:block; font-size:11px; color:var(--muted); font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .viewer-top .who .n { display:block; font-size:16px; font-weight:800; color:var(--ink); }
  .v-chip {
    flex:0 0 auto; background:var(--sunken); border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer;
    font-variant-numeric:tabular-nums; font-family:inherit;
  }
  .v-chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .v-chip.off { color:var(--faint); }
  .v-chip.hot { background:var(--danger); border-color:var(--danger); color:#fff; }
  .viewer-pop {
    flex:0 0 auto; display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .v-opt {
    background:var(--sunken); border:1px solid var(--line); color:var(--ink); border-radius:999px;
    padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .v-opt.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .v-opt:disabled { color:var(--faint); }
  .viewer-body { flex:1 1 auto; position:relative; background:#fff; }
  .viewer-note {
    position:absolute; left:16px; right:16px; top:38%; text-align:center;
    font-size:14px; line-height:1.7; color:#333;
  }
  .viewer-bottom {
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line);
  }
  .v-close {
    flex:1 1 auto; background:var(--accent); color:var(--accent-ink); border:0; border-radius:var(--r-sm);
    padding:14px 10px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .v-ok {
    flex:0 0 auto; background:var(--ok-soft); border:1px solid var(--ok-line); color:var(--ok);
    border-radius:var(--r-sm); padding:14px 16px; font-size:16px; font-weight:800; cursor:pointer;
    font-family:inherit; white-space:nowrap;
  }
  .v-cnt {
    flex:0 0 auto; width:62px; text-align:center; font-size:16px; font-weight:700; font-family:inherit;
    padding:12px 2px; border:1px solid var(--line); border-radius:var(--r-sm);
    background:var(--sunken); color:var(--ink);
  }
  .v-out {
    flex:0 0 auto; width:46px; height:46px; border-radius:var(--r-sm); background:var(--sunken);
    border:1px solid var(--line); color:var(--muted); font-size:17px; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center;
  }

  /* ── 設定画面 ───────────────────────────────────────────────────────── */
  .set-body-scroll { flex:1 1 auto; overflow:auto; background:var(--bg); padding:12px; }
  .set-row { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; margin-bottom:10px; }
  .set-head { margin-bottom:10px; }
  .set-title { display:block; font-size:15px; font-weight:800; color:var(--ink); }
  .set-note { display:block; font-size:12px; color:var(--muted); margin-top:3px; line-height:1.6; }
  .set-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .set-slider { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .set-slider.off { opacity:.45; }
  .set-slider span { font-size:12px; color:var(--muted); font-weight:700; }
  .set-slider input[type=range] { flex:1 1 auto; min-width:0; accent-color:var(--accent); height:28px; }
  .set-slider input[type=number] {
    font-size:16px; font-weight:700; padding:9px 8px; border-radius:var(--r-xs);
    border:1px solid var(--line); background:var(--sunken); color:var(--ink); font-family:inherit;
  }
  .set-foot { text-align:center; font-size:11px; color:var(--faint); padding:8px 0 24px; }

  /* ── カレンダー ─────────────────────────────────────────────────────── */
  .cal-table { border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; background:var(--surface); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); }
  .cal-table th { background:var(--surface); color:var(--muted); font-weight:700; font-size:11px; padding:8px; border-bottom:1px solid var(--line); text-align:left; }
  .cal-table td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:0; vertical-align:top; height:112px; }
  .cal-out { background:var(--sunken); }
  .cal-day { font-size:12px; padding:4px 8px 1px; color:var(--muted); display:flex; align-items:center; gap:5px; font-weight:700; }
  .cal-today .cal-day { background:var(--accent); color:var(--accent-ink); }
  .cal-sun .cal-day { color:var(--danger); }
  .cal-sat .cal-day { color:var(--accent); }
  .cal-today.cal-sun .cal-day, .cal-today.cal-sat .cal-day { color:var(--accent-ink); }
  .cal-memo {
    display:block; width:100%; height:88px; border:0; outline:0; resize:none; background:transparent;
    font-family:inherit; font-size:12px; line-height:1.5; color:var(--ink); padding:3px 8px 6px;
  }
  .cal-memo:focus { background:var(--accent-soft); }
  .cal-memo::placeholder { color:var(--faint); }

  /* ── スマホ（幅720pxまで）───────────────────────────────────────────── */
  @media (max-width: 720px) {
    .pc-only { display:none !important; }
    .xl-pad { padding:8px !important; }
    /* 下のタブに隠れないよう、いちばん下に余白を残す */
    .pb-safe { padding-bottom: calc(96px + env(safe-area-inset-bottom)) !important; }
    .pomo-btn { bottom: calc(84px + env(safe-area-inset-bottom)); }
    .gauge { padding:10px; }
    .ball { width:48px; height:48px; }
    .xl-toolbar { padding:10px; }
    .xl-toolbar select, .xl-toolbar input, .xl-input { font-size:16px !important; }
    .xl-btn { padding:11px 15px; font-size:15px; }
    .xl-scroll { max-height:none; background:transparent; box-shadow:none; padding:0; }
    .xl-status { font-size:12px; padding:8px 4px; }

    /* 出題中は1問1行。単元名と何問目、正解ボタン、回数、写真を横並びにする */
    .q-line {
      display:flex; align-items:center; gap:9px; padding:5px 11px; margin-bottom:6px;
      background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
      min-height:52px; box-sizing:border-box;
    }
    .q-line .open {
      flex:1 1 auto; min-width:0; background:none; border:0; padding:0; text-align:left;
      font-family:inherit; cursor:pointer; color:var(--ink);
    }
    .q-line .open .u { display:block; font-size:11px; color:var(--muted); font-weight:700;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .q-line .open .n { display:block; font-size:16px; font-weight:800; margin-top:1px; }
    .q-line .open.none .n { color:var(--faint); }
    .q-line .cnt { flex:0 0 auto; width:56px; text-align:center; font-size:16px; padding:8px 2px; }
    .q-line .shot { flex:0 0 auto; }
    .q-line .shot .xl-thumb { height:38px; }

    /* 単元管理は1問1枚のカード */
    .q-card { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:11px 12px; margin-bottom:8px; }
    .q-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .q-no { font-weight:800; font-size:15px; color:var(--ink); }
    .q-open {
      display:block; width:100%; text-align:center; background:var(--accent-soft); border:0;
      color:var(--accent); border-radius:var(--r-sm); padding:12px; font-size:15px; font-weight:700;
      margin:8px 0; text-decoration:none; font-family:inherit; cursor:pointer;
    }
    .q-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .q-row label { font-size:13px; color:var(--muted); font-weight:700; }
    .q-row select { font-size:16px; }
    .q-photos { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .q-photos .xl-thumb { height:56px; }

    /* カレンダーは日付を小さく、書き込みは下の欄で */
    .cal-table td { height:44px; }
    .cal-table th { padding:4px; text-align:center; }
    .cal-day { justify-content:center; padding:2px; }
    .cal-memo { display:none; }
    .cal-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ok); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, createElement: h } = React;

// ── データ保存（文字データ: localStorage、画像: IndexedDB）─────────────────
const STORAGE_KEY = 'feExamData';
// 出題中の状態（選んだ単元・条件・抽選結果）。問題を解いて戻ってきても消えないように残す。
// 取り消し履歴には乗せたくないので、問題データ本体とは別に保存する。
const DRAW_KEY = 'feExamDraw';

// ── 音 ───────────────────────────────────────────────────────────────────────
// 音のファイルは持たず、その場で短い音を作って鳴らす（読み込みが要らないため）。
const SOUND_KEY = 'feExamSound';
const VOLUME_KEY = 'feExamVolume';
const DEFAULT_VOLUME = 0.7;
let audioCtx = null;

function soundOn() {
  try { return localStorage.getItem(SOUND_KEY) !== 'off'; } catch { return true; }
}

function setSoundOn(on) {
  try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch {}
}

// 0〜1。端末の音量とは別に、アプリの中での大きさを決める
function loadVolume() {
  try {
    // 未設定のとき getItem は null を返す。Number(null) は 0 なので、
    // そのまま通すと「音量ゼロ」になってしまう。先に有無を見る。
    const raw = localStorage.getItem(VOLUME_KEY);
    if (raw === null || raw === '') return DEFAULT_VOLUME;
    const v = Number(raw);
    return Number.isFinite(v) && v >= 0 && v <= 1 ? v : DEFAULT_VOLUME;
  } catch { return DEFAULT_VOLUME; }
}

function saveVolume(v) {
  try { localStorage.setItem(VOLUME_KEY, String(v)); } catch {}
}

// 「かちゃっ」は音程のある音ではなく短い雑音で作る。板をはじいたような
// 手触りにしたいので、雑音を帯域で絞ってすぐ切る。音量はどれも控えめ。
let noiseBuf = null;

function noiseBuffer(ctx) {
  if (noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = Math.floor(ctx.sampleRate * 0.06);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

// 雑音をひとつ鳴らす（at 秒後に dur 秒、hz あたりの高さ、vol の大きさ）
function clickAt(ctx, at, dur, hz, vol) {
  vol *= loadVolume();
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx);
  const band = ctx.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = hz;
  band.Q.value = 1.2;
  const gain = ctx.createGain();
  const now = ctx.currentTime + at;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(band).connect(gain).connect(ctx.destination);
  src.start(now);
  src.stop(now + dur + 0.02);
}

// 音程のある音。正解と時間切れにだけ使う
function toneAt(ctx, at, dur, hz, vol) {
  vol *= loadVolume();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const now = ctx.currentTime + at;
  osc.type = 'triangle';
  osc.frequency.value = hz;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

// ここは音量つまみが 1.0 のときの大きさ。既定の 0.7 で普通に聞こえるように取る。
const SOUNDS = {
  // ボタンやプルダウンをさわったとき。ひとつだけ、ごく短く
  click:   ctx => clickAt(ctx, 0, .04, 2400, .30),
  // 抽選はサイコロを振った感じに、かちゃかちゃと重ねる
  draw:    ctx => [0, .055, .105, .15].forEach((at, i) => clickAt(ctx, at, .045, 1800 + i * 260, .34)),
  // 問題を開くときは、少し低いかちゃっ
  open:    ctx => clickAt(ctx, 0, .045, 1500, .32),
  // 正解だけは音程を付ける
  correct: ctx => { clickAt(ctx, 0, .03, 2600, .22); toneAt(ctx, .02, .1, 880, .34); toneAt(ctx, .09, .16, 1319, .30); },
  timeup:  ctx => { toneAt(ctx, 0, .12, 420, .34); toneAt(ctx, .11, .2, 300, .30); },
};

function play(kind) {
  if (!soundOn() || !SOUNDS[kind]) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    SOUNDS[kind](audioCtx);
  } catch {}
}

// その日に手をつけた問題を数える（同じ問題を何度触っても1つ）
function markDone(prev, qid) {
  const day = todayStr();

  if (list.includes(qid)) return prev;
  const next = { ...prev, daily: { ...prev.daily, [day]: [...list, qid] } };
  saveProgress(next);
  return next;
}

// 単元の進み具合＝正解が1回以上ついた問題の割合

  if (!total) return { done: 0, total: 0, rate: 0 };
  const done = unit.questions.filter(q => ((records[q.id] || {}).correct || 0) > 0).length;
  return { done, total, rate: done / total };
}
// 最初に開いたときの中身。送ってもらった単元マスタ（単元名・m・s・問題数）から
// URLを組み立てて入れてある。単元管理タブで削除・追加・貼り替えができる。

];
const SEED_THEME = { id: 'tseed', name: '基本情報技術者試験' };
function seedUnits() {

const DEFAULT_DATA = { themes: [SEED_THEME], units: seedUnits(), records: {}, photos: {}, calendar: {} };

function newThemeId() { return `t${Date.now().toString(36)}`; }

let questionSeq = 0;

// 以前は「問題＝URL」だったので、保存済みデータを {id, url} の形に直す。
// 旧データの id は URL そのものにしておくと、記録も写真（IndexedDBのキー）もそのまま使える。
function migrate(data) {
  if (!data || !Array.isArray(data.units)) return data;
  const photos = {};
  Object.keys(data.photos || {}).forEach(qid => {
    const v = data.photos[qid];
    // 昔は1問1枚で、写真のキーが問題IDそのものだった
    if (Array.isArray(v)) photos[qid] = v;
    else if (v) photos[qid] = [qid];
  });
  let units = data.units.map(u => u.questions
    ? u
    : { id: u.id, name: u.name, questions: (u.urls || []).map(url => ({ id: url, url })) });

  // テーマ（試験）の層が無かった頃のデータを振り分ける。
  // 最初から入っていた5単元は「基本情報技術者試験」、自分で作った単元は「未分類」に置く。
  let themes = Array.isArray(data.themes) ? data.themes.slice() : [];
  if (!themes.length) {
    const isSeed = u => String(u.id).startsWith('seed');
    if (units.some(isSeed)) themes.push({ ...SEED_THEME });
    if (units.some(u => !isSeed(u))) themes.push({ id: 'tother', name: '未分類' });
    if (!themes.length) themes.push({ ...SEED_THEME });
    units = units.map(u => ({ ...u, themeId: isSeed(u) ? SEED_THEME.id : 'tother' }));
  }
  // 行き先を失った単元は先頭のテーマに置く
  const themeIds = new Set(themes.map(t => t.id));
  units = units.map(u => (u.themeId && themeIds.has(u.themeId)) ? u : { ...u, themeId: themes[0].id });

  return { ...data, photos, themes, units };
}
const COUNT_OPTIONS = Array.from({ length: 21 }, (_, i) => i);
const COUNT_MAX = COUNT_OPTIONS[COUNT_OPTIONS.length - 1];

function useLocalStorageState(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      // 保存データを先に今の形へ変換してから、足りないところだけ既定値で補う
      // （先に既定値を混ぜると、テーマなどが「既にある」と誤判定されて変換が働かない）
      return raw ? { ...initial, ...migrate(JSON.parse(raw)) } : initial;
    } catch {
      return initial;
    }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
  }, [state]);
  return [state, setState];
}

// スマホ幅かどうか（表→カード、カレンダーの作りを切り替える）
function useIsPhone() {
  const query = '(max-width: 720px)';
  const [phone, setPhone] = useState(() => typeof matchMedia === 'function' && matchMedia(query).matches);
  useEffect(() => {
    if (typeof matchMedia !== 'function') return;
    const mq = matchMedia(query);
    const on = () => setPhone(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  }, []);
  return phone;
}

function dateStr(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function todayStr() {
  const d = new Date();
  return dateStr(d.getFullYear(), d.getMonth(), d.getDate());
}

function sample(arr, n) {
  const pool = arr.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, Math.min(n, pool.length));
}

// 貼り付けたテキストから1行1件でURLを取り出す（Excelから列コピーしたときの余分な文字は無視）
function parseUrls(text) {
  const seen = new Set();
  const urls = [];
  text.split(/\r?\n/).forEach(line => {
    // 1行に複数URLが並ぶ貼り付け方（Excelの横方向コピー）でも取りこぼさない
    (line.match(/https?:\/\/\S+/g) || []).forEach(found => {
      const url = found.trim();
      if (seen.has(url)) return;
      seen.add(url);
      urls.push(url);
    });
  });
  return urls;
}

// ── 写真保存（IndexedDB。1問に何枚でも持てる）───────────────────────────────
const PHOTO_DB = 'feExamPhotos';
const PHOTO_STORE = 'photos';
const THUMB_SUFFIX = '#thumb';

let photoSeq = 0;
function newPhotoId() {
  photoSeq += 1;
  return `p${Date.now().toString(36)}${photoSeq}`;
}
// photos は { 問題ID: [写真ID, ...] }。古い { 問題ID: true } も読めるようにしておく
function photoIdsOf(photos, qid) {
  const v = photos[qid];
  if (Array.isArray(v)) return v;
  return v ? [qid] : [];
}

// 接続は1本だけ使い回す。毎回開くと接続が残り続け、ブラウザ側から
// このデータベースを消せなくなる（消去やリセットが効かなくなる）
let photoDbPromise = null;
function openPhotoDB() {
  if (!photoDbPromise) {
    photoDbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(PHOTO_STORE);
      req.onsuccess = () => {
        const db = req.result;
        // 別のタブや消去操作から要求が来たら、こちらは閉じて道を空ける
        db.onversionchange = () => { db.close(); photoDbPromise = null; };
        db.onclose = () => { photoDbPromise = null; };
        resolve(db);
      };
      req.onerror = () => { photoDbPromise = null; reject(req.error); };
    });
  }
  return photoDbPromise;
}
function photoTx(mode, run) {
  return openPhotoDB().then(db => new Promise((resolve, reject) => {
    let tx;
    try {
      tx = db.transaction(PHOTO_STORE, mode);
    } catch (e) {
      // 接続が閉じられていたら開き直して、もう一度だけ試す
      photoDbPromise = null;
      return photoTx(mode, run).then(resolve, reject);
    }
    const req = run(tx.objectStore(PHOTO_STORE));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}
const loadPhoto = pid => photoTx('readonly', st => st.get(pid));
const loadThumb = pid => photoTx('readonly', st => st.get(pid + THUMB_SUFFIX));
const erasePhoto = pid =>
  photoTx('readwrite', st => { st.delete(pid); return st.delete(pid + THUMB_SUFFIX); }).catch(() => {});

// スクショはそのままだと重いので、長辺1600pxまで縮小してJPEGにしてから保存する
function compressImage(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const hh = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = hh;
        canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// 表示用の原寸（縮小済み）とセル内サムネイルの2つを保存して、問題の末尾に足す。
// 既にある写真と中身が同じだったら何枚目と同じかを返す（クリップボードが古いままのときに気付けるように）
async function attachPhoto(qid, file, setData, existingIds) {
  const full = await compressImage(file, 1600, 0.85);
  let sameAs = 0;
  for (let i = 0; i < (existingIds || []).length; i++) {
    if ((await loadPhoto(existingIds[i])) === full) { sameAs = i + 1; break; }
  }
  const thumb = await compressImage(file, 160, 0.7);
  const pid = newPhotoId();
  await photoTx('readwrite', st => { st.put(full, pid); return st.put(thumb, pid + THUMB_SUFFIX); });
  setData(d => ({ ...d, photos: { ...d.photos, [qid]: [...photoIdsOf(d.photos, qid), pid] } }));
  return { pid, sameAs };
}

function fileLabel(file) {
  const kb = Math.round((file.size || 0) / 1024);
  return `${file.name || '画像'}／${kb}KB`;
}

// 画像の実体はここでは消さない（Ctrl+Zで戻せるように）。参照が完全に無くなったら gcPhotos が掃除する
function detachPhoto(qid, pid, setData) {
  setData(d => {
    const rest = photoIdsOf(d.photos, qid).filter(x => x !== pid);
    const photos = { ...d.photos };
    if (rest.length) photos[qid] = rest;
    else delete photos[qid];
    return { ...d, photos };
  });
  return Promise.resolve();
}

// どこからも参照されなくなった画像を IndexedDB から消す。
// 現在のデータと、元に戻せる履歴のどちらにも無いものだけが対象。
async function gcPhotos(photoMaps) {
  const keep = new Set();
  photoMaps.forEach(photos => {
    Object.keys(photos || {}).forEach(qid => photoIdsOf(photos, qid).forEach(pid => keep.add(pid)));
  });
  const keys = await photoTx('readonly', st => st.getAllKeys());
  const dead = (keys || []).filter(k => !keep.has(String(k).replace(/#thumb$/, '')));
  // 参照が1件も拾えていないのに全部消す、という掃除は必ず何かの間違いなので実行しない
  if (!dead.length || (keep.size === 0 && keys.length > 0)) return 0;
  await photoTx('readwrite', st => { dead.forEach(k => st.delete(k)); return null; });
  return dead.length;
}

// 写真を複製する（問題のコピー用）
async function copyPhotos(fromIds) {
  const newIds = [];
  for (const pid of fromIds) {
    const full = await loadPhoto(pid);
    const thumb = await loadThumb(pid);
    if (!full) continue;
    const nid = newPhotoId();
    await photoTx('readwrite', st => { st.put(full, nid); return st.put(thumb || full, nid + THUMB_SUFFIX); });
    newIds.push(nid);
  }
  return newIds;
}

// 画像を読み込んで <img> にする（トリミングで元の画素数を使うため）
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('画像を読み込めませんでした'));
    img.src = src;
  });
}

// canvas を長辺 maxDim まで縮めて JPEG のデータURLにする
function canvasToDataURL(source, maxDim, quality) {
  const scale = Math.min(1, maxDim / Math.max(source.width, source.height));
  const w = Math.max(1, Math.round(source.width * scale));
  const hh = Math.max(1, Math.round(source.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = hh;
  canvas.getContext('2d').drawImage(source, 0, 0, w, hh);
  return canvas.toDataURL('image/jpeg', quality);
}

// 指定した範囲（表示中の画像に対する0〜1の割合）だけを切り出し、別の写真として保存する。
// 元の画像はそのまま残すので、付け替えを Ctrl+Z で戻せば元の写真に戻る。
async function cropPhoto(pid, frac) {
  const full = await loadPhoto(pid);
  if (!full) throw new Error('写真が見つかりませんでした');
  const img = await loadImageEl(full);
  const sx = Math.round(frac.x * img.naturalWidth);
  const sy = Math.round(frac.y * img.naturalHeight);
  const sw = Math.max(1, Math.round(frac.w * img.naturalWidth));
  const sh = Math.max(1, Math.round(frac.h * img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = sw;
  canvas.height = sh;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const nid = newPhotoId();
  const out = canvasToDataURL(canvas, 1600, 0.85);
  const thumb = canvasToDataURL(canvas, 160, 0.7);
  await photoTx('readwrite', st => { st.put(out, nid); return st.put(thumb, nid + THUMB_SUFFIX); });
  return nid;
}

// まとめて貼られた写真を、写真がまだ無い問題に上から順に割り当てる
async function assignPhotos(questionIds, photos, files, setData) {
  const targets = [];
  questionIds.forEach((id, i) => {
    if (photoIdsOf(photos, id).length === 0) targets.push({ id, no: i + 1 });
  });
  if (!targets.length) return '割り当て先がありません（すべての問題に写真があります）。行の「＋」を押してから貼ると、その問題に追加できます。';
  const done = [];
  let failed = 0;
  for (let i = 0; i < Math.min(files.length, targets.length); i++) {
    try {
      await attachPhoto(targets[i].id, files[i], setData, []);
      done.push(targets[i].no);
    } catch (e) {
      failed++;
    }
  }
  const leftover = files.length - done.length - failed;
  return (done.length ? `問題 ${done.join('・')} に写真を入れました（${done.length}枚）` : '写真を入れられませんでした')
    + (leftover > 0 ? `／${leftover}枚は入れる先がなく未使用` : '')
    + (failed > 0 ? `／${failed}枚は保存に失敗` : '');
}

function setCountFor(qid, field, value, setData) {
  setData(d => {
    const prev = d.records[qid] || { correct: 0, wrong: 0 };
    return { ...d, records: { ...d.records, [qid]: { ...prev, [field]: value } } };
  });
}

// 複数枚まとめて貼ったときは、ファイル名の数字順（＝撮った順）で上から割り当てる
function imageFilesFrom(source, dedupe) {
  let out = [];
  if (source && source.items && source.items.length) {
    for (const item of source.items) {
      if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
        const f = item.getAsFile();
        if (f) out.push(f);
      }
    }
  } else if (source && source.files) {
    for (const f of source.files) {
      if (f.type && f.type.startsWith('image/')) out.push(f);
    }
  }
  // 1回のコピーでも、同じ絵がPNGとJPEGの両方でクリップボードに入ることがある。
  // そのまま扱うと1枚のつもりが2枚として別々の問題に入ってしまうので、拡張子違いは1枚にまとめる。
  if (dedupe) {
    const seen = new Set();
    out = out.filter(f => {
      const base = String(f.name || '').replace(/\.[^.]*$/, '').toLowerCase();
      if (seen.has(base)) return false;
      seen.add(base);
      return true;
    });
  }
  return out.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
}

// ── 写真の受け取り（貼り付け・ドロップ・ファイル選択）─────────────────────────
function PhotoDropZone({ label, multiple, onImages }) {
  const [hot, setHot] = useState(false);

  return h('div', {
    onDragOver: e => { e.preventDefault(); setHot(true); },
    onDragLeave: () => setHot(false),
    onDrop: e => {
      e.preventDefault();
      setHot(false);
      const files = imageFilesFrom(e.dataTransfer, true);
      if (files.length) onImages(files);
    },
    className: `xl-drop ${hot ? 'hot' : ''}`
  },
    h('p', { style: { marginBottom: '8px' } }, label),
    h('label', { className: 'xl-btn xl-btn-sub', style: { cursor: 'pointer' } },
      multiple ? '写真を選ぶ（複数可）' : '写真を選ぶ',
      h('input', {
        type: 'file', accept: 'image/*', multiple: !!multiple, style: { display: 'none' },
        onChange: e => {
          const files = imageFilesFrom(e.target);
          if (files.length) onImages(files);
          e.target.value = '';
        }
      })
    )
  );
}

// 画面のどこで Ctrl+V しても拾う（入力欄にフォーカスがあるときは邪魔しない）
function useWindowPaste(active, handler) {
  const cb = useRef(handler);
  cb.current = handler;
  useEffect(() => {
    if (!active) return;
    function onPaste(e) {
      const tag = e.target && e.target.tagName;
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
      // 入力欄に文字を貼るのは邪魔しない。ただし画像は、どこにカーソルがあっても受け取る
      if (inField && !imageFilesFrom(e.clipboardData).length) return;
      if (cb.current(e.clipboardData)) e.preventDefault();
    }
    window.addEventListener('paste', onPaste);
    return () => window.removeEventListener('paste', onPaste);
  }, [active]);
}

// ── 問題ページをアプリの中で開く ─────────────────────────────────────────────
// 相手のサイトが「他所への埋め込み」を断っていると中身が出ないことがあるので、
// そのときのために必ず「新しいタブで開く」も添えておく。
// 表示の大きさ。端末ごとに覚えておく（毎回合わせ直さなくて済むように）
const ZOOM_KEY = 'feExamZoom';
const ZOOM_MIN = 0.4;
const ZOOM_MAX = 1.5;

function loadZoom() {
  const v = Number(localStorage.getItem(ZOOM_KEY));
  return v >= ZOOM_MIN && v <= ZOOM_MAX ? v : 1;
}

function LinkViewer({ url, no, unitName, record, onSetCount, onClose }) {
  const [loaded, setLoaded] = useState(false);
  const [slow, setSlow] = useState(false);
  const [limit, setLimit] = useState(() => loadLimit());   // 0 は「なし」
  const [left, setLeft] = useState(() => loadLimit());
  const [pickLimit, setPickLimit] = useState(false);
  const [pickZoom, setPickZoom] = useState(false);
  const [zoom, setZoom] = useState(() => { try { return loadZoom(); } catch { return 1; } });
  // 枠の実寸。縮小したぶん中のページを広く描き、全体を縮めて収める。
  const boxRef = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });

  useEffect(() => {
    function measure() {
      const el = boxRef.current;
      if (!el) return;
      const b = el.getBoundingClientRect();
      setSize(prev => (Math.abs(prev.w - b.width) < 0.5 && Math.abs(prev.h - b.height) < 0.5)
        ? prev : { w: b.width, h: b.height });
    }
    measure();
    window.addEventListener('resize', measure);
    window.addEventListener('orientationchange', measure);
    return () => {
      window.removeEventListener('resize', measure);
      window.removeEventListener('orientationchange', measure);
    };
  }, []);

  function changeZoom(next) {
    const v = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(next * 10) / 10));
    setZoom(v);
    try { localStorage.setItem(ZOOM_KEY, String(v)); } catch {}
  }

  useEffect(() => {
    setLoaded(false);
    setSlow(false);
    const id = setTimeout(() => setSlow(true), 5000);
    return () => clearTimeout(id);
  }, [url]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  // 制限時間。0になったら音を鳴らして、選ぶ画面へ自分で戻る。
  useEffect(() => {
    setLeft(limit);
    if (!limit) return undefined;
    const started = Date.now();
    const id = setInterval(() => {
      const rest = limit - Math.floor((Date.now() - started) / 1000);
      if (rest > 0) { setLeft(rest); return; }
      clearInterval(id);
      setLeft(0);
      play('timeup');
      onClose();
    }, 250);
    return () => clearInterval(id);
  }, [url, limit, onClose]);

  const zoomPct = Math.round(zoom * 100);

  // 画面いっぱいに出したいが、なぞって動かす箱の中は transform が掛かっていて
  // fixed が効かない。body の直下に出して確実に全面を覆う。
  return ReactDOM.createPortal(h('div', { className: 'viewer' },
    // 上は「どの問題か」と残り時間だけ。読むための面積を最優先にする。
    h('div', { className: 'viewer-top' },
      h('div', { className: 'who' },
        h('span', { className: 'u' }, unitName || ''),
        h('span', { className: 'n' }, `${no}問目`)
      ),
      h('button', {
        className: 'v-chip' + (limit && left <= 10 ? ' hot' : '') + (limit ? '' : ' off'),
        onClick: () => { setPickLimit(v => !v); setPickZoom(false); },
        title: '制限時間を変える',
      }, limit ? `⏱ ${left}秒` : '⏱ なし'),
      h('button', {
        className: 'v-chip' + (pickZoom ? ' on' : ''),
        onClick: () => { setPickZoom(v => !v); setPickLimit(false); },
        title: '文字の大きさを変える',
      }, `🔍 ${zoomPct}%`)
    ),

    (pickLimit || pickZoom) && h('div', { className: 'viewer-pop' },
      pickLimit && LIMIT_CHOICES.map(v => h('button', {
        key: v, className: 'v-opt' + (v === limit ? ' on' : ''),
        onClick: () => { setLimit(v); saveLimit(v); setPickLimit(false); },
      }, limitLabel(v))),
      pickZoom && h(React.Fragment, null,
        h('button', { className: 'v-opt', onClick: () => changeZoom(zoom - 0.1), disabled: zoom <= ZOOM_MIN }, '− 小さく'),
        // 割合を選んだら閉じる。−／＋は続けて押すので開いたままにする。
        [0.5, 0.7, 0.85, 1, 1.25].map(v => h('button', {
          key: v, className: 'v-opt' + (Math.abs(v - zoom) < 0.01 ? ' on' : ''),
          onClick: () => { changeZoom(v); setPickZoom(false); },
        }, `${Math.round(v * 100)}%`)),
        h('button', { className: 'v-opt', onClick: () => changeZoom(zoom + 0.1), disabled: zoom >= ZOOM_MAX }, '＋ 大きく')
      )
    ),

    h('div', {
      ref: boxRef,
      className: 'viewer-body',
      // iOSでは枠を指定しても中身の大きさまで広がってしまうので、外側でスクロールさせる
      style: { overflow: 'auto', WebkitOverflowScrolling: 'touch' },
    },
      size.w > 0 && h('iframe', {
        src: url, title: `問題 ${no}`, onLoad: () => setLoaded(true), scrolling: 'yes',
        style: {
          border: 0, display: 'block',
          width: `${size.w / zoom}px`, height: `${size.h / zoom}px`,
          transform: `scale(${zoom})`, transformOrigin: 'top left',
        },
      }),
      !loaded && slow && h('div', { className: 'viewer-note' },
        'このページはアプリの中では表示できないようです。右下の ↗ を押すと、新しいタブで開けます。')
    ),

    // 下に、いちばん使うものを大きく並べる
    h('div', { className: 'viewer-bottom' },
      h('button', { className: 'v-close', onClick: onClose, title: '閉じる（Esc）' }, '✕ 閉じる'),
      onSetCount && h('button', {
        className: 'v-ok', 'data-sound': 'own',
        onClick: e => { play('correct'); burstFrom(e.currentTarget); onSetCount('correct', Math.min(COUNT_MAX, record.correct + 1)); },
        title: '正解を1つ足す',
      }, '✓ 正解'),
      onSetCount && h('select', {
        className: 'v-cnt', title: 'この問題の正解回数', 'data-sound': 'off', value: record.correct,
        onChange: e => onSetCount('correct', Number(e.target.value)),
      }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
      h('a', {
        className: 'v-out', href: url, target: '_blank', rel: 'noopener noreferrer', title: '別のタブで開く',
      }, '↗')
    )
  ), document.body);
}

// ── 設定画面 ────────────────────────────────────────────────────────────────
// あちこちに散っていたつまみを1か所に集める。開くたびに今の値を読み直す。

  useEffect(() => {

  return ReactDOM.createPortal(h('div', { className: 'viewer' },
    h('div', { className: 'viewer-top' },
      h('div', { className: 'who' }, h('span', { className: 'n' }, '設定')),
      h('button', { className: 'v-chip', onClick: onClose, title: '閉じる（Esc）' }, '✕')
    ),

    h('div', { className: 'set-body-scroll' },
      row('見た目', '端末に合わせると、スマホの設定に従います',
        chips([['light', '☀️ 白'], ['dark', '🌙 黒'], ['auto', '端末に合わせる']], themeMode, v => setThemeMode(v))),

      row('音', sound ? `大きさ ${Math.round(volume * 100)}%` : '切っています',
        h('div', null,
          chips([[true, '🔊 鳴らす'], [false, '🔇 消す']], sound,
            v => { setSound(v); setSoundOn(v); if (v) play('correct'); }),
          h('div', { className: 'set-slider' + (sound ? '' : ' off') },
            h('span', null, '小'),
            h('input', {
              type: 'range', min: 0, max: 100, step: 5, value: Math.round(volume * 100),
              disabled: !sound, title: '音の大きさ',

            }),
            h('span', null, '大'),
            h('button', {
              className: 'v-opt', disabled: !sound, onClick: () => play('correct'), title: '音を試す',
            }, '試す')
          ))),

      row('1問あたりの制限時間', '時間切れになると、選ぶ画面へ自動で戻ります',
        chips(LIMIT_CHOICES.map(v => [v, limitLabel(v)]), limit,

      row('1日の目標', '出題画面の球が、この数に対して溜まります',
        h('div', { className: 'set-slider' },
          h('input', {

            onBlur: () => {

              setGoal(String(n));

            },
          }),
          h('span', null, '問'))),

      row('問題ページの文字の大きさ', '問題を開いたときの表示倍率',
        chips([[0.5, '50%'], [0.7, '70%'], [0.85, '85%'], [1, '100%'], [1.25, '125%']], zoom,
          v => { setZoom(v); try { localStorage.setItem(ZOOM_KEY, String(v)); } catch {} })),

      row('データの持ち運び', '書き出し・読み込みは「単元管理」の下にあります',
        h('span', { className: 'set-note' },
          'ときどき書き出して保存しておくと、端末を変えても続きから使えます。')),

      h('div', { className: 'set-foot' }, '過去問演習アプリ')

    h('div', { className: 'viewer-bottom' },
