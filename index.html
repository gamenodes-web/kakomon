<style>
  body { background: #030712; color: white; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }

  /* ── Excel風のシート表示（PC向け）───────────────────────────────── */
  .xl-app { background:#f7f7f7; border:1px solid #8a8a8a; border-radius:4px; color:#1f2328; overflow:hidden; }

  .xl-label { font-size:12px; color:#555; margin-bottom:3px; display:block; }
  .xl-input, .xl-toolbar select, .xl-toolbar input {

  .xl-btn-sub { background:#fff; color:#1f2328; border:1px solid #b0b0b0; font-weight:400; }
  .xl-btn-sub:hover { background:#eaeaea; }
  .xl-scroll { background:#fff; overflow:auto; max-height:62vh; }
  .xl-table { border-collapse:separate; border-spacing:0; font-size:13px; color:#1f2328; white-space:nowrap; width:100%; }
  /* URL列に余白を吸わせて、表を画面幅いっぱいに広げる */
  .xl-col-url { width:100%; }
  .xl-col-photo { min-width:170px; }
  .xl-thumb, .xl-cell .xl-btn { flex:0 0 auto; }
  .xl-table th, .xl-table td { border-right:1px solid #d9d9d9; border-bottom:1px solid #d9d9d9; }
  .xl-table thead th {
    position:sticky; top:0; z-index:2; background:#f2f2f2; color:#333; font-weight:600;
    text-align:left; padding:6px 10px; border-bottom:1px solid #a6a6a6;
  }
  .xl-table tbody tr:hover td { background:#eaf3ff; }
  .xl-rownum {
    background:#f2f2f2; color:#666; text-align:center; width:46px; min-width:46px;

  }
  .xl-table tbody tr:hover .xl-rownum { background:#dbe9fb; }
  .xl-cell { padding:5px 10px; }
  .xl-grip { cursor:grab; user-select:none; }
  .xl-grip:active { cursor:grabbing; }
  .xl-grip .g { color:#b0b0b0; margin-right:3px; }
  .xl-dragging td { opacity:.4; }
  .xl-drop-before td { box-shadow:inset 0 2px 0 0 #217346; }
  .xl-drop-after td { box-shadow:inset 0 -2px 0 0 #217346; }
    .xl-link { color:#1155cc; text-decoration:none; font-family:inherit; font-size:13px; padding:0; }

  /* 正解ボタン。押すと数字が跳ねて、輪が広がる（暫定のエフェクト） */
  .ok-btn {
    position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
    background: #eafaf0; border: 1px solid #9ad9b4; color: #12703c; border-radius: 6px;
    padding: 10px 12px; font-size: 15px; font-family: inherit; cursor: pointer; line-height: 1;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .ok-btn .n { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 12px; text-align: center; }
  .ok-btn.pop { animation: okpop .45s cubic-bezier(.2,1.6,.4,1); background: #b9f3d0; border-color: #3fbf78; }
  .ok-btn.pop .n { animation: oknum .45s cubic-bezier(.2,1.8,.3,1); }
  .ok-btn.pop::after {
    content: ''; position: absolute; inset: -6px; border-radius: 12px;
    border: 2px solid #35c47a; animation: okring .55s ease-out forwards; pointer-events: none;
  }
  @keyframes okpop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes oknum { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-6px) scale(1.5); } 100% { transform: translateY(0) scale(1); } }
  @keyframes okring { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.5); } }
  .spark { position: fixed; pointer-events: none; z-index: 70; font-size: 20px; animation: sparkfly .7s ease-out forwards; }
  @keyframes sparkfly { 0% { opacity: 1; transform: translate(0,0) scale(.6); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); } }

  /* 単元のメーターと、今日の目標の球 */
  .gauge { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border-bottom: 1px solid #d9d9d9; }
  .gauge .meter { flex: 1 1 auto; min-width: 0; }
  .gauge .bar { height: 12px; border-radius: 999px; background: #e8e8e8; overflow: hidden; }
  .gauge .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg,#39b56a,#7fe3a5); transition: width .5s cubic-bezier(.2,.9,.3,1); }
  .gauge .cap { font-size: 11px; color: #666; display: flex; justify-content: space-between; margin-bottom: 3px; }
  .ball { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%; position: relative; overflow: hidden;
          border: 2px solid #b9cfe8; background: #f2f7fd; cursor: pointer; }
  .ball > i { position: absolute; left: -25%; width: 150%; bottom: 0; height: 0;
              background: linear-gradient(180deg,#5db2f0,#2d7fd0); transition: height .6s cubic-bezier(.2,.9,.3,1); }
  .ball > i::before, .ball > i::after {
    content: ''; position: absolute; top: -6px; left: 0; width: 100%; height: 12px; border-radius: 50%;
    background: inherit;
  }

  @keyframes wave { 0% { transform: translateX(-12%); } 50% { transform: translateX(12%); } 100% { transform: translateX(-12%); } }
  .ball .lab { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font-size: 12px; font-weight: 700; color: #123; text-shadow: 0 1px 2px rgba(255,255,255,.8); }
  .ball.full { border-color: #3fbf78; box-shadow: 0 0 0 3px rgba(63,191,120,.25); }
  .xl-link:hover { text-decoration:underline; }
  .xl-url { flex:1 1 auto; min-width:0; border:1px solid transparent; background:transparent; font-family:inherit; font-size:13px; color:#1f2328; padding:3px 4px; border-radius:2px; }
  .xl-url:hover { border-color:#c4c4c4; background:#fff; }
  .xl-url:focus { outline:2px solid #217346; outline-offset:-2px; background:#fff; }
  .xl-url::placeholder { color:#b0b0b0; }
  .xl-select { border:1px solid transparent; background:transparent; font-size:13px; color:#1f2328; padding:3px 4px; border-radius:2px; font-family:inherit; }
  .xl-select:hover { border-color:#c4c4c4; background:#fff; }
  .xl-select:focus { outline:2px solid #217346; outline-offset:-2px; background:#fff; }
  .xl-thumb { height:34px; width:auto; border:1px solid #c4c4c4; display:block; cursor:pointer; background:#fff; }

  /* ── カレンダー（日付のマスに直接書き込む）───────────────────────────── */
  .cal-table { border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; background:#fff; }
  .cal-table th {
    background:#f2f2f2; color:#333; font-weight:600; font-size:12px; padding:5px 8px;
    border-right:1px solid #d9d9d9; border-bottom:1px solid #a6a6a6; text-align:left;
  }
  .cal-table td { border-right:1px solid #d9d9d9; border-bottom:1px solid #d9d9d9; padding:0; vertical-align:top; height:112px; }
  .cal-out { background:#fafafa; }
  .cal-day { font-size:12px; padding:3px 7px 1px; color:#555; display:flex; align-items:center; gap:5px; }
  .cal-today .cal-day { background:#217346; color:#fff; font-weight:700; }
  .cal-sun .cal-day { color:#c00000; }
  .cal-sat .cal-day { color:#0070c0; }
  .cal-today.cal-sun .cal-day, .cal-today.cal-sat .cal-day { color:#fff; }
  .cal-memo {
    display:block; width:100%; height:88px; border:0; outline:0; resize:none; background:transparent;
    font-family:inherit; font-size:12px; line-height:1.5; color:#1f2328; padding:3px 7px 6px;
  }
  .cal-memo:focus { background:#fffbe6; }
  .cal-memo::placeholder { color:#c8c8c8; }

  /* ── スマホ（幅720pxまで）───────────────────────────────────────────── */
  @media (max-width: 720px) {
    .pc-only { display: none !important; }
    .xl-app { border-radius: 0; border-left: 0; border-right: 0; }
    .xl-pad { padding: 8px !important; }
    .xl-toolbar { padding: 8px; gap: 8px !important; }
    .xl-toolbar > div { flex: 1 1 44% !important; min-width: 0 !important; }
    .xl-toolbar .xl-field-wide { flex: 1 1 100% !important; }
    /* 16px未満だと iPhone で入力時に勝手に拡大される */
    .xl-toolbar select, .xl-toolbar input, .xl-input {
      width: 100% !important; min-width: 0 !important; font-size: 16px !important;
    }
    .xl-btn { padding: 10px 14px; font-size: 14px; }
    .xl-toolbar .xl-btn { flex: 0 0 auto; }
    .xl-msg, .xl-status, .xl-target { font-size: 12px; padding: 8px; }
    .sticky button { white-space: nowrap; padding: 8px 10px; }

    /* 問題はカードで縦に積む */
    .q-card { border-bottom: 8px solid #eee; background: #fff; padding: 10px 12px; }
    .q-card:last-child { border-bottom: 0; }
    .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .q-no { font-weight: 700; font-size: 15px; color: #1f2328; }
    .q-open {
      display: block; width: 100%; text-align: center; background: #eef4ff; border: 1px solid #b6cdf5;
      color: #1155cc; border-radius: 4px; padding: 12px; font-size: 15px; margin: 8px 0; text-decoration: none;
      font-family: inherit; cursor: pointer;
    }
    .q-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

    /* 出題中の1問1行（No・問題を開く・正解・写真をすべて横並び） */
    .q-line {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      border-bottom: 1px solid #e6e6e6; background: #fff; min-height: 56px; box-sizing: border-box;
    }
    .q-line .no {
      flex: 0 0 auto; min-width: 34px; text-align: right; font-size: 13px; color: #666;
      font-variant-numeric: tabular-nums;
    }
    .q-line .open {
      flex: 1 1 auto; min-width: 0; text-align: center; background: #eef4ff; border: 1px solid #b6cdf5;
      color: #1155cc; border-radius: 6px; padding: 11px 6px; font-size: 14px; font-family: inherit;
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none;
    }
    .q-line .open.none { background: #f4f4f4; border-color: #ddd; color: #999; cursor: default; }
    .q-line .shot { flex: 0 0 auto; }

    .q-row label { font-size: 13px; color: #555; }

    .q-photos .xl-thumb { height: 56px; }
    .xl-scroll { max-height: none; }

    /* カレンダーは日付を小さく、書き込みは下の欄で */
    .cal-table td { height: 44px; }
    .q-line { min-height: 52px; }
    .cal-table th { padding: 4px; text-align: center; }
    .cal-day { justify-content: center; padding: 2px; }
    .cal-memo { display: none; }
    .cal-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #217346; }

</style>

<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, createElement: h } = React;

// ── データ保存（文字データ: localStorage、画像: IndexedDB）─────────────────
const STORAGE_KEY = 'feExamData';
// 出題中の状態（選んだ単元・条件・抽選結果）。問題を解いて戻ってきても消えないように残す。
// 取り消し履歴には乗せたくないので、問題データ本体とは別に保存する。
const DRAW_KEY = 'feExamDraw';

function loadDraw() {
  try {
    const raw = localStorage.getItem(DRAW_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveDraw(state) {
  try { localStorage.setItem(DRAW_KEY, JSON.stringify(state)); } catch {}
}

// 今日の進み具合と目標。端末ごとの記録なので、取り消し履歴には乗せない
// （問題を開くたびに履歴が埋まると、単元整理のやり直しができなくなるため）。
const PROGRESS_KEY = 'feExamProgress';
const DEFAULT_GOAL = 20;
const KEEP_DAYS = 180;

function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
    return {
      goal: Number(raw.goal) > 0 ? Number(raw.goal) : DEFAULT_GOAL,
      daily: raw.daily && typeof raw.daily === 'object' ? raw.daily : {},
    };
  } catch { return { goal: DEFAULT_GOAL, daily: {} }; }
}

function saveProgress(p) {
  try {
    // 古い日は落として、際限なく溜まらないようにする
    const days = Object.keys(p.daily).sort().slice(-KEEP_DAYS);
    const daily = {};
    days.forEach(d => { daily[d] = p.daily[d]; });
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({ goal: p.goal, daily }));
  } catch {}
}

// その日に手をつけた問題を数える（同じ問題を何度触っても1つ）
function markDone(prev, qid) {
  const day = todayStr();
  const list = prev.daily[day] || [];
  if (list.includes(qid)) return prev;
  const next = { ...prev, daily: { ...prev.daily, [day]: [...list, qid] } };
  saveProgress(next);
  return next;
}

function doneToday(p) {
  return (p.daily[todayStr()] || []).length;
}

// 単元の進み具合＝正解が1回以上ついた問題の割合
function unitProgress(unit, records) {
  const total = unit ? unit.questions.length : 0;
  if (!total) return { done: 0, total: 0, rate: 0 };
  const done = unit.questions.filter(q => ((records[q.id] || {}).correct || 0) > 0).length;
  return { done, total, rate: done / total };
}
// 最初に開いたときの中身。送ってもらった単元マスタ（単元名・m・s・問題数）から
// URLを組み立てて入れてある。単元管理タブで削除・追加・貼り替えができる。
const SEED_UNITS = [
  ['離散数学', 1, 1, 109],
  ['応用数学', 1, 2, 51],
  ['情報に関する理論', 1, 3, 42],
  ['通信に関する理論', 1, 4, 13],
  ['計測・制御に関する理論', 1, 5, 11],
];
const SEED_THEME = { id: 'tseed', name: '基本情報技術者試験' };
function seedUnits() {
  return SEED_UNITS.map(([name, m, s, count], i) => ({
    id: `seed${i + 1}`,
    themeId: SEED_THEME.id,
    name,
    questions: Array.from({ length: count }, (_, n) => {
      const url = `https://www.fe-siken.com/bunya.php?m=${m}&s=${s}&no=${n + 1}`;
      return { id: url, url };
    }),
  }));
}
const DEFAULT_DATA = { themes: [SEED_THEME], units: seedUnits(), records: {}, photos: {}, calendar: {} };

function newThemeId() { return `t${Date.now().toString(36)}`; }

let questionSeq = 0;
function newQuestionId() {
  questionSeq += 1;
  return `q${Date.now().toString(36)}${questionSeq}`;
}

// 以前は「問題＝URL」だったので、保存済みデータを {id, url} の形に直す。
// 旧データの id は URL そのものにしておくと、記録も写真（IndexedDBのキー）もそのまま使える。
function migrate(data) {
  if (!data || !Array.isArray(data.units)) return data;
  const photos = {};
  Object.keys(data.photos || {}).forEach(qid => {
    const v = data.photos[qid];
    // 昔は1問1枚で、写真のキーが問題IDそのものだった
    if (Array.isArray(v)) photos[qid] = v;
    else if (v) photos[qid] = [qid];
  });
  let units = data.units.map(u => u.questions
    ? u
    : { id: u.id, name: u.name, questions: (u.urls || []).map(url => ({ id: url, url })) });

  // テーマ（試験）の層が無かった頃のデータを振り分ける。
  // 最初から入っていた5単元は「基本情報技術者試験」、自分で作った単元は「未分類」に置く。
  let themes = Array.isArray(data.themes) ? data.themes.slice() : [];
  if (!themes.length) {
    const isSeed = u => String(u.id).startsWith('seed');
    if (units.some(isSeed)) themes.push({ ...SEED_THEME });
    if (units.some(u => !isSeed(u))) themes.push({ id: 'tother', name: '未分類' });
    if (!themes.length) themes.push({ ...SEED_THEME });
    units = units.map(u => ({ ...u, themeId: isSeed(u) ? SEED_THEME.id : 'tother' }));
  }
  // 行き先を失った単元は先頭のテーマに置く
  const themeIds = new Set(themes.map(t => t.id));
  units = units.map(u => (u.themeId && themeIds.has(u.themeId)) ? u : { ...u, themeId: themes[0].id });

  return { ...data, photos, themes, units };
}
const COUNT_OPTIONS = Array.from({ length: 21 }, (_, i) => i);
const COUNT_MAX = COUNT_OPTIONS[COUNT_OPTIONS.length - 1];

function useLocalStorageState(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      // 保存データを先に今の形へ変換してから、足りないところだけ既定値で補う
      // （先に既定値を混ぜると、テーマなどが「既にある」と誤判定されて変換が働かない）
      return raw ? { ...initial, ...migrate(JSON.parse(raw)) } : initial;
    } catch {
      return initial;
    }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(state)); } catch {}
  }, [state]);
  return [state, setState];
}

// スマホ幅かどうか（表→カード、カレンダーの作りを切り替える）
function useIsPhone() {
  const query = '(max-width: 720px)';
  const [phone, setPhone] = useState(() => typeof matchMedia === 'function' && matchMedia(query).matches);
  useEffect(() => {
    if (typeof matchMedia !== 'function') return;
    const mq = matchMedia(query);
    const on = () => setPhone(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    return () => { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  }, []);
  return phone;
}

function dateStr(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function todayStr() {
  const d = new Date();
  return dateStr(d.getFullYear(), d.getMonth(), d.getDate());
}

function sample(arr, n) {
  const pool = arr.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, Math.min(n, pool.length));
}

// 貼り付けたテキストから1行1件でURLを取り出す（Excelから列コピーしたときの余分な文字は無視）
function parseUrls(text) {
  const seen = new Set();
  const urls = [];
  text.split(/\r?\n/).forEach(line => {
    // 1行に複数URLが並ぶ貼り付け方（Excelの横方向コピー）でも取りこぼさない
    (line.match(/https?:\/\/\S+/g) || []).forEach(found => {
      const url = found.trim();
      if (seen.has(url)) return;
      seen.add(url);
      urls.push(url);
    });
  });
  return urls;
}

// ── 写真保存（IndexedDB。1問に何枚でも持てる）───────────────────────────────
const PHOTO_DB = 'feExamPhotos';
const PHOTO_STORE = 'photos';
const THUMB_SUFFIX = '#thumb';

let photoSeq = 0;
function newPhotoId() {
  photoSeq += 1;
  return `p${Date.now().toString(36)}${photoSeq}`;
}
// photos は { 問題ID: [写真ID, ...] }。古い { 問題ID: true } も読めるようにしておく
function photoIdsOf(photos, qid) {
  const v = photos[qid];
  if (Array.isArray(v)) return v;
  return v ? [qid] : [];
}

// 接続は1本だけ使い回す。毎回開くと接続が残り続け、ブラウザ側から
// このデータベースを消せなくなる（消去やリセットが効かなくなる）
let photoDbPromise = null;
function openPhotoDB() {
  if (!photoDbPromise) {
    photoDbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(PHOTO_STORE);
      req.onsuccess = () => {
        const db = req.result;
        // 別のタブや消去操作から要求が来たら、こちらは閉じて道を空ける
        db.onversionchange = () => { db.close(); photoDbPromise = null; };
        db.onclose = () => { photoDbPromise = null; };
        resolve(db);
      };
      req.onerror = () => { photoDbPromise = null; reject(req.error); };
    });
  }
  return photoDbPromise;
}
function photoTx(mode, run) {
  return openPhotoDB().then(db => new Promise((resolve, reject) => {
    let tx;
    try {
      tx = db.transaction(PHOTO_STORE, mode);
    } catch (e) {
      // 接続が閉じられていたら開き直して、もう一度だけ試す
      photoDbPromise = null;
      return photoTx(mode, run).then(resolve, reject);
    }
    const req = run(tx.objectStore(PHOTO_STORE));
    tx.oncomplete = () => resolve(req ? req.result : undefined);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}
const loadPhoto = pid => photoTx('readonly', st => st.get(pid));
const loadThumb = pid => photoTx('readonly', st => st.get(pid + THUMB_SUFFIX));
const erasePhoto = pid =>
  photoTx('readwrite', st => { st.delete(pid); return st.delete(pid + THUMB_SUFFIX); }).catch(() => {});

// スクショはそのままだと重いので、長辺1600pxまで縮小してJPEGにしてから保存する
function compressImage(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const hh = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = hh;
        canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// 表示用の原寸（縮小済み）とセル内サムネイルの2つを保存して、問題の末尾に足す。
// 既にある写真と中身が同じだったら何枚目と同じかを返す（クリップボードが古いままのときに気付けるように）
async function attachPhoto(qid, file, setData, existingIds) {
  const full = await compressImage(file, 1600, 0.85);
  let sameAs = 0;
  for (let i = 0; i < (existingIds || []).length; i++) {
    if ((await loadPhoto(existingIds[i])) === full) { sameAs = i + 1; break; }
  }
  const thumb = await compressImage(file, 160, 0.7);
  const pid = newPhotoId();
  await photoTx('readwrite', st => { st.put(full, pid); return st.put(thumb, pid + THUMB_SUFFIX); });
  setData(d => ({ ...d, photos: { ...d.photos, [qid]: [...photoIdsOf(d.photos, qid), pid] } }));
  return { pid, sameAs };
}

function fileLabel(file) {
  const kb = Math.round((file.size || 0) / 1024);
  return `${file.name || '画像'}／${kb}KB`;
}

// 画像の実体はここでは消さない（Ctrl+Zで戻せるように）。参照が完全に無くなったら gcPhotos が掃除する
function detachPhoto(qid, pid, setData) {
  setData(d => {
    const rest = photoIdsOf(d.photos, qid).filter(x => x !== pid);
    const photos = { ...d.photos };
    if (rest.length) photos[qid] = rest;
    else delete photos[qid];
    return { ...d, photos };
  });
  return Promise.resolve();
}

// どこからも参照されなくなった画像を IndexedDB から消す。
// 現在のデータと、元に戻せる履歴のどちらにも無いものだけが対象。
async function gcPhotos(photoMaps) {
  const keep = new Set();
  photoMaps.forEach(photos => {
    Object.keys(photos || {}).forEach(qid => photoIdsOf(photos, qid).forEach(pid => keep.add(pid)));
  });
  const keys = await photoTx('readonly', st => st.getAllKeys());
  const dead = (keys || []).filter(k => !keep.has(String(k).replace(/#thumb$/, '')));
  // 参照が1件も拾えていないのに全部消す、という掃除は必ず何かの間違いなので実行しない
  if (!dead.length || (keep.size === 0 && keys.length > 0)) return 0;
  await photoTx('readwrite', st => { dead.forEach(k => st.delete(k)); return null; });
  return dead.length;
}

// 写真を複製する（問題のコピー用）
async function copyPhotos(fromIds) {
  const newIds = [];
  for (const pid of fromIds) {
    const full = await loadPhoto(pid);
    const thumb = await loadThumb(pid);
    if (!full) continue;
    const nid = newPhotoId();
    await photoTx('readwrite', st => { st.put(full, nid); return st.put(thumb || full, nid + THUMB_SUFFIX); });
    newIds.push(nid);
  }
  return newIds;
}

// 画像を読み込んで <img> にする（トリミングで元の画素数を使うため）
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('画像を読み込めませんでした'));
    img.src = src;
  });
}

// canvas を長辺 maxDim まで縮めて JPEG のデータURLにする
function canvasToDataURL(source, maxDim, quality) {
  const scale = Math.min(1, maxDim / Math.max(source.width, source.height));
  const w = Math.max(1, Math.round(source.width * scale));
  const hh = Math.max(1, Math.round(source.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = hh;
  canvas.getContext('2d').drawImage(source, 0, 0, w, hh);
  return canvas.toDataURL('image/jpeg', quality);
}

// 指定した範囲（表示中の画像に対する0〜1の割合）だけを切り出し、別の写真として保存する。
// 元の画像はそのまま残すので、付け替えを Ctrl+Z で戻せば元の写真に戻る。
async function cropPhoto(pid, frac) {
  const full = await loadPhoto(pid);
  if (!full) throw new Error('写真が見つかりませんでした');
  const img = await loadImageEl(full);
  const sx = Math.round(frac.x * img.naturalWidth);
  const sy = Math.round(frac.y * img.naturalHeight);
  const sw = Math.max(1, Math.round(frac.w * img.naturalWidth));
  const sh = Math.max(1, Math.round(frac.h * img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = sw;
  canvas.height = sh;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const nid = newPhotoId();
  const out = canvasToDataURL(canvas, 1600, 0.85);
  const thumb = canvasToDataURL(canvas, 160, 0.7);
  await photoTx('readwrite', st => { st.put(out, nid); return st.put(thumb, nid + THUMB_SUFFIX); });
  return nid;
}

// まとめて貼られた写真を、写真がまだ無い問題に上から順に割り当てる
async function assignPhotos(questionIds, photos, files, setData) {
  const targets = [];
  questionIds.forEach((id, i) => {
    if (photoIdsOf(photos, id).length === 0) targets.push({ id, no: i + 1 });
  });
  if (!targets.length) return '割り当て先がありません（すべての問題に写真があります）。行の「＋」を押してから貼ると、その問題に追加できます。';
  const done = [];
  let failed = 0;
  for (let i = 0; i < Math.min(files.length, targets.length); i++) {
    try {
      await attachPhoto(targets[i].id, files[i], setData, []);
      done.push(targets[i].no);
    } catch (e) {
      failed++;
    }
  }
  const leftover = files.length - done.length - failed;
  return (done.length ? `問題 ${done.join('・')} に写真を入れました（${done.length}枚）` : '写真を入れられませんでした')
    + (leftover > 0 ? `／${leftover}枚は入れる先がなく未使用` : '')
    + (failed > 0 ? `／${failed}枚は保存に失敗` : '');
}

function setCountFor(qid, field, value, setData) {
  setData(d => {
    const prev = d.records[qid] || { correct: 0, wrong: 0 };
    return { ...d, records: { ...d.records, [qid]: { ...prev, [field]: value } } };
  });
}

// 複数枚まとめて貼ったときは、ファイル名の数字順（＝撮った順）で上から割り当てる
function imageFilesFrom(source, dedupe) {
  let out = [];
  if (source && source.items && source.items.length) {
    for (const item of source.items) {
      if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
        const f = item.getAsFile();
        if (f) out.push(f);
      }
    }
  } else if (source && source.files) {
    for (const f of source.files) {
      if (f.type && f.type.startsWith('image/')) out.push(f);
    }
  }
  // 1回のコピーでも、同じ絵がPNGとJPEGの両方でクリップボードに入ることがある。
  // そのまま扱うと1枚のつもりが2枚として別々の問題に入ってしまうので、拡張子違いは1枚にまとめる。
  if (dedupe) {
    const seen = new Set();
    out = out.filter(f => {
      const base = String(f.name || '').replace(/\.[^.]*$/, '').toLowerCase();
      if (seen.has(base)) return false;
      seen.add(base);
      return true;
    });
  }
  return out.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
}

// ── 写真の受け取り（貼り付け・ドロップ・ファイル選択）─────────────────────────
function PhotoDropZone({ label, multiple, onImages }) {
  const [hot, setHot] = useState(false);

  return h('div', {
    onDragOver: e => { e.preventDefault(); setHot(true); },
    onDragLeave: () => setHot(false),
    onDrop: e => {
      e.preventDefault();
      setHot(false);
      const files = imageFilesFrom(e.dataTransfer, true);
      if (files.length) onImages(files);
    },
    className: `xl-drop ${hot ? 'hot' : ''}`
  },
    h('p', { style: { marginBottom: '8px' } }, label),
    h('label', { className: 'xl-btn xl-btn-sub', style: { cursor: 'pointer' } },
      multiple ? '写真を選ぶ（複数可）' : '写真を選ぶ',
      h('input', {
        type: 'file', accept: 'image/*', multiple: !!multiple, style: { display: 'none' },
        onChange: e => {
          const files = imageFilesFrom(e.target);
          if (files.length) onImages(files);
          e.target.value = '';
        }
      })
    )
  );
}

// 画面のどこで Ctrl+V しても拾う（入力欄にフォーカスがあるときは邪魔しない）
function useWindowPaste(active, handler) {
  const cb = useRef(handler);
  cb.current = handler;
  useEffect(() => {
    if (!active) return;
    function onPaste(e) {
      const tag = e.target && e.target.tagName;
      const inField = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
      // 入力欄に文字を貼るのは邪魔しない。ただし画像は、どこにカーソルがあっても受け取る
      if (inField && !imageFilesFrom(e.clipboardData).length) return;
      if (cb.current(e.clipboardData)) e.preventDefault();
    }
    window.addEventListener('paste', onPaste);
    return () => window.removeEventListener('paste', onPaste);
  }, [active]);
}

// ── 問題ページをアプリの中で開く ─────────────────────────────────────────────
// 相手のサイトが「他所への埋め込み」を断っていると中身が出ないことがあるので、
// そのときのために必ず「新しいタブで開く」も添えておく。
// 表示の大きさ。端末ごとに覚えておく（毎回合わせ直さなくて済むように）
const ZOOM_KEY = 'feExamZoom';
const ZOOM_MIN = 0.4;
const ZOOM_MAX = 1.5;

function loadZoom() {
  const v = Number(localStorage.getItem(ZOOM_KEY));
  return v >= ZOOM_MIN && v <= ZOOM_MAX ? v : 1;
}

function LinkViewer({ url, no, record, onSetCount, onClose }) {
  const [loaded, setLoaded] = useState(false);
  const [slow, setSlow] = useState(false);
  const [zoom, setZoom] = useState(() => { try { return loadZoom(); } catch { return 1; } });
  // 枠の実寸。縮小したぶん中のページを広く描き、全体を縮めて収める。
  const boxRef = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });

  useEffect(() => {
    function measure() {
      const el = boxRef.current;
      if (!el) return;
      const b = el.getBoundingClientRect();
      setSize(prev => (Math.abs(prev.w - b.width) < 0.5 && Math.abs(prev.h - b.height) < 0.5)
        ? prev : { w: b.width, h: b.height });
    }
    measure();
    window.addEventListener('resize', measure);
    window.addEventListener('orientationchange', measure);
    return () => {
      window.removeEventListener('resize', measure);
      window.removeEventListener('orientationchange', measure);
    };
  }, []);

  function changeZoom(next) {
    const v = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(next * 10) / 10));
    setZoom(v);
    try { localStorage.setItem(ZOOM_KEY, String(v)); } catch {}
  }

  useEffect(() => {
    setLoaded(false);
    setSlow(false);
    const id = setTimeout(() => setSlow(true), 5000);
    return () => clearTimeout(id);
  }, [url]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return h('div', {
    style: { zIndex: 55, display: 'flex', flexDirection: 'column' },
    className: 'fixed inset-0 bg-gray-950',
  },
    h('div', {
      style: { flex: '0 0 auto', display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', padding: '8px 10px' },
      className: 'bg-gray-900 border-b border-gray-700',
    },
      h('span', { className: 'text-xs text-gray-300', style: { fontWeight: 600 } }, `問題 ${no}`),
      onSetCount && h('span', { className: 'text-xs text-gray-400' }, '正解'),
      onSetCount && h('select', {
        title: '正解回数', value: record.correct,
        onChange: e => onSetCount('correct', Number(e.target.value)),
        className: 'text-sm rounded bg-gray-800 border border-gray-600 text-white px-2 py-1',
      }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
      h('span', { style: { marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '4px' } },
        h('button', {
          onClick: () => changeZoom(zoom - 0.1), disabled: zoom <= ZOOM_MIN, title: '表示を小さくする',
          className: 'text-sm px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-600 text-gray-100',
        }, '−'),
        h('button', {
          onClick: () => changeZoom(1), title: '表示の大きさを元に戻す',
          className: 'text-xs px-2 py-1.5 rounded-lg bg-gray-800 border border-gray-600 text-gray-300',
          style: { minWidth: '52px' },
        }, `${Math.round(zoom * 100)}%`),
        h('button', {
          onClick: () => changeZoom(zoom + 0.1), disabled: zoom >= ZOOM_MAX, title: '表示を大きくする',
          className: 'text-sm px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-600 text-gray-100',
        }, '＋')
      ),
      h('a', {
        href: url, target: '_blank', rel: 'noopener noreferrer',
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-600 text-gray-100',
      }, '新しいタブで開く ↗'),
      h('button', {
        onClick: onClose, title: '閉じる（Esc）',
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-600 text-gray-100',
      }, '閉じる ×')
    ),

    h('div', {
      ref: boxRef,
      // iOSでは枠を指定しても中身の大きさまで広がってしまうので、外側でスクロールさせる
      style: {
        flex: '1 1 auto', position: 'relative', background: '#fff',
        overflow: 'auto', WebkitOverflowScrolling: 'touch',
      },
    },
      size.w > 0 && h('iframe', {
        src: url, title: `問題 ${no}`, onLoad: () => setLoaded(true), scrolling: 'yes',
        style: {
          border: 0, display: 'block',
          width: `${size.w / zoom}px`, height: `${size.h / zoom}px`,
          transform: `scale(${zoom})`, transformOrigin: 'top left',
        },
      }),
      !loaded && slow && h('div', {
        className: 'text-sm text-gray-700',
        style: {
          position: 'absolute', left: 0, right: 0, top: '40%', textAlign: 'center', padding: '0 16px',
        },
      }, 'このページはアプリの中では表示できないようです。上の「新しいタブで開く」を使ってください。')
    )
  );
}

// ── 写真のトリミング（拡大表示の中で使う）─────────────────────────────────────
// 選択範囲は「表示中の画像に対する割合」で持つ。画面の大きさが変わっても同じ場所を指す。
const MIN_CROP = 0.03;   // これより細い選択は切り取らせない
const CROP_HANDLES = [['nw', 0, 0], ['ne', 1, 0], ['sw', 0, 1], ['se', 1, 1]];

function CropOverlay({ src, busy, onCancel, onApply }) {
  const imgRef = useRef(null);
  const wrapRef = useRef(null);
  const [rect, setRect] = useState(null);
  // 画面の大きさ。これを基に写真の表示上限を決める（100vh はスマホで実際の高さとずれる）
  const [view, setView] = useState(() => ({ w: window.innerWidth, h: window.innerHeight }));
  // 実際に表示されている写真の位置と大きさ。選択の枠はこれに合わせて描く。
  const [box, setBox] = useState(null);
  const drag = useRef(null);

  // 枠の位置と、切り取る位置がずれないように、写真の実寸をその都度測る
  function measure() {
    const img = imgRef.current;
    const wrap = wrapRef.current;
    if (!img || !wrap || !img.naturalWidth) return;
    const a = img.getBoundingClientRect();
    const b = wrap.getBoundingClientRect();
    const next = { left: a.left - b.left, top: a.top - b.top, w: a.width, h: a.height };
    setBox(prev => (prev
      && Math.abs(prev.left - next.left) < 0.5 && Math.abs(prev.top - next.top) < 0.5
      && Math.abs(prev.w - next.w) < 0.5 && Math.abs(prev.h - next.h) < 0.5) ? prev : next);
  }

  useEffect(() => {
    measure();
    const onResize = () => setView({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, [src]);

  useEffect(() => { measure(); }, [view.w, view.h, src]);

  function point(e) {
    const b = imgRef.current.getBoundingClientRect();
    const clamp = v => Math.min(1, Math.max(0, v));
    return { x: clamp((e.clientX - b.left) / b.width), y: clamp((e.clientY - b.top) / b.height) };
  }

  const norm = (x1, y1, x2, y2) =>
    ({ x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) });

  function start(e, mode) {
    if (busy) return;
    e.preventDefault();
    e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    const p = point(e);
    drag.current = { mode, origin: p, base: rect };
    if (mode === 'new') setRect({ x: p.x, y: p.y, w: 0, h: 0 });
  }

  function move(e) {
    const d = drag.current;
    if (!d) return;
    e.preventDefault();
    e.stopPropagation();
    const p = point(e);
    if (d.mode === 'new') {
      setRect(norm(d.origin.x, d.origin.y, p.x, p.y));
    } else if (d.mode === 'move' && d.base) {
      const x = Math.min(1 - d.base.w, Math.max(0, d.base.x + (p.x - d.origin.x)));
      const y = Math.min(1 - d.base.h, Math.max(0, d.base.y + (p.y - d.origin.y)));
      setRect({ ...d.base, x, y });
    } else if (d.base) {
      // つまんだ角の反対側を固定して、指の位置まで広げる（裏返しても破綻しない）
      const fx = d.mode === 'nw' || d.mode === 'sw' ? d.base.x + d.base.w : d.base.x;
      const fy = d.mode === 'nw' || d.mode === 'ne' ? d.base.y + d.base.h : d.base.y;
      setRect(norm(fx, fy, p.x, p.y));
    }
  }

  function end(e) {
    if (!drag.current) return;
    e.stopPropagation();
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
    drag.current = null;
  }

  const ready = !!rect && rect.w >= MIN_CROP && rect.h >= MIN_CROP;
  const pct = v => `${v * 100}%`;
  const dragProps = mode => ({
    onPointerDown: e => start(e, mode), onPointerMove: move, onPointerUp: end, onPointerCancel: end,
  });
  // 下の操作バーで隠れないように、写真の高さに余白を残す
  const BAR_ROOM = 96;

  return h(React.Fragment, null,
    h('div', {
      ref: wrapRef,
      onClick: e => e.stopPropagation(),
      style: { position: 'relative', lineHeight: 0, marginBottom: `${BAR_ROOM - 32}px` },
    },
      h('img', {
        ref: imgRef, src, draggable: false, onLoad: measure,
        style: {
          display: 'block', userSelect: 'none',
          maxWidth: `${Math.max(80, view.w - 32)}px`,
          maxHeight: `${Math.max(80, view.h - BAR_ROOM - 32)}px`,
        },
      }),
      box && h('div', {
        ...dragProps('new'),
        style: {
          position: 'absolute', left: `${box.left}px`, top: `${box.top}px`,
          width: `${box.w}px`, height: `${box.h}px`,
          overflow: 'hidden', cursor: 'crosshair', touchAction: 'none',
        },
      },
        rect && rect.w > 0 && rect.h > 0 && h('div', {
          ...dragProps('move'),
          style: {
            position: 'absolute', left: pct(rect.x), top: pct(rect.y), width: pct(rect.w), height: pct(rect.h),
            border: '2px solid #fff', boxShadow: '0 0 0 9999px rgba(0,0,0,.6)',
            cursor: 'move', touchAction: 'none',
          },
        },
          CROP_HANDLES.map(([m, hx, hy]) => h('div', {
            key: m, ...dragProps(m),
            style: {
              position: 'absolute', left: hx ? '100%' : 0, top: hy ? '100%' : 0,
              transform: 'translate(-50%, -50%)', width: '22px', height: '22px', borderRadius: '4px',
              background: '#fff', border: '1px solid #111', touchAction: 'none', cursor: `${m}-resize`,
            },
          }))
        )
      )
    ),

    h('div', {
      onClick: e => e.stopPropagation(),
      style: {
        position: 'absolute', bottom: '16px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap',
        justifyContent: 'center', maxWidth: 'calc(100% - 32px)',
        background: 'rgba(17,24,39,.9)', border: '1px solid #374151', borderRadius: '8px', padding: '8px 12px',
      },
    },
      h('span', { className: 'text-xs text-gray-300' },
        busy ? '切り取っています…'
          : ready ? '四隅をつまむと調整できます。中をドラッグすると位置を動かせます'
          : '残したい部分をドラッグで囲んでください'),
      h('button', {
        onClick: () => ready && !busy && onApply(rect), disabled: !ready || !!busy,
        className: `text-xs px-3 py-1.5 rounded-lg border ${ready && !busy
          ? 'bg-green-800 border-green-600 text-green-100'
          : 'bg-gray-900/80 border-gray-700 text-gray-500 cursor-not-allowed'}`,
      }, '✂️ 切り取る'),
      h('button', {
        onClick: onCancel, disabled: !!busy,
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-gray-600 text-gray-200',
      }, 'やめる')
    )
  );
}

// ── 写真モーダル（画面中央に表示。複数枚は送り送りで見る）─────────────────────
function PhotoModal({ ids, index, onIndex, onClose, onDelete, moveTargets, currentNo, currentText, onMove, onCrop }) {
  const [src, setSrc] = useState(null);
  const [cropping, setCropping] = useState(false);
  const [cropBusy, setCropBusy] = useState(false);
  const pid = ids[index];
  // 移動先は「ひとつ前の問題」を初期値にする（問題の次に解答が来る問題集で使いやすい）
  const defaultTarget = (moveTargets && moveTargets.length)
    ? (moveTargets.filter(t => t.no < currentNo).pop() || moveTargets[0]).id
    : '';
  const [moveTo, setMoveTo] = useState(defaultTarget);
  useEffect(() => { setMoveTo(defaultTarget); }, [defaultTarget]);

  useEffect(() => {
    let alive = true;
    setSrc(null);
    if (!pid) { setSrc(''); return; }
    setCropping(false);
    setCropBusy(false);
    loadPhoto(pid).then(v => { if (alive) setSrc(v || ''); }).catch(() => { if (alive) setSrc(''); });
    return () => { alive = false; };
  }, [pid]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape') { if (cropping) setCropping(false); else onClose(); }
      if (cropping) return;
      if (e.key === 'ArrowLeft' && index > 0) onIndex(index - 1);
      if (e.key === 'ArrowRight' && index < ids.length - 1) onIndex(index + 1);
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose, onIndex, index, ids.length, cropping]);

  function applyCrop(frac) {
    setCropBusy(true);
    Promise.resolve(onCrop(pid, frac))
      .then(() => { setCropping(false); })
      .catch(() => {})
      .then(() => setCropBusy(false));
  }

  const navBtn = {
    width: '44px', height: '44px', borderRadius: '50%', fontSize: '20px', lineHeight: 1,
    background: 'rgba(17,24,39,.8)', border: '1px solid #374151', color: '#fff', cursor: 'pointer',
  };

  return h('div', {
    onClick: onClose,
    // ポモドーロタイマー（z-50）より前面に出す
    style: { zIndex: 60 },
    className: 'fixed inset-0 bg-black/85 flex items-center justify-center p-4'
  },
    ids.length > 1 && !cropping && h('button', {
      onClick: e => { e.stopPropagation(); onIndex(index - 1); },
      disabled: index === 0,
      style: { ...navBtn, position: 'absolute', left: '16px', opacity: index === 0 ? 0.3 : 1 },
    }, '‹'),

    src === null
      ? h('p', { className: 'text-sm text-gray-400' }, '読み込み中…')
      : src && cropping
        ? h(CropOverlay, { src, busy: cropBusy, onCancel: () => setCropping(false), onApply: applyCrop })
      : src
        ? h('img', {
            src,
            onClick: e => e.stopPropagation(),
            className: 'rounded-lg shadow-2xl',
            style: { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' },
          })
        : h('p', { className: 'text-sm text-gray-400' }, '写真がありません'),

    ids.length > 1 && !cropping && h('button', {
      onClick: e => { e.stopPropagation(); onIndex(index + 1); },
      disabled: index >= ids.length - 1,
      style: { ...navBtn, position: 'absolute', right: '16px', opacity: index >= ids.length - 1 ? 0.3 : 1 },
    }, '›'),

    !cropping && h('div', {
      onClick: e => e.stopPropagation(),
      style: {
        position: 'absolute', bottom: '16px', display: 'flex', alignItems: 'center', gap: '10px', flexWrap: 'wrap',
        justifyContent: 'center', maxWidth: 'calc(100% - 32px)',
        background: 'rgba(17,24,39,.85)', border: '1px solid #374151', borderRadius: '8px', padding: '8px 12px',
      },
    },
      h('span', { className: 'text-xs text-gray-300', style: { maxWidth: '420px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
        `問題 ${currentNo}` + (ids.length > 1 ? ` の ${index + 1} / ${ids.length} 枚目` : ' の写真')
        + (currentText ? `　${currentText}` : '')),
      onMove && moveTargets && moveTargets.length > 0 && h('span', { className: 'text-xs text-gray-400' }, '｜ 別の問題へ移す:'),
      onMove && moveTargets && moveTargets.length > 0 && h('select', {
        value: moveTo, onChange: e => setMoveTo(e.target.value),
        className: 'text-xs rounded bg-gray-800 border border-gray-600 text-white px-2 py-1',
      }, moveTargets.map(t => h('option', { key: t.id, value: t.id },
        `問題 ${t.no}` + (t.text ? `　${t.text.length > 60 ? t.text.slice(0, 60) + '…' : t.text}` : '　（URLなし）')))),
      onMove && moveTargets && moveTargets.length > 0 && h('button', {
        onClick: () => onMove(pid, moveTo),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-green-800 border border-green-600 text-green-100',
      }, '移す'),
      onCrop && src && h('button', {
        onClick: () => setCropping(true),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-gray-600 text-gray-100',
        title: '要る部分だけを切り出す（Ctrl+Z で戻せます）',
      }, '✂️ トリミング'),
      onDelete && h('button', {
        onClick: () => onDelete(pid),
        className: 'text-xs px-3 py-1.5 rounded-lg bg-gray-900/80 border border-red-800 text-red-300',
      }, 'この写真を削除')
    ),

    h('button', {
      onClick: onClose,
      className: 'absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-900/80 border border-gray-700 text-white text-xl leading-none'
    }, '×')
  );
}

// ── 正解ボタン（押すと1回ぶん増えて、その場で弾ける）──────────────────────────
// 押し間違いは長押しで1つ戻せる（プルダウンを置くと横幅が足りないため）
function CorrectButton({ count, onAdd, onUndo }) {
  const [pop, setPop] = useState(0);
  const held = useRef(false);
  const timer = useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);

  function burst(el) {
    if (!el || typeof document === 'undefined') return;
    const b = el.getBoundingClientRect();
    ['✨', '⭐', '✨'].forEach((mark, i) => {
      const sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = mark;
      sp.style.left = `${b.left + b.width / 2 - 10}px`;
      sp.style.top = `${b.top + b.height / 2 - 10}px`;
      sp.style.setProperty('--dx', `${(i - 1) * 34}px`);
      sp.style.setProperty('--dy', `${-30 - i * 8}px`);
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 800);
    });
  }

  function press(e) {
    held.current = false;
    timer.current = setTimeout(() => { held.current = true; if (onUndo) onUndo(); }, 650);
  }

  function release(e) {
    clearTimeout(timer.current);
    if (held.current) return;      // 長押しで1つ戻したときは足さない
    setPop(n => n + 1);
    burst(e.currentTarget);
    onAdd();
  }

  return h('button', {
    className: 'ok-btn' + (pop ? ' pop' : ''),
    key: `ok${pop}`,
    title: '正解（長押しで1つ戻す）',
    onPointerDown: press,
    onPointerUp: release,
    onPointerLeave: () => clearTimeout(timer.current),
    onPointerCancel: () => clearTimeout(timer.current),
  }, h('span', null, '✓'), h('span', { className: 'n' }, count));
}

// ── 単元のメーターと、今日の目標の球 ─────────────────────────────────────────
function GaugeBar({ unit, records, progress, onSetGoal }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(progress.goal));
  const { done, total, rate } = unitProgress(unit, records);
  const today = doneToday(progress);
  const filled = progress.goal > 0 ? Math.min(1, today / progress.goal) : 0;

  function commit() {
    const n = Math.max(1, Math.min(999, Number(draft) || 1));
    onSetGoal(n);
    setDraft(String(n));
    setEditing(false);
  }

  return h('div', { className: 'gauge' },
    h('div', { className: 'meter' },
      h('div', { className: 'cap' },
        h('span', null, unit ? `${unit.name} の進み具合` : '単元の進み具合'),
        h('span', null, `${done} / ${total} 問（${Math.round(rate * 100)}%）`)
      ),
      h('div', { className: 'bar', title: '正解が1回以上ついた問題の割合' },
        h('i', { style: { width: `${Math.round(rate * 100)}%` } })),
      editing && h('div', { style: { marginTop: '6px', display: 'flex', alignItems: 'center', gap: '6px' } },
        h('span', { style: { fontSize: '12px', color: '#555' } }, '1日の目標'),
        h('input', {
          type: 'number', min: 1, max: 999, value: draft, title: '1日の目標',
          style: { width: '80px', fontSize: '16px' },
          onChange: e => setDraft(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter') commit(); },
        }),
        h('span', { style: { fontSize: '12px', color: '#555' } }, '問'),
        h('button', { className: 'xl-btn', onClick: commit }, '決定')
      )
    ),
    h('div', {
      className: 'ball' + (filled >= 1 ? ' full' : ''),
      title: `今日 ${today} / ${progress.goal} 問（押すと目標を変えられます）`,
      onClick: () => setEditing(v => !v),
    },
      h('i', { style: { height: `${Math.round(filled * 100)}%` } }),
      h('span', { className: 'lab' }, filled >= 1 ? '達成!' : `${today}/${progress.goal}`)
    )
  );
}

// ── 写真セル（セル内にサムネイル。複数枚並ぶ）─────────────────────────────────
function PhotoThumb({ pid, onOpen }) {
  const [thumb, setThumb] = useState('');
  useEffect(() => {
    let alive = true;
    loadThumb(pid).then(v => { if (alive) setThumb(v || ''); }).catch(() => {});
    return () => { alive = false; };
  }, [pid]);
  return thumb
    ? h('img', { src: thumb, className: 'xl-thumb', onClick: onOpen, title: 'クリックで拡大' })
    : h('button', { className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px' }, onClick: onOpen }, '📷');
}

function PhotoCell({ pids, isTarget, onOpen, onPick }) {
  const shown = pids.slice(0, 4);
  return h('div', { className: 'xl-cell', style: { display: 'flex', alignItems: 'center', gap: '4px' } },
    shown.map((pid, i) => h(PhotoThumb, { key: pid, pid, onOpen: () => onOpen(i) })),
    pids.length > shown.length && h('span', { style: { fontSize: '11px', color: '#666' } }, `+${pids.length - shown.length}`),
    h('button', {
      className: 'xl-btn xl-btn-sub',
      style: {
        padding: '2px 8px', fontSize: '12px',
        ...(isTarget ? { borderColor: '#217346', background: '#eef8f1' } : {}),
      },
      onClick: onPick,
      title: pids.length ? '写真を追加する' : '写真を入れる',
    }, isTarget ? '貼付待ち…' : (pids.length ? '＋' : '＋ 写真'))
  );
}

// ── 問題の表（Excelのシート相当）──────────────────────────────────────────────
function QuestionSheet({
  questions, nos, data, onSetUrl, onSetCount, onOpenPhoto, onPickPhoto,
  pasteTarget, onDeleteRow, onDuplicate, onReorder, scrollSignal, emptyText, onOpenLink,
  compact, onCorrect,
}) {
  const isPhone = useIsPhone();
  const scroller = useRef(null);
  // 行番号のセルをつまんだときだけ行を掴めるようにする（URL欄の文字選択を邪魔しないため）
  const [grabId, setGrabId] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [after, setAfter] = useState(false);

  function endDrag() { setGrabId(null); setDragId(null); setOverId(null); }

  // 問題を追加したときは、追加した行が見えるところまで送る
  useEffect(() => {
    if (scrollSignal && scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight;
  }, [scrollSignal]);

  if (!questions.length) {
    return h('div', { className: 'xl-empty' }, emptyText || 'まだ問題がありません。');
  }

  // スマホで問題を解いているときは、1問1行にして5問ぶん画面に収める
  if (isPhone && compact) {
    return h('div', { className: 'xl-scroll', ref: scroller },
      questions.map((q, i) => {
        const r = data.records[q.id] || { correct: 0, wrong: 0 };
        const no = nos ? nos[i] : i + 1;
        const pids = photoIdsOf(data.photos, q.id);
        return h('div', { className: 'q-line', key: q.id },
          h('span', { className: 'no' }, no),
          q.url
            ? h('button', { className: 'open', onClick: () => onOpenLink && onOpenLink(q.id) }, '問題を開く →')
            : h('span', { className: 'open none' }, pids.length ? '写真を見る' : 'URLなし'),
          h(CorrectButton, {
            count: r.correct,
            onAdd: () => onCorrect(q.id),
            onUndo: () => onSetCount(q.id, 'correct', Math.max(0, r.correct - 1)),
          }),
          h('span', { className: 'shot' },
            pids.length
              ? h(PhotoThumb, { pid: pids[0], onOpen: () => onOpenPhoto(q.id, 0) })
              : h('button', {
                  className: 'xl-btn xl-btn-sub', style: { padding: '8px 10px' },
                  onClick: () => onPickPhoto(q.id),
                }, '📷')),
          pids.length > 1 && h('span', { style: { fontSize: '11px', color: '#888' } }, `+${pids.length - 1}`)
        );
      })
    );
  }

  // スマホでは表が入りきらないので、1問1枚のカードにする
  if (isPhone) {
    return h('div', { className: 'xl-scroll', ref: scroller },
      questions.map((q, i) => {
        const r = data.records[q.id] || { correct: 0, wrong: 0 };
        const no = nos ? nos[i] : i + 1;
        return h('div', { className: 'q-card', key: q.id },
          h('div', { className: 'q-head' },
            h('span', { className: 'q-no' }, `No.${no}`),
            onReorder && h('div', { style: { marginLeft: 'auto', display: 'flex', gap: '6px' } },
              h('button', {
                className: 'xl-btn xl-btn-sub', disabled: i === 0,
                onClick: () => onReorder(q.id, questions[i - 1].id, false), title: '上へ',
              }, '↑'),
              h('button', {
                className: 'xl-btn xl-btn-sub', disabled: i === questions.length - 1,
                onClick: () => onReorder(q.id, questions[i + 1].id, true), title: '下へ',
              }, '↓')
            ),
            onDuplicate && h('button', {
              className: 'xl-btn xl-btn-sub', style: onReorder ? {} : { marginLeft: 'auto' },
              onClick: () => onDuplicate(q.id),
            }, '複製'),
            onDeleteRow && h('button', {
              className: 'xl-btn xl-btn-sub', style: { color: '#a11' },
              onClick: () => onDeleteRow(q.id),
            }, '×')
          ),

          onSetUrl
            ? h('input', {
                type: 'text', className: 'xl-input', value: q.url || '',
                placeholder: 'URLを貼り付け（写真だけでも可）',
                style: { width: '100%', fontSize: '16px' },
                onChange: e => onSetUrl(q.id, e.target.value),
              })
            : null,
          q.url
            ? (onOpenLink
                ? h('button', { className: 'q-open', onClick: () => onOpenLink(q.id) }, '問題を開く →')
                : h('a', { className: 'q-open', href: q.url, target: '_blank', rel: 'noopener noreferrer' }, '問題を開く →'))
            : (onSetUrl ? null : h('div', { style: { color: '#999', fontSize: '13px', margin: '6px 0' } }, '（URLなし）')),

          h('div', { className: 'q-row' },
            h('label', null, '正解'),
            h('select', {
              value: r.correct, onChange: e => onSetCount(q.id, 'correct', Number(e.target.value)),
            }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
            onCorrect && h(CorrectButton, {
              count: r.correct,
              onAdd: () => onCorrect(q.id),
              onUndo: () => onSetCount(q.id, 'correct', Math.max(0, r.correct - 1)),
            })
          ),

          h('div', { className: 'q-photos' },
            photoIdsOf(data.photos, q.id).map((pid, pi) =>
              h(PhotoThumb, { key: pid, pid, onOpen: () => onOpenPhoto(q.id, pi) })),
            h('button', {
              className: 'xl-btn xl-btn-sub',
              style: pasteTarget === q.id ? { borderColor: '#217346', background: '#eef8f1' } : {},
              onClick: () => onPickPhoto(q.id),
            }, pasteTarget === q.id ? '貼付待ち…' : '＋ 写真')
          )
        );
      })
    );
  }

  return h('div', { className: 'xl-scroll', ref: scroller },
    h('table', { className: 'xl-table' },
      h('thead', null,
        h('tr', null,
          h('th', { className: 'xl-rownum', style: { top: 0 } }, 'No'),
          h('th', { className: 'xl-col-url' }, '問題URL'),
          h('th', null, '正解回数'),
          h('th', { className: 'xl-col-photo' }, '写真'),
          (onDeleteRow || onDuplicate) && h('th', null, '')
        )
      ),
      h('tbody', null,
        questions.map((q, i) => {
          const r = data.records[q.id] || { correct: 0, wrong: 0 };
          const rowNo = nos ? nos[i] : i + 1;
          const dragging = dragId === q.id;
          const over = onReorder && overId === q.id && dragId && dragId !== q.id;
          return h('tr', {
            key: q.id,
            draggable: !!onReorder && (grabId === q.id || dragging),
            className: [dragging ? 'xl-dragging' : '', over ? (after ? 'xl-drop-after' : 'xl-drop-before') : ''].filter(Boolean).join(' '),
            onDragStart: onReorder ? e => {
              setDragId(q.id);
              e.dataTransfer.effectAllowed = 'move';
              try { e.dataTransfer.setData('text/plain', q.id); } catch (err) {}
            } : undefined,
            onDragOver: onReorder ? e => {
              if (!dragId) return;
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              const box = e.currentTarget.getBoundingClientRect();
              const isAfter = e.clientY > box.top + box.height / 2;
              if (overId !== q.id) setOverId(q.id);
              if (after !== isAfter) setAfter(isAfter);
            } : undefined,
            onDrop: onReorder ? e => {
              e.preventDefault();
              if (dragId && dragId !== q.id) onReorder(dragId, q.id, after);
              endDrag();
            } : undefined,
            onDragEnd: onReorder ? endDrag : undefined,
          },
            h('td', {
              className: 'xl-rownum' + (onReorder ? ' xl-grip' : ''),
              title: onReorder ? 'ドラッグで並べ替え' : undefined,
              onMouseDown: onReorder ? () => setGrabId(q.id) : undefined,
              onMouseUp: onReorder ? () => setGrabId(null) : undefined,
            }, onReorder ? h('span', { className: 'g' }, '⠿') : null, rowNo),
            h('td', null, h('div', { className: 'xl-cell', style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '2px 6px' } },
              onSetUrl
                ? h('input', {
                    type: 'text', className: 'xl-url', value: q.url || '',
                    placeholder: 'URLを貼り付け（写真だけでも可）',
                    onChange: e => onSetUrl(q.id, e.target.value),
                  })
                : h('span', { style: { flex: '1 1 auto', color: q.url ? '#1f2328' : '#999' } }, q.url || '（URLなし）'),
              q.url
                ? (onOpenLink
                    ? h('button', {
                        onClick: () => onOpenLink(q.id),
                        className: 'xl-link', style: { flex: '0 0 auto', background: 'none', border: 0, cursor: 'pointer' },
                        title: 'アプリの中で開く',
                      }, '開く →')
                    : h('a', {
                        href: q.url, target: '_blank', rel: 'noopener noreferrer',
                        className: 'xl-link', style: { flex: '0 0 auto' },
                      }, '開く →'))
                : null
            )),
            h('td', null, h('div', { className: 'xl-cell', style: { padding: '2px 6px', display: 'flex', alignItems: 'center', gap: '6px' } },
              h('select', {
                className: 'xl-select', value: r.correct,
                onChange: e => onSetCount(q.id, 'correct', Number(e.target.value))
              }, COUNT_OPTIONS.map(n => h('option', { key: n, value: n }, n))),
              onCorrect && h(CorrectButton, {
                count: r.correct,
                onAdd: () => onCorrect(q.id),
                onUndo: () => onSetCount(q.id, 'correct', Math.max(0, r.correct - 1)),
              })
            )),
            h('td', null, h(PhotoCell, {
              pids: photoIdsOf(data.photos, q.id),
              isTarget: pasteTarget === q.id,
              onOpen: i => onOpenPhoto(q.id, i),
              onPick: () => onPickPhoto(q.id),
            })),
            (onDeleteRow || onDuplicate) && h('td', null, h('div', { className: 'xl-cell', style: { display: 'flex', gap: '4px' } },
              onDuplicate && h('button', {
                className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px', fontSize: '12px' },
                onClick: () => onDuplicate(q.id), title: 'この問題をコピーして下に追加'
              }, '複製'),
              onDeleteRow && h('button', {
                className: 'xl-btn xl-btn-sub', style: { padding: '2px 8px', fontSize: '12px', color: '#a11' },
                onClick: () => onDeleteRow(q.id), title: 'この行を削除'
              }, '×')
            ))
          );
        })
      )
    )
  );
}

// ── 出題ページ ────────────────────────────────────────────────────────────────
function DrawPage({ data, setData, onShowPhoto, setMsg, sel, onOpenLink, progress, setProgress, markQuestionDone }) {
  const isPhone = useIsPhone();
  const { theme, unitsOfTheme, unit, setThemeId, setUnitId } = sel;
  // 前回の続きから始められるように、条件と抽選結果を読み戻す（同じ単元のときだけ）
  const saved = useRef(loadDraw());
  const prev = saved.current && unit && saved.current.unitId === unit.id ? saved.current : null;
  const [filterCorrect, setFilterCorrect] = useState(prev ? (prev.filterCorrect || '') : '');
  const [count, setCount] = useState(prev && prev.count ? prev.count : 5);
  const [rangeStart, setRangeStart] = useState(prev && prev.rangeStart ? prev.rangeStart : 1);
  const [rangeEnd, setRangeEnd] = useState(prev ? (prev.rangeEnd || 0) : 0); // 0 は「最後まで」
  // 抽選結果は問題のIDだけを持つ（並べ替えやURLの変更にそのまま追随する）
  const [results, setResults] = useState(() => {
    if (!prev || !unit) return [];
    const ids = new Set(unit.questions.map(q => q.id));
    return (prev.results || []).filter(id => ids.has(id));
  });
  const [pasteTarget, setPasteTarget] = useState(null);

  const total = unit ? unit.questions.length : 0;
  const endNo = rangeEnd > 0 ? Math.min(rangeEnd, total) : total;

  // 単元を変えたら、Excelと同じく範囲は 1〜問題数 に戻す。
  // 開き直した直後は「前回の続き」なので消さない。
  const shownUnit = useRef(unit ? unit.id : '');
  useEffect(() => {
    const id = unit ? unit.id : '';
    if (shownUnit.current === id) return;
    shownUnit.current = id;
    setResults([]); setPasteTarget(null); setRangeStart(1); setRangeEnd(0);
  }, [unit ? unit.id : '']);

  // 開いている単元と条件、抽選結果を覚えておく
  useEffect(() => {
    if (!unit) return;
    saveDraw({
      themeId: theme ? theme.id : '', unitId: unit.id,
      rangeStart, rangeEnd, filterCorrect, count, results,
    });
  }, [theme ? theme.id : '', unit ? unit.id : '', rangeStart, rangeEnd, filterCorrect, count, results]);

  useWindowPaste(!!pasteTarget, clipboard => {
    const files = imageFilesFrom(clipboard, true);
    if (!files.length) return false;
    const existing = photoIdsOf(data.photos, pasteTarget);
    attachPhoto(pasteTarget, files[0], setData, existing)
      .then(({ sameAs }) => {
        setPasteTarget(null);
        setMsg(`写真を入れました（${existing.length + 1}枚目・${fileLabel(files[0])}）`
          + (sameAs ? `　※この問題の${sameAs}枚目と同じ画像です。コピーし直してから貼り直してください` : ''));
      })
      .catch(e => setMsg('写真を保存できませんでした: ' + (e && e.message ? e.message : e)));
    return true;
  });

  if (!unit) {
    return h('div', { className: 'xl-empty' },
      data.units.length ? 'このテーマには単元がありません。「単元管理」タブで作成してください。'
                        : '単元がありません。「単元管理」タブでテーマと単元を作成してください。');
  }

  const pool = unit ? unit.questions.map((q, i) => ({ q, no: i + 1 })).filter(item => {
    if (item.no < rangeStart || item.no > endNo) return false;
    const r = data.records[item.q.id] || { correct: 0, wrong: 0 };
    if (filterCorrect !== '' && r.correct !== Number(filterCorrect)) return false;
    return true;
  }) : [];

  // 覚えているのはIDだけなので、表示のたびに今の問題と番号を引き直す
  const shown = results
    .map(id => {
      const i = unit.questions.findIndex(q => q.id === id);
      return i < 0 ? null : { q: unit.questions[i], no: i + 1 };
    })
    .filter(Boolean);

  const filterClass = 'bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white';

  const themeSelect = h('select', {
    title: 'テーマ', value: theme ? theme.id : '', onChange: e => setThemeId(e.target.value),
    style: isPhone ? { width: '100%', minWidth: 0 } : { minWidth: '180px' },
  }, data.themes.map(t => h('option', { key: t.id, value: t.id }, t.name)));

  const unitSelect = h('select', {
    title: '単元', value: unit ? unit.id : '', onChange: e => setUnitId(e.target.value),
    style: isPhone ? { width: '100%', minWidth: 0 } : { minWidth: '200px' },
  }, unitsOfTheme.map(u => h('option', { key: u.id, value: u.id }, `${u.name}（全${u.questions.length}問）`)));

  const drawButton = h('button', {
    className: 'xl-btn',
    disabled: pool.length === 0,
    onClick: () => { setResults(sample(pool, count).map(item => item.q.id)); setPasteTarget(null); },
  }, shown.length ? '🎲 再抽選' : '🎲 抽選する');

  const numBox = (title, value, onChange, extra) => h('input', {
    title, type: 'number', min: 1, value, onChange,
    style: { width: '100%', minWidth: 0, fontSize: '16px', padding: '6px 4px', textAlign: 'center' },
    ...(extra || {}),
  });

  // スマホは「テーマ・単元」で1行、「開始・終了・数・正解・抽選」で1行に詰める
  const phoneToolbar = h('div', { className: 'xl-toolbar', style: { padding: '6px 8px' } },
    h('div', { style: { display: 'flex', gap: '6px' } },
      h('div', { style: { flex: '1 1 0', minWidth: 0 } }, themeSelect),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } }, unitSelect)
    ),
    h('div', { style: { display: 'flex', gap: '4px', alignItems: 'flex-end', marginTop: '6px' } },
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '開始'),
        numBox('開始No', rangeStart, e => setRangeStart(Math.max(1, Number(e.target.value) || 1)), { max: total || 1 })),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '終了'),
        numBox('終了No', endNo, e => setRangeEnd(Math.max(1, Number(e.target.value) || 1)), { max: total || 1 })),
      h('div', { style: { flex: '1 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '出題'),
        numBox('出題数', count, e => setCount(Math.max(1, Number(e.target.value) || 1)))),
      h('div', { style: { flex: '1.3 1 0', minWidth: 0 } },
        h('label', { className: 'xl-label' }, '正解数'),
        h('select', {
          title: '正解回数', value: filterCorrect, onChange: e => setFilterCorrect(e.target.value),
          style: { width: '100%', minWidth: 0, fontSize: '16px', padding: '6px 2px' },
        },
          h('option', { value: '' }, '指定なし'),
          COUNT_OPTIONS.map(n => h('option', { key: n, value: String(n) }, `${n}回`))
        )),
      h('div', { style: { flex: '0 0 auto' } }, drawButton)
    )
  );

  return h('div', { className: 'xl-app' },
    isPhone ? phoneToolbar : h('div', { className: 'xl-toolbar flex flex-wrap items-end gap-4' },
      h('div', { className: 'xl-field-wide' },
        h('label', { className: 'xl-label' }, 'テーマ'),
        h('select', { title: 'テーマ', value: theme ? theme.id : '', onChange: e => setThemeId(e.target.value), style: { minWidth: '180px' } },
          data.themes.map(t => h('option', { key: t.id, value: t.id }, t.name))
        )
      ),
      h('div', { className: 'xl-field-wide' },
        h('label', { className: 'xl-label' }, '単元'),
        h('select', { title: '単元', value: unit ? unit.id : '', onChange: e => setUnitId(e.target.value), style: { minWidth: '200px' } },
          unitsOfTheme.map(u => h('option', { key: u.id, value: u.id }, `${u.name}（全${u.questions.length}問）`))
        )
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '開始No'),
        h('input', {
          title: '開始No', type: 'number', min: 1, max: total || 1, value: rangeStart, style: { width: '80px' },
          onChange: e => setRangeStart(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '終了No'),
        h('input', {
          title: '終了No', type: 'number', min: 1, max: total || 1, value: endNo, style: { width: '80px' },
          onChange: e => setRangeEnd(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '正解回数'),
        h('select', { title: '正解回数', value: filterCorrect, onChange: e => setFilterCorrect(e.target.value) },
          h('option', { value: '' }, '指定なし'),
          COUNT_OPTIONS.map(n => h('option', { key: n, value: String(n) }, `${n} 回`))
        )
      ),
      h('div', null,
        h('label', { className: 'xl-label' }, '出題数'),
        h('input', {
          title: '出題数', type: 'number', min: 1, value: count, style: { width: '80px' },
          onChange: e => setCount(Math.max(1, Number(e.target.value) || 1))
        })
      ),
      drawButton
    ),

    h(GaugeBar, {
      unit, records: data.records, progress,
      onSetGoal: n => setProgress(pv => { const next = { ...pv, goal: n }; saveProgress(next); return next; }),
    }),

    pasteTarget && h('div', { className: 'xl-target' }, '写真の貼り付け先を選択中です。Ctrl+V で貼り付けてください。'),

    shown.length === 0
      ? h('div', { className: 'xl-empty' }, '「抽選する」を押すと、条件に合う問題からランダムに出題します。')
      : h(QuestionSheet, {
          questions: shown.map(r => r.q), nos: shown.map(r => r.no), data,
          onSetCount: (qid, field, value) => setCountFor(qid, field, value, setData),
          onOpenPhoto: onShowPhoto,
          onPickPhoto: qid => setPasteTarget(pasteTarget === qid ? null : qid),
          pasteTarget, onOpenLink, compact: true,
          // 正解を押したら回数を1つ増やし、その日「手をつけた問題」にも数える
          onCorrect: qid => {
            const now = (data.records[qid] || {}).correct || 0;
            setCountFor(qid, 'correct', Math.min(COUNT_MAX, now + 1), setData);
            markQuestionDone(qid);
          },
        }),

    h('div', { className: 'xl-status' },
      `${theme ? theme.name : '-'} ／ ${unit ? unit.name : '-'} ｜ 全${total}問 ｜ 出題範囲 ${rangeStart}〜${endNo} ｜ 条件に合う問題 ${pool.length}問`
      + (shown.length ? ` ｜ 出題中 ${shown.length}問` : '')
      + (pool.length > 0 && pool.length < count ? `　※条件に合うのが${pool.length}問しかないため、${pool.length}問だけ出題します` : '')
    )
  );
}

// ── 単元管理ページ ────────────────────────────────────────────────────────────
function UnitsPage({ data, setData, onShowPhoto, setMsg, sel, onOpenLink }) {
  const { theme, unitsOfTheme, unit, setThemeId, setUnitId } = sel;
  const [pasteTarget, setPasteTarget] = useState(null);
  const [urlText, setUrlText] = useState('');
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState('');
  const [addingTheme, setAddingTheme] = useState(false);
  const [newThemeName, setNewThemeName] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [confirmThemeDelete, setConfirmThemeDelete] = useState(false);
  const [scrollSignal, setScrollSignal] = useState(0);

  function updateUnit(fn) {
    setData(d => ({ ...d, units: d.units.map(u => u.id === unit.id ? fn(u) : u) }));
  }

  // 空の問題を1件足す。Noはそれまでの最後の問題+1（＝末尾に追加）
  function addQuestion() {
    if (!unit) return;
    const q = { id: newQuestionId(), url: '' };
    updateUnit(u => ({ ...u, questions: [...u.questions, q] }));
    setScrollSignal(n => n + 1);
    setMsg(`問題 ${unit.questions.length + 1} を追加しました。URLか写真を入れてください。`);
  }

  function addFromUrls(urls) {
    if (!unit) return 0;
    const known = new Set(unit.questions.map(q => q.url).filter(Boolean));
    const fresh = urls.filter(u => !known.has(u));
    if (!fresh.length) return 0;
    updateUnit(u => ({
      ...u,
      questions: [...u.questions, ...fresh.map(url => ({ id: newQuestionId(), url }))],
    }));
    setScrollSignal(n => n + 1);
    return fresh.length;
  }

  // 問題をコピーして真下に足す。Noは新しく振られ、記録は0から始める
  async function duplicateQuestion(qid) {
    if (!unit) return;
    const src = unit.questions.find(q => q.id === qid);
    if (!src) return;
    const copy = { id: newQuestionId(), url: src.url };
    const newPids = await copyPhotos(photoIdsOf(data.photos, qid));
    setData(d => ({
      ...d,
      units: d.units.map(u => {
        if (u.id !== unit.id) return u;
        const qs = u.questions.slice();
        qs.splice(qs.findIndex(q => q.id === qid) + 1, 0, copy);
        return { ...u, questions: qs };
      }),
      photos: newPids.length ? { ...d.photos, [copy.id]: newPids } : d.photos,
    }));
    setMsg(`問題をコピーしました（写真${newPids.length}枚も複製。正解回数は0から）`);
  }

  // ドラッグした問題を、落とした行の前（または後ろ）へ移す
  function reorder(fromId, toId, after) {
    updateUnit(u => {
      const qs = u.questions.slice();
      const from = qs.findIndex(q => q.id === fromId);
      if (from < 0) return u;
      const [moved] = qs.splice(from, 1);
      let to = qs.findIndex(q => q.id === toId);
      if (to < 0) return u;
      qs.splice(after ? to + 1 : to, 0, moved);
      return { ...u, questions: qs };
    });
  }

  function setUrl(qid, url) {
    updateUnit(u => ({ ...u, questions: u.questions.map(q => q.id === qid ? { ...q, url } : q) }));
  }

  // 表の上で Ctrl+V：画像なら写真として、文字ならURLの行として取り込む
  useWindowPaste(!!unit, clipboard => {
    const files = imageFilesFrom(clipboard, true);
    if (files.length) {
      if (pasteTarget) {
        const no = unit.questions.findIndex(q => q.id === pasteTarget) + 1;
        const existing = photoIdsOf(data.photos, pasteTarget);
        attachPhoto(pasteTarget, files[0], setData, existing)
          .then(({ sameAs }) => {
            setPasteTarget(null);
            setMsg(`問題 ${no} に写真を入れました（${existing.length + 1}枚目・${fileLabel(files[0])}）`
              + (sameAs ? `　※この問題の${sameAs}枚目と同じ画像です。コピーし直してから貼り直してください` : ''));
          })
          .catch(e => setMsg('写真を保存できませんでした: ' + (e && e.message ? e.message : e)));
      } else {
        assignPhotos(unit.questions.map(q => q.id), data.photos, files, setData).then(setMsg);
      }
      return true;
    }
    const urls = parseUrls(clipboard.getData('text') || '');
    if (!urls.length) return false;
    const added = addFromUrls(urls);
    setMsg(added ? `${added}件のURLを追加しました` : '追加できるURLがありませんでした（すべて登録済み）');
    return true;
  });

  // 公開ページはサンドボックス内で動き prompt/confirm が無視されるので、画面内で完結させる
  function createUnit() {
    const name = newName.trim() || `単元${data.units.length + 1}`;
    const unitNew = { id: `u${Date.now()}`, themeId: theme ? theme.id : '', name, questions: [] };
    setData(d => ({ ...d, units: [...d.units, unitNew] }));
    setUnitId(unitNew.id);
    setNewName('');
    setAdding(false);
    setMsg(`「${name}」を作成しました。「＋ 問題を追加」かURLの貼り付けで問題を入れてください。`);
  }

  function createTheme() {
    const name = newThemeName.trim() || `テーマ${data.themes.length + 1}`;
    const t = { id: newThemeId(), name };
    setData(d => ({ ...d, themes: [...d.themes, t] }));
    setThemeId(t.id);
    setNewThemeName('');
    setAddingTheme(false);
    setMsg(`テーマ「${name}」を作成しました。「＋ 新しい単元」で単元を追加してください。`);
  }

  function deleteTheme() {
    if (!theme) return;
    setConfirmThemeDelete(false);
    const gone = data.units.filter(u => u.themeId === theme.id);
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      gone.forEach(u => u.questions.forEach(q => { delete records[q.id]; delete photos[q.id]; }));
      return {
        ...d,
        themes: d.themes.filter(t => t.id !== theme.id),
        units: d.units.filter(u => u.themeId !== theme.id),
        records, photos,
      };
    });
    setMsg(`テーマ「${theme.name}」と単元${gone.length}件を削除しました（Ctrl+Z で元に戻せます）`);
  }

  async function deleteUnit() {
    if (!unit) return;
    setConfirmDelete(false);
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      unit.questions.forEach(q => { delete records[q.id]; delete photos[q.id]; });
      const units = d.units.filter(u => u.id !== unit.id);
      return { ...d, units, records, photos };
    });
    // 選択は切り替えない。存在しない間は先頭の単元が表示され、Ctrl+Zで戻すと元の単元に復帰する
    setMsg(`「${unit.name}」を削除しました（Ctrl+Z で元に戻せます）`);
  }

  function deleteRow(qid) {
    setData(d => {
      const records = { ...d.records };
      const photos = { ...d.photos };
      delete records[qid];
      delete photos[qid];
      return {
        ...d,
        units: d.units.map(u => u.id === unit.id ? { ...u, questions: u.questions.filter(q => q.id !== qid) } : u),
        records, photos,
      };
    });
  }

  const inputClass = 'w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white';

  // 「＋ 新しい単元」を押すと出てくる入力欄
  const newUnitForm = adding
    ? h('div', { className: 'flex items-end gap-2' },
        h('div', null,
          h('label', { className: 'xl-label' }, '新しい単元の名前'),
          h('input', {
            type: 'text', value: newName, autoFocus: true, style: { width: '220px' },
            placeholder: '例: 離散数学',
            onChange: e => setNewName(e.target.value),
            onKeyDown: e => { if (e.key === 'Enter') createUnit(); if (e.key === 'Escape') { setAdding(false); setNewName(''); } }
          })
        ),
        h('button', { className: 'xl-btn', onClick: createUnit }, '作成'),
        h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAdding(false); setNewName(''); } }, 'やめる')
      )
    : h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAdding(true); setNewName(''); } }, '＋ 新しい単元');

  // テーマの行（新規作成・名前変更・削除）
  const themeRow = h('div', { className: 'xl-toolbar flex flex-wrap items-end gap-3' },
    h('div', null,
      h('label', { className: 'xl-label' }, 'テーマ（試験）'),
      h('select', {
        title: 'テーマ', value: theme ? theme.id : '', style: { minWidth: '200px' },
        onChange: e => { setThemeId(e.target.value); setPasteTarget(null); setConfirmDelete(false); setConfirmThemeDelete(false); },
      }, data.themes.map(t => h('option', { key: t.id, value: t.id },
        `${t.name}（${data.units.filter(u => u.themeId === t.id).length}単元）`)))
    ),
    theme && h('div', { className: 'xl-field-wide' },
      h('label', { className: 'xl-label' }, 'テーマ名'),
      h('input', {
        type: 'text', value: theme.name, style: { width: '180px' },
        onChange: e => {
          const v = e.target.value;
          setData(d => ({ ...d, themes: d.themes.map(t => t.id === theme.id ? { ...t, name: v } : t) }));
        }
      })
    ),
    addingTheme
      ? h('div', { className: 'flex items-end gap-2' },
          h('div', null,
            h('label', { className: 'xl-label' }, '新しいテーマの名前'),
            h('input', {
              type: 'text', value: newThemeName, autoFocus: true, style: { width: '200px' },
              placeholder: '例: 税理士試験',
              onChange: e => setNewThemeName(e.target.value),
              onKeyDown: e => { if (e.key === 'Enter') createTheme(); if (e.key === 'Escape') { setAddingTheme(false); setNewThemeName(''); } }
            })
          ),
          h('button', { className: 'xl-btn', onClick: createTheme }, '作成'),
          h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAddingTheme(false); setNewThemeName(''); } }, 'やめる')
        )
      : h('button', { className: 'xl-btn xl-btn-sub', onClick: () => { setAddingTheme(true); setNewThemeName(''); } }, '＋ 新しいテーマ'),
